[package]
name = "mirrordock"
version = "0.2.9"
description = "Local-first Android desktop mirroring"
authors = ["MirrorDock"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mirrordock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：菜单栏/托盘图标（关闭按钮=最小化、菜单栏快捷功能、macOS 隐藏 Dock）。
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 全局快捷键（B-快捷键）：镜像窗口获得焦点时主窗口收不到键盘事件，只有系统级
# 快捷键能在不切回主窗口的前提下触发截图/录制/旋转。仅在会话进行中注册。
tauri-plugin-global-shortcut = "2"
# 开机自动启动（设置中心「通用」）。
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 许可证签名验证（R3-01）：ed25519 公钥编译进二进制，私钥永不出内部环境。
# 只用 verify 与显式 from_bytes，不引入随机数与网络功能。
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

# C4-01 伴侣 App 同网加密会话 POC：TLS 1.3 服务端 + 自签证书出带指纹校验。
# ring 提供者（与 rcgen 对齐）；仅监听一次配对连接，不做常驻服务。
# 注意：必须放在 [target.'cfg(unix)'.dependencies] 之前——TOML 节段会延续到
# 下一个节段，放错位置会把这些依赖变成「仅 Unix」，Windows 构建直接缺依赖。
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
sha2 = "0.10"
getrandom = "0.2"

# 仅 Unix：向镜像子进程发送 SIGTERM 做优雅结束（强杀会让录制中的 MP4 缺 moov
# 索引而无法播放，已在真机实验证实）。Windows 的 TerminateProcess 无对应机制，
# 保持原行为并把风险如实记录在 DEVELOPMENT_TASKS.md。
[target.'cfg(unix)'.dependencies]
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
