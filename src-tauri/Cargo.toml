[package]
name = "mirrordock"
version = "0.1.0"
description = "Local-first Android desktop mirroring"
authors = ["MirrorDock"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mirrordock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 许可证签名验证（R3-01）：ed25519 公钥编译进二进制，私钥永不出内部环境。
# 只用 verify 与显式 from_bytes，不引入随机数与网络功能。
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

# 仅 Unix：向镜像子进程发送 SIGTERM 做优雅结束（强杀会让录制中的 MP4 缺 moov
# 索引而无法播放，已在真机实验证实）。Windows 的 TerminateProcess 无对应机制，
# 保持原行为并把风险如实记录在 DEVELOPMENT_TASKS.md。
[target.'cfg(unix)'.dependencies]
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
