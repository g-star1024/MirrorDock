name: Companion App

on:
  push:
    branches: [main]
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # runner 预装 Android SDK（/usr/local/lib/android/sdk）与 Gradle。
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Show SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: Restore signing keystore (fixed key for cover-install)
        # X10-21：固定签名密钥存 GitHub Secrets（COMPANION_KEYSTORE_BASE64 /
        # COMPANION_STORE_PASSWORD），保证跨版本 APK 签名一致、可直接覆盖安装。
        env:
          COMPANION_KEYSTORE_BASE64: ${{ secrets.COMPANION_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$COMPANION_KEYSTORE_BASE64" ]; then
            echo "::warning::COMPANION_KEYSTORE_BASE64 未配置，回退默认 debug 签名"
          else
            echo "$COMPANION_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/companion.keystore"
          fi
      - name: Build debug APK
        working-directory: companion
        env:
          COMPANION_KEYSTORE: ${{ runner.temp }}/companion.keystore
          COMPANION_STORE_PASSWORD: ${{ secrets.COMPANION_STORE_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --no-daemon
      # M4-5：artifact 名带伴侣端版本号（读 build.gradle.kts 的 versionName），
      # 多版本 artifact 不再互相混淆。
      - name: Rename APK with version
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' companion/app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "companion version: ${VERSION}"
          mv companion/app/build/outputs/apk/debug/app-debug.apk \
             "companion/app/build/outputs/apk/debug/MirrorDock-companion-${VERSION}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirrordock-companion-debug
          path: companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
