name: Companion App

on:
  push:
    branches: [main]
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # runner 预装 Android SDK（/usr/local/lib/android/sdk）与 Gradle。
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Show SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: Build debug APK
        working-directory: companion
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirrordock-companion-debug
          path: companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
