# NAS 版镜像构建。
#
# 【为什么单独一个 workflow，而不是并进 build.yml】
# build.yml 承载四平台桌面端打包 + Release + updater 签名，任何改动都有让现有
# 发版链路失败的风险。NAS 版与之没有依赖顺序关系，独立成文件既能并行，也把风险
# 隔离——本文件出错最多是镜像没发布，绝不会波及桌面端 Release。
#
# 【触发时机】
#   • release 发布 → 产出与桌面端同版本号的镜像（版本号取自 tag）
#   • 主干上 nas/ 或 crates/ 变更 → 产出 main 标签镜像，便于随时试新
#   • 手动触发

name: NAS image

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nas/**"
      - "crates/**"
      - "Cargo.toml"

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GHCR 与仓库同源：镜像自动继承仓库可见性，不必另配凭据。
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像名与标签
        id: meta
        run: |
          # GHCR 不接受大写仓库名，统一转小写。
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/mirrordock-nas" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: nas/Dockerfile
          # arm64 一并构建：飞牛与主流 NAS 既有 x86 机型也有 ARM 机型。
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
