# NAS 版镜像构建。
#
# 【为什么单独一个 workflow，而不是并进 build.yml】
# build.yml 承载四平台桌面端打包 + Release + updater 签名，任何改动都有让现有
# 发版链路失败的风险。NAS 版与之没有依赖顺序关系，独立成文件既能并行，也把风险
# 隔离——本文件出错最多是镜像没发布，绝不会波及桌面端 Release。
#
# 【触发时机】
#   • release 发布 → 产出与桌面端同版本号的镜像（版本号取自 tag）
#   • 主干上 nas/ 或 crates/ 变更 → 产出 main 标签镜像，便于随时试新
#   • 手动触发

name: NAS image

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nas/**"
      - "crates/**"
      - "Cargo.toml"
      # 本文件自身变更也要自测：否则改坏了 workflow 只能等下次 nas/ 改动才发现。
      - ".github/workflows/nas-image.yml"

jobs:
  # NAS 侧 Rust 校验。此前 build.yml 只跑 src-tauri（--manifest-path src-tauri/Cargo.toml），
  # 而 workspace 又显式 exclude 了 src-tauri → NAS 服务端代码在 CI 上原本**零校验**，
  # 改坏了只能等用户在 NAS 上录一场空视频才发现。补在上游，先于镜像构建执行。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee verify.log
      - name: cargo clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee -a verify.log
      - name: cargo test
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee -a verify.log

      # 为什么每个检查单独一步并 tee：job 正文日志要仓库管理员权限才下得下来
      # （403），看不到原文就是盲修。拆独立 step 后，即便没有管理员权限也能从
      # jobs API 看出是哪一步红；失败时日志还会推到 ci-logs-nas 分支，
      # 任何人 git fetch 就能拿到完整原文。
      - name: 校验日志尾部
        if: always()
        run: |
          echo "::group::verify.log 尾部 300 行"
          tail -n 300 verify.log 2>/dev/null || echo "(无日志)"
          echo "::endgroup::"

      - name: 把校验日志推到 ci-logs-nas 分支
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name  "mirrordock-ci-bot"
          git config user.email "ci-bot@invalid.local"
          git checkout --orphan ci-logs-nas
          git rm -r --cached . -q
          cp verify.log "nas-verify-run-${GITHUB_RUN_ID}.log"
          git add -f "nas-verify-run-${GITHUB_RUN_ID}.log"
          git commit -q -m "nas-image verify 日志 run ${GITHUB_RUN_ID} (${GITHUB_SHA})"
          git push -f origin ci-logs-nas

  image:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      # contents: write 只为失败时把构建日志推到 ci-logs-nas 分支（见文末说明）
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GHCR 与仓库同源：镜像自动继承仓库可见性，不必另配凭据。
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像名与标签
        id: meta
        run: |
          # GHCR 不接受大写仓库名，统一转小写。
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/mirrordock-nas" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main" >> "$GITHUB_OUTPUT"
          fi

      # 【为什么不用 docker/build-push-action】
      # 它需要仓库管理员权限才能下载 job 日志（`GET .../actions/jobs/{id}/logs`
      # 返回 403 Must have admin rights）。构建一旦失败，除了「exit code」什么
      # 都看不到——这正是 X10-97 用三次发版失败换来的教训：**先建立拿到原文的能力，
      # 再改代码**。改用 CLI 直接构建，把完整输出 tee 成文件并作为 artifact 上传，
      # 任何人都能拿到编译器原文。
      # 【为什么要有这一步】
      # GHCR 的镜像名是 ghcr.io/<owner>/<仓库名>/<包名>，中间那段仓库名极易漏写。
      # 2026-10-11 首测就因为这个：docker-compose.yml 里写成了
      # ghcr.io/g-star1024/mirrordock-nas（漏了 /mirrordock），用户照 README 粘贴
      # 后 pull 直接 403 denied——而镜像本身是好的，纯属清单写错。
      # 这类「产物对了、文档错了」的问题在 CI 里完全看不出来，只能靠显式比对。
      - name: 校验 compose 里的镜像名与即将发布的镜像名一致
        run: |
          set -e
          WANT="${{ steps.meta.outputs.image }}:latest"
          GOT="$(grep -m1 -E '^[[:space:]]*image:' nas/docker-compose.yml | awk '{print $2}')"
          echo "compose 声明: ${GOT}"
          echo "本次将发布:   ${WANT}"
          if [ "${GOT}" != "${WANT}" ]; then
            echo "::error::镜像名不一致。compose 写的是 ${GOT}，实际会发布 ${WANT}。用户按 README 粘贴 compose 将 pull 失败（403 denied）。"
            exit 1
          fi
          echo "一致性校验通过"

      - name: 构建并推送镜像
        id: build
        run: |
          set -o pipefail
          docker buildx build \
            --file nas/Dockerfile \
            --platform "${PLATFORMS}" \
            --tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --tag "${{ steps.meta.outputs.image }}:latest" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --progress=plain \
            --push . 2>&1 | tee nas-build.log
        env:
          # 双架构：飞牛与主流 NAS 既有 x86 机型也有 ARM 机型。
          # arm64 走 QEMU 模拟编译，比 amd64 慢数倍；amd64 先行跑通后才开启，
          # 这样排错时不必每次都付这个代价。
          # 注：buildx 在所有平台都构建成功后才 push，任一平台失败则不会覆盖
          # 已发布的旧标签——开启 arm64 不会让 amd64 用户拿到坏镜像。
          PLATFORMS: linux/amd64,linux/arm64

      # 【为什么要有这一步】
      # 2026-10-11 飞牛真机实锤：SIGINT 从未送达 scrcpy——debian:12-slim 里
      # /usr/bin/kill 不存在（kill 只是 shell 内建命令，而 exec 不经过 shell），
      # Command::new("kill") 静默失败 → 15 秒后 SIGKILL → MP4 永远缺 moov、
      # 浏览器拒播。而这个 bug 在开发机 macOS 上**测不出来**（macOS 有 /bin/kill），
      # 所以门禁必须跑在与生产一致的容器里，不能只在开发机上跑。
      #
      # 脚本用 shell 冒充 scrcpy（经 SCRCPY 环境变量注入），走完整的
      # /api/record/start → /api/record/stop 链路，并带一组「替身忽略 INT/TERM」
      # 的反向对照——只做正向断言会退化成「进程恰好退出了」的假阳性。
      - name: 录制停止信号链路门禁（真容器）
        run: |
          set -euo pipefail
          # GHCR 推送后偶有短暂一致性延迟，重试拉取再判定。
          for i in $(seq 1 10); do
            if docker pull "${{ steps.meta.outputs.image }}:latest"; then break; fi
            echo "镜像尚未可读，第 $i 次重试…"
            sleep 20
          done
          ./scripts/nas-record-stop-gate.sh "${{ steps.meta.outputs.image }}:latest"

      # 摘要常驻：成功也能一眼看到产物摘要，失败时尾部即为报错现场。
      - name: 构建日志尾部
        if: always()
        run: |
          echo "::group::nas-build.log 尾部 300 行"
          tail -n 300 nas-build.log 2>/dev/null || echo "(无日志)"
          echo "::endgroup::"

      - name: 上传完整构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nas-build-log
          path: nas-build.log
          retention-days: 7

      # 【为什么还要推到 git 分支】
      # artifact 下载同样要管理员权限（401）——上面那步对没有 admin 权限的人
      # 依然拿不到。把日志推成一个孤儿分支，任何有仓库读权限的人（包括只持有
      # SSH key 的协作者）都能 `git fetch origin ci-logs-nas` 取到原文。
      # 这是「先建立拿到原文的能力，再改代码」这条元教训落成的最后一环。
      - name: 把构建日志推到 ci-logs-nas 分支
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name  "mirrordock-ci-bot"
          git config user.email "ci-bot@invalid.local"
          git checkout --orphan ci-logs-nas
          git rm -r --cached . -q
          cp nas-build.log "nas-build-run-${GITHUB_RUN_ID}.log"
          git add -f "nas-build-run-${GITHUB_RUN_ID}.log"
          git commit -q -m "nas-image 构建日志 run ${GITHUB_RUN_ID} (${GITHUB_SHA})"
          git push -f origin ci-logs-nas
