# NAS 版镜像构建。
#
# 【为什么单独一个 workflow，而不是并进 build.yml】
# build.yml 承载四平台桌面端打包 + Release + updater 签名，任何改动都有让现有
# 发版链路失败的风险。NAS 版与之没有依赖顺序关系，独立成文件既能并行，也把风险
# 隔离——本文件出错最多是镜像没发布，绝不会波及桌面端 Release。
#
# 【触发时机】
#   • release 发布 → 产出与桌面端同版本号的镜像（版本号取自 tag）
#   • 主干上 nas/ 或 crates/ 变更 → 产出 main 标签镜像，便于随时试新
#   • 手动触发

name: NAS image

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nas/**"
      - "crates/**"
      - "Cargo.toml"
      # 本文件自身变更也要自测：否则改坏了 workflow 只能等下次 nas/ 改动才发现。
      - ".github/workflows/nas-image.yml"

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GHCR 与仓库同源：镜像自动继承仓库可见性，不必另配凭据。
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像名与标签
        id: meta
        run: |
          # GHCR 不接受大写仓库名，统一转小写。
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/mirrordock-nas" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main" >> "$GITHUB_OUTPUT"
          fi

      # 【为什么不用 docker/build-push-action】
      # 它需要仓库管理员权限才能下载 job 日志（`GET .../actions/jobs/{id}/logs`
      # 返回 403 Must have admin rights）。构建一旦失败，除了「exit code」什么
      # 都看不到——这正是 X10-97 用三次发版失败换来的教训：**先建立拿到原文的能力，
      # 再改代码**。改用 CLI 直接构建，把完整输出 tee 成文件并作为 artifact 上传，
      # 任何人都能拿到编译器原文。
      - name: 构建并推送镜像
        id: build
        run: |
          set -o pipefail
          docker buildx build \
            --file nas/Dockerfile \
            --platform "${PLATFORMS}" \
            --tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --tag "${{ steps.meta.outputs.image }}:latest" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --progress=plain \
            --push . 2>&1 | tee nas-build.log
        env:
          # 【为什么先只做 amd64】
          # arm64 走 QEMU 模拟编译 SDL3 + scrcpy，动辄数小时；在 Dockerfile 还没
          # 跑通过一轮之前就上双架构，等于每次排错都要付几小时。先让 amd64 全链
          # 路跑绿、把镜像发出来，再单独加 arm64（届时只是一次已知可行的长构建）。
          # ARM NAS 用户在此期间用 `docker compose build` 在本地原生构建即可。
          PLATFORMS: linux/amd64

      # 摘要常驻：成功也能一眼看到产物摘要，失败时尾部即为报错现场。
      - name: 构建日志尾部
        if: always()
        run: |
          echo "::group::nas-build.log 尾部 300 行"
          tail -n 300 nas-build.log 2>/dev/null || echo "(无日志)"
          echo "::endgroup::"

      - name: 上传完整构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nas-build-log
          path: nas-build.log
          retention-days: 7
