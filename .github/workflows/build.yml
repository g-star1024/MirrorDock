name: build

# 触发策略（分层，避免互相取消与浪费额度）：
#   - 推送到 main（含普通提交）→ 只跑「验证」门禁（约 3 分钟），保证每次提交都有回归保护。
#   - 推送标签 v* → 验证 + 四平台打包（发版时才需要）。
#   - 也可在 Actions 页手动触发（默认同样跑完整打包）。
# 打包是最昂贵的一环，且不在每次提交时都需要；把两者分开后，日常提交不会再因
# concurrency.cancel-in-progress 取消正在进行的打包。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: 验证（Rust 单测 + 前端构建）
    runs-on: ubuntu-22.04
    # 显式超时：历史上出现过 runner label 失效导致作业长期排队、拖垮整个运行的情况。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本需与 pnpm-lock.yaml 的 lockfileVersion 对应（当前为 9.0）。
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Rust 单元与集成测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 前端单元与组件测试
        run: pnpm test

      - name: 前端生产构建
        run: pnpm build

      # X10-73：伴侣端静态交叉校验。放在这里是为了让它成为**发版门禁**——
      # 2026-10-03 那次 v0.4.7 发版，伴侣 APK 的 Kotlin 编译失败导致
      # 「发布 GitHub Release」被跳过，四平台包全部白跑。本地没有 gradle 时
      # 这道检查是唯一能在 push 阶段拦住资源引用/类型错误的手段。
      - name: 伴侣端静态交叉校验
        run: python3 scripts/verify-companion.py

      # 注意：scripts/check-companion-kotlin.py **故意不放进 CI**（2026-10-03 实测
      # 放进去会让 verify 失败）。它依赖本机的 ~/.gradle 依赖缓存与
      # ~/Library/Android/sdk —— GitHub runner 上两者都不存在，脚本会 die(2)。
      # 它的定位是「本地提交前的快速类型检查」；CI 里的等价物是 companion-apk
      # job 的真实 gradle 构建。详见该脚本头部注释与 AGENTS.md。

  package:
    name: 打包 ${{ matrix.label }}
    needs: verify
    # 只在发版标签或手动触发时打包；日常推送到 main 不产出安装包。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    # X10-47：应用内自动更新需要 updater 签名私钥（minisign）。私钥只存在
    # GitHub secrets，本地备份在仓库外内部文档目录；无密码（密钥本身即机密）。
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - label: linux-x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: macos-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
          - label: macos-x64
            # macos-13（Intel）于 2025-12-04 已完全退役：被弃用的 runner label **不会报错**，
            # 而是排队到 24 小时上限后被自动取消（表现为该作业长期 queued，拖垮整个运行）。
            # macos-15-intel 是 GitHub 现存的最后一个托管 x86_64 macOS 镜像（约可用至 2027-08）。
            platform: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            gcc pkg-config meson ninja-build \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libavdevice-dev \
            libsdl2-dev libusb-1.0-0 libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # X10-98：tag 发版必须全新编译，禁用 rust 增量缓存。
      # 0.4.19-beta 事故实证：`Swatinem/rust-cache` 以 target 名为 key 缓存了
      # 0.4.18 的编译产物，0.4.19 的 package job 命中同一缓存键后，Cargo 指纹
      # 误判旧 `mirrordock` crate 为 fresh，**直接复用了 0.4.18 的旧二进制**——
      # 装出来的「0.4.19」版本串是 0.4.18、X10-95 修复（is_recorder）整个不在
      # 二进制里。日常 main 构建保留缓存提速，tag 发版用缓存等于拿旧代码发新版。
      - uses: Swatinem/rust-cache@v2
        # 仅非 tag（main / 手动）构建用缓存。
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # A1-08：随包分发 scrcpy v4.1 官方运行时（Windows / macOS；官方包内
      # 自带 adb）。URL 与 SHA-256 固定写死，下载后必须校验，不符即终止——
      # 防止供应链被替换。Linux 无官方包，运行时回退到用户 PATH（见
      # THIRD_PARTY_NOTICES.md）。
      - name: 下载并校验 scrcpy 运行时（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Genymobile/scrcpy/releases/download/v4.1/scrcpy-win64-v4.1.zip" -OutFile scrcpy.download
          $hash = (Get-FileHash scrcpy.download -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "5b12172b3264b2889f4583ee64752ce832e29bc8b1089dca81093459697165db") { throw "scrcpy SHA-256 mismatch: $hash" }
          Expand-Archive scrcpy.download -DestinationPath tmp-scrcpy
          New-Item -ItemType Directory -Force src-tauri/resources/scrcpy | Out-Null
          Move-Item tmp-scrcpy/scrcpy-win64-v4.1/* src-tauri/resources/scrcpy/
          # X10-79：scrcpy 启动时在自身目录找 scrcpy.png 当窗口/Dock 图标，
          # 缺了就刷「Could not open icon image」两行错误混进故障排查。统一用应用图标。
          Copy-Item src-tauri/icons/icon.png src-tauri/resources/scrcpy/scrcpy.png -Force

      - name: 下载并校验 scrcpy 运行时（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_ARCH" = "ARM64" ]; then
            NAME=scrcpy-macos-aarch64-v4.1.tar.gz
            SHA=20fd47c9014dd5e0fa77091f3cb7adbda8445a360c4584aeaa0150b5b3988ff3
          else
            NAME=scrcpy-macos-x86_64-v4.1.tar.gz
            SHA=ee2a7223bc8dbdc4f482db1134bcf441178dafb833492b71ca4c22090c58ce72
          fi
          curl -sL -o scrcpy.download "https://github.com/Genymobile/scrcpy/releases/download/v4.1/$NAME"
          echo "$SHA  scrcpy.download" | shasum -a 256 -c -
          mkdir -p src-tauri/resources/scrcpy tmp-scrcpy
          tar -xzf scrcpy.download -C tmp-scrcpy
          mv "tmp-scrcpy/${NAME%.tar.gz}"/* src-tauri/resources/scrcpy/
          # X10-79：macOS 官方包不带 scrcpy.png，scrcpy 启动时找不到图标会刷
          # 「Could not open icon image」错误。统一用应用图标补齐。
          cp src-tauri/icons/icon.png src-tauri/resources/scrcpy/scrcpy.png

      # X10-48（用户拍板）：Linux 也随包分发 scrcpy。Linux 没有官方预编译包，
      # 改为在 runner 上从官方源码编译 v4.1（固定 tag + 固定源码哈希），
      # 配套 scrcpy-server（用 GitHub 官方 release 元数据里的 SHA-256 digest
      # 校验，与写死常量同样 fail-closed）与 Google 官方 platform-tools 的 adb
      # （固定版本 + 固定哈希）。全部下载在**校验失败时立即终止构建**。
      # 运行时动态库依赖（SDL2/FFmpeg）不随包，见 README 的 Linux 说明。
      - name: 编译并组装 scrcpy 运行时（Linux）
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # ⓪ SDL3：scrcpy 4.x 依赖 SDL3（v0.3.0 首跑实锤：meson 报 sdl3 not
          #   found，Ubuntu 22.04 仓库只有 SDL2），从官方源码编译安装（固定 tag
          #   + 固定源码哈希）。
          curl -sL -o sdl3.tar.gz "https://codeload.github.com/libsdl-org/SDL/tar.gz/refs/tags/release-3.4.16"
          echo "c2ee715e42ec520c4d11fd8d249ef1d2b2baf4ad31148b72b3b000276c0b3633  sdl3.tar.gz" | sha256sum -c -
          tar -xzf sdl3.tar.gz
          # codeload 的顶层目录带 tag 前缀：SDL-release-3.4.16
          cmake -S SDL-release-3.4.16 -B sdl3-build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build sdl3-build -j2
          sudo cmake --install sdl3-build
          sudo ldconfig
          # ① 源码（codeload 直链，SHA-256 写死）
          curl -sL -o scrcpy-src.tar.gz "https://codeload.github.com/Genymobile/scrcpy/tar.gz/refs/tags/v4.1"
          echo "537b2ade623cb94b6edddfa5c61bf0b0af21484aa8365ea2531b686ea573249a  scrcpy-src.tar.gz" | sha256sum -c -
          tar -xzf scrcpy-src.tar.gz
          # ② scrcpy-server：下载 + 官方 release digest 校验（sha256:<hex>）
          curl -sL -o scrcpy-server-v4.1 "https://github.com/Genymobile/scrcpy/releases/download/v4.1/scrcpy-server-v4.1"
          expected=$(gh api repos/Genymobile/scrcpy/releases/tags/v4.1 \
            --jq '.assets[] | select(.name == "scrcpy-server-v4.1") | .digest' \
            | sed 's/^sha256://')
          actual=$(sha256sum scrcpy-server-v4.1 | cut -d' ' -f1)
          echo "server digest: expected=${expected} actual=${actual}"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "scrcpy-server SHA-256 与官方 release digest 不符"; exit 1
          fi
          # ③ adb（platform-tools 固定版本，SHA-256 写死）
          curl -sL -o platform-tools.zip "https://dl.google.com/android/repository/platform-tools_r34.0.5-linux.zip"
          echo "362f8f6218af0f4c61e5aaafb8e255a426c7a0ee00127dfab7371775081d3124  platform-tools.zip" | sha256sum -c -
          unzip -q platform-tools.zip
          # ④ 编译 scrcpy（动态链接 SDL2/FFmpeg）
          cd scrcpy-4.1
          meson setup build --buildtype=release -Dprebuilt_server=../scrcpy-server-v4.1 -Dcompile_server=false
          ninja -C build
          cd ..
          # ⑤ 组装进随包资源目录（与 Win/macOS 同构：scrcpy + scrcpy-server + adb）
          mkdir -p src-tauri/resources/scrcpy
          cp scrcpy-4.1/build/app/scrcpy src-tauri/resources/scrcpy/scrcpy
          cp scrcpy-server-v4.1 src-tauri/resources/scrcpy/scrcpy-server
          cp platform-tools/adb src-tauri/resources/scrcpy/adb
          cp src-tauri/icons/icon.png src-tauri/resources/scrcpy/scrcpy.png
          chmod +x src-tauri/resources/scrcpy/scrcpy src-tauri/resources/scrcpy/adb
          ls -la src-tauri/resources/scrcpy/

      # X10-82：构建输出 tee 进日志文件。失败时上传原文——0.4.13-beta 的
      # macos-x64 失败只有一行 "exit code 1" 注解，raw log 又需要仓库 admin
      # 权限才能下载，排查被迫盲猜。有 artifact 后，失败日志立即可取。
      - name: 构建安装包
        shell: bash
        run: |
          set -o pipefail
          pnpm tauri build --target ${{ matrix.target }} 2>&1 | tee "$RUNNER_TEMP/build-${{ matrix.label }}.log"

      # X10-98：tag 发版后核验二进制版本串与 tag 一致——0.4.19 曾把 0.4.18 旧
      # 二进制发出（缓存复用），版本串不一致直接 fail，不让错版进 Release。
      - name: 核验二进制版本串与 tag 一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          EXPECT="${GITHUB_REF_NAME#v}"      # v0.4.19-beta -> 0.4.19-beta
          EXPECT="${EXPECT%%-*}"             # -> 0.4.19
          BIN=""
          for cand in \
            "src-tauri/target/${{ matrix.target }}/release/mirrordock" \
            "src-tauri/target/${{ matrix.target }}/release/mirrordock.exe" \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/MirrorDock.app/Contents/MacOS/mirrordock"; do
            [ -f "$cand" ] && BIN="$cand" && break
          done
          [ -n "$BIN" ] || { echo "未找到构建产物二进制"; exit 1; }
          if grep -q "$EXPECT" "$BIN"; then
            echo "版本串核验通过：$BIN 含 $EXPECT"
          else
            echo "::error::二进制版本串不含 $EXPECT——疑似复用了旧缓存产物（X10-98）。"
            exit 1
          fi

      - name: 上传构建日志（失败诊断用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.label }}
          path: ${{ runner.temp }}/build-${{ matrix.label }}.log
          if-no-files-found: ignore

      # A1-08：产物哈希清单 + 依赖清单（SBOM）随产物一起发布，
      # 供下载者核对与审计。
      - name: 生成构建哈希清单与依赖清单（SBOM）
        shell: bash
        run: |
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          HASH_TOOL="$(command -v sha256sum >/dev/null 2>&1 && echo sha256sum || echo "shasum -a 256")"
          find "$BUNDLE" -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec $HASH_TOOL {} \; | tee "SHA256SUMS-${{ matrix.label }}.txt"
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > "sbom-cargo-${{ matrix.label }}.json"
          pnpm list --prod --json > "sbom-npm-${{ matrix.label }}.json"
          cat "SHA256SUMS-${{ matrix.label }}.txt"

      # X10-47：macOS 的 updater 产物（.app.tar.gz + .sig）默认名不带架构，
      # 两个 macOS 平台合并产物时会互相覆盖——统一改名带上架构与版本。
      - name: 规范化 macOS updater 产物名
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ "$RUNNER_ARCH" = "ARM64" ]; then ARCH=aarch64; else ARCH=x64; fi
          # 资产名一律用基础版本号（tag 的预发布后缀 -beta 不进文件名）：
          # tauri 打包产物（exe/AppImage/deb/rpm/dmg）取的是 tauri.conf.json 的
          # version，如 tag v0.3.0-beta → 产物名是 MirrorDock_0.3.0_*。
          # 改名步骤必须与之一致，否则 latest.json 按名匹配会落空（X10-52 教训）。
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"
          shopt -s nullglob
          cd "$BUNDLE/macos"
          for sig in *.app.tar.gz.sig; do
            base="${sig%.sig}"
            mv "$base" "MirrorDock_${VERSION}_${ARCH}.app.tar.gz"
            mv "$sig" "MirrorDock_${VERSION}_${ARCH}.app.tar.gz.sig"
          done
          ls -la

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDock-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

      - name: 上传哈希与 SBOM
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDock-${{ matrix.label }}-meta
          if-no-files-found: error
          retention-days: 14
          path: |
            SHA256SUMS-*.txt
            sbom-*.json

  # 发版（tag v* 或手动触发）时把伴侣 App APK 一并产出，供 Release 附件。
  companion-apk:
    name: 伴侣 App APK
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore signing keystore (fixed key for cover-install)
        # X10-21：同 companion.yml——固定签名保证 Release APK 可覆盖安装。
        env:
          COMPANION_KEYSTORE_BASE64: ${{ secrets.COMPANION_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$COMPANION_KEYSTORE_BASE64" ]; then
            echo "::warning::COMPANION_KEYSTORE_BASE64 未配置，回退默认 debug 签名"
          else
            echo "$COMPANION_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/companion.keystore"
          fi
      - name: 构建 debug APK
        working-directory: companion
        env:
          COMPANION_KEYSTORE: ${{ runner.temp }}/companion.keystore
          COMPANION_STORE_PASSWORD: ${{ secrets.COMPANION_STORE_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # 完整日志落盘 + tee：编译失败时 `/logs` 端点需 admin 权限（403），
          # job annotations 只有 "exit code 1" 没有编译器原文。上传日志 artifact
          # 让编译失败**可诊断**，不必再靠猜。2026-10-03 v0.4.7 首次发版就是这样
          # 被卡住的：连续两次都只看到 exit code 1。
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Kotlin / Gradle 编译报错摘要"
            grep -E "^e: |error:|FAILURE:|Caused by:|> Task .*FAILED" "$RUNNER_TEMP/gradle-build.log" | head -60 || true
            echo "::endgroup::"
          fi
          exit "$status"

      # 失败时也上传日志（成功时忽略），供事后定位。
      - name: 上传编译日志（失败诊断用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: companion-apk-build-log
          path: ${{ runner.temp }}/gradle-build.log
          retention-days: 14
      # M4-5：APK 资产名带版本号（基础版本号，与桌面资产口径一致），
      # 否则 Release 里永远叫 app-debug.apk，多版本无法区分。
      - name: 规范化 APK 资产名
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"
          mv companion/app/build/outputs/apk/debug/app-debug.apk \
             "companion/app/build/outputs/apk/debug/MirrorDock-companion-${VERSION}.apk"
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDock-companion-apk
          if-no-files-found: error
          path: companion/app/build/outputs/apk/debug/*.apk

  # 打 tag 即发布：汇总全部产物（桌面安装包 + 哈希/SBOM + 伴侣 APK）创建 GitHub Release。
  release:
    name: 发布 GitHub Release
    needs: [package, companion-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      # 需要读仓库内的发版说明 docs/release-notes-beta.md（与 Release 正文单一来源）。
      - uses: actions/checkout@v4

      - name: 汇总产物
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: 列出待发布文件
        run: ls -la release-files
      # 为什么不再用 softprops/action-gh-release@v2（2026-09-29 实测根因）：
      #   1) 它在 prerelease 场景下先建「草稿」再 finalize 发布；finalize 是
      #      updateRelease(draft:false)。而 GitHub **允许同一 tag 下同时存在一个草稿
      #      与一个正式 Release**，一旦该 tag 已有正式 Release，发布草稿即失败：
      #      Validation Failed: already_exists, field=tag_name。
      #   2) 它按 tag 查找已有 Release 复用，但草稿在「按 tag 查询」的接口里不可见
      #      （`gh release view` 同样看不到），于是每轮都新建一个，同 tag 越积越多。
      #      实测该 tag 下同时存在 id=398740537「草稿(20 资产)」与 id=398762605
      #      「正式(0 资产)」——资产全落在草稿上，对外可见的那个却是空的。
      #   3) 曾出现上传全部成功、仅 finalize 失败，整个 job 判失败但资产已落盘的
      #      「半成功」状态，人工判断成本极高。
      # 改为 gh CLI：先按 id 删净该 tag 下的**全部** Release（含草稿），再一次性直接
      # 创建正式 prerelease，最后显式上传资产——没有草稿/发布两步，没有按 tag 查找
      # 的歧义，失败点全部是显式命令，日志可读。
      - name: 清理该 tag 下的全部历史 Release（含草稿）
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                  --jq ".[] | select(.tag_name == \"${TAG}\") | .id")
          if [ -z "${ids}" ]; then
            echo "该 tag 下无历史 Release，将直接创建：${TAG}"
          else
            for id in ${ids}; do
              echo "删除历史 Release id=${id}（tag 本身保留）"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            done
          fi
      # 正文 = 「本版更新内容」（docs/releases/<tag>.md，每版手写，存在才展示）
      #       + docs/release-notes-beta.md（固定模板，版本无关写法，避免过期）；
      # 末尾追加一条随 tag 变化的「完整变更记录」链接。
      # X10-41 用户反馈：固定文案不友好，每次发布要写清楚更新了哪些内容。
      - name: 创建 Release
        run: |
          set -euo pipefail
          {
            if [ -f "docs/releases/${TAG}.md" ]; then
              echo "## 本版更新内容"
              echo
              cat "docs/releases/${TAG}.md"
              echo
              echo "---"
              echo
            fi
            cat docs/release-notes-beta.md
            echo
            echo "**完整变更记录**：https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
          } > /tmp/release-notes.md
          gh release create "${TAG}" \
            --title "MirrorDock ${TAG}" \
            --prerelease \
            --notes-file /tmp/release-notes.md

      # 用 find 收集真实文件列表（不依赖 glob 层级），上传前先卡产物数量，
      # 避免「构建成功但产物没汇总进来」导致发空包。
      - name: 上传产物
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-files -type f | sort)
          echo "待上传 ${#files[@]} 个文件："
          printf '  %s\n' "${files[@]}"
          if [ "${#files[@]}" -lt 10 ]; then
            echo "产物数量异常：期望至少 10 个（四平台安装包 + 伴侣 APK + SHA256SUMS + SBOM）"
            exit 1
          fi
          gh release upload "${TAG}" "${files[@]}" --clobber

      # X10-47 应用内自动更新：生成 latest.json（updater 清单）并上传。
      # signature 从各平台 updater 产物的 .sig sidecar 读取；url 用可预测的
      # release download 地址。任何平台产物缺失都会使本步骤失败（fail-closed）。
      - name: 生成并上传 latest.json（自动更新清单）
        run: |
          set -euo pipefail
          # 资产名一律用基础版本号（与 tauri 打包产物一致，见 X10-52 教训）：
          # tag v0.3.0-beta → 产物名 MirrorDock_0.3.0_*、latest.json version=0.3.0。
          VERSION="${TAG#v}"
          VERSION="${VERSION%%-*}"
          python3 - "$VERSION" "$GITHUB_REPOSITORY" "$TAG" <<'PY'
          import json, sys, pathlib, datetime

          version, repo, tag = sys.argv[1], sys.argv[2], sys.argv[3]
          base = pathlib.Path("release-files")

          def asset(name):
              matches = list(base.rglob(name))
              if len(matches) != 1:
                  raise SystemExit(f"updater 资产缺失或不唯一: {name} -> {matches}")
              return matches[0]

          platforms = {
              "darwin-aarch64": "MirrorDock_{v}_aarch64.app.tar.gz",
              "darwin-x86_64": "MirrorDock_{v}_x64.app.tar.gz",
              "linux-x86_64": "MirrorDock_{v}_amd64.AppImage",
              "windows-x86_64": "MirrorDock_{v}_x64-setup.exe",
          }
          entries = {}
          for key, pattern in platforms.items():
              name = pattern.format(v=version)
              artifact = asset(name)
              signature = asset(name + ".sig").read_text().strip()
              entries[key] = {
                  "signature": signature,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
              }

          notes_path = pathlib.Path(f"docs/releases/{tag}.md")
          notes = notes_path.read_text().strip() if notes_path.exists() else f"MirrorDock {tag}"
          manifest = {
              "version": version,
              "notes": notes[:2000],
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": entries,
          }
          pathlib.Path("latest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2))
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          gh release upload "${TAG}" latest.json --clobber

      # X10-53：updater 端点修复。本仓库所有 Release 均为 prerelease，而 GitHub 的
      # releases/latest 别名**不包含** prerelease——编译进客户端的
      # .../releases/latest/download/latest.json 恒 404（2026-10-01 实测，
      # v0.3.0-beta 起全部已装客户端的「检查更新」必然失败）。
      # 修复：把 latest.json 另行发布到常驻分支 updater（经 GitHub Contents API
      # 建/更新单文件提交，release job 已有 contents:write，无需新凭据），
      # 客户端端点改用 raw.githubusercontent.com 直链该分支（tauri.conf.json）。
      # raw 有约 5 分钟 CDN 缓存，对用户手动「检查更新」可接受。
      - name: 发布 latest.json 到 updater 分支（常驻端点）
        env:
          BRANCH: updater
        run: |
          set -euo pipefail
          # 分支不存在则自建（Contents API 无法在不存在的分支上建文件——
          # v0.4.1-beta 教训：首次发布必 404）。以当前提交为源点建孤儿语义的常驻分支。
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" > /dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="${GITHUB_SHA}" > /dev/null
            echo "updater 分支不存在，已从 ${GITHUB_SHA} 创建"
          fi
          content_b64=$(base64 -w0 latest.json)
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/latest.json?ref=${BRANCH}" \
                  --jq '.sha' 2>/dev/null || true)
          args=(-f message="latest.json for ${TAG}" -f content="${content_b64}" -f branch="${BRANCH}")
          if [ -n "${sha}" ]; then
            args+=(-f sha="${sha}")
          fi
          commit=$(gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/latest.json" "${args[@]}" --jq '.commit.sha')
          echo "updater 分支已更新：commit ${commit}"
          # 自校验：常驻端点必须可取回且 JSON 可解析（raw 首次拉取即生效，稍候重试）
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}/latest.json"
          for i in 1 2 3 4 5; do
            if curl -fsSL "${url}" -o /tmp/served-latest.json 2>/dev/null; then
              expected=$(python3 -c "import json; print(json.load(open('latest.json'))['version'])")
              served=$(python3 -c "import json; print(json.load(open('/tmp/served-latest.json'))['version'])")
              echo "常驻端点校验通过：version=${served}（期望 ${expected}）"
              [ "${served}" = "${expected}" ] || { echo "端点版本与本次清单不一致"; exit 1; }
              exit 0
            fi
            sleep 5
          done
          echo "常驻端点 ${url} 在 25 秒内不可取回"; exit 1

      # 发布后自校验：既查「该 tag 下 Release 唯一且已对外发布」，也查资产数量，
      # 同时防住两类历史故障——同 tag 多 Release（草稿偷藏资产）、发空包显示成功。
      - name: 校验 Release
        run: |
          set -euo pipefail
          released=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                       --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
          echo "该 tag 下 Release 数量：${released}"
          [ "${released}" -eq 1 ] || { echo "期望恰好 1 个 Release，实际 ${released} 个"; exit 1; }

          # 「按 tag 查 Release」这个接口不会返回草稿：能查到 ⇔ 已对外发布。
          # 用它替代 isDraft 字段，免得依赖不同 runner 上 gh 版本的 JSON 字段差异。
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release 已对外发布（非草稿）"
          else
            echo "按 tag 查不到已发布的 Release：它可能仍是草稿，未对外可见"; exit 1
          fi

          count=$(gh release view "${TAG}" --json assets --jq '.assets | length')
          echo "Release 资产数：${count}"
          gh release view "${TAG}" --json assets --jq '.assets[].name'
          if [ "${count}" -lt 10 ]; then
            echo "资产数不足（期望至少 10 个：四平台安装包 + 伴侣 APK + SHA256SUMS）"; exit 1
          fi
