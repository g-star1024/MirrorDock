name: build

# 触发策略（分层，避免互相取消与浪费额度）：
#   - 推送到 main（含普通提交）→ 只跑「验证」门禁（约 3 分钟），保证每次提交都有回归保护。
#   - 推送标签 v* → 验证 + 四平台打包（发版时才需要）。
#   - 也可在 Actions 页手动触发（默认同样跑完整打包）。
# 打包是最昂贵的一环，且不在每次提交时都需要；把两者分开后，日常提交不会再因
# concurrency.cancel-in-progress 取消正在进行的打包。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: 验证（Rust 单测 + 前端构建）
    runs-on: ubuntu-22.04
    # 显式超时：历史上出现过 runner label 失效导致作业长期排队、拖垮整个运行的情况。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本需与 pnpm-lock.yaml 的 lockfileVersion 对应（当前为 9.0）。
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Rust 单元与集成测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 前端单元与组件测试
        run: pnpm test

      - name: 前端生产构建
        run: pnpm build

  package:
    name: 打包 ${{ matrix.label }}
    needs: verify
    # 只在发版标签或手动触发时打包；日常推送到 main 不产出安装包。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - label: linux-x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: macos-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
          - label: macos-x64
            # macos-13（Intel）于 2025-12-04 已完全退役：被弃用的 runner label **不会报错**，
            # 而是排队到 24 小时上限后被自动取消（表现为该作业长期 queued，拖垮整个运行）。
            # macos-15-intel 是 GitHub 现存的最后一个托管 x86_64 macOS 镜像（约可用至 2027-08）。
            platform: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # A1-08：随包分发 scrcpy v4.1 官方运行时（Windows / macOS；官方包内
      # 自带 adb）。URL 与 SHA-256 固定写死，下载后必须校验，不符即终止——
      # 防止供应链被替换。Linux 无官方包，运行时回退到用户 PATH（见
      # THIRD_PARTY_NOTICES.md）。
      - name: 下载并校验 scrcpy 运行时（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Genymobile/scrcpy/releases/download/v4.1/scrcpy-win64-v4.1.zip" -OutFile scrcpy.download
          $hash = (Get-FileHash scrcpy.download -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "5b12172b3264b2889f4583ee64752ce832e29bc8b1089dca81093459697165db") { throw "scrcpy SHA-256 mismatch: $hash" }
          Expand-Archive scrcpy.download -DestinationPath tmp-scrcpy
          New-Item -ItemType Directory -Force src-tauri/resources/scrcpy | Out-Null
          Move-Item tmp-scrcpy/scrcpy-win64-v4.1/* src-tauri/resources/scrcpy/

      - name: 下载并校验 scrcpy 运行时（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_ARCH" = "ARM64" ]; then
            NAME=scrcpy-macos-aarch64-v4.1.tar.gz
            SHA=20fd47c9014dd5e0fa77091f3cb7adbda8445a360c4584aeaa0150b5b3988ff3
          else
            NAME=scrcpy-macos-x86_64-v4.1.tar.gz
            SHA=ee2a7223bc8dbdc4f482db1134bcf441178dafb833492b71ca4c22090c58ce72
          fi
          curl -sL -o scrcpy.download "https://github.com/Genymobile/scrcpy/releases/download/v4.1/$NAME"
          echo "$SHA  scrcpy.download" | shasum -a 256 -c -
          mkdir -p src-tauri/resources/scrcpy tmp-scrcpy
          tar -xzf scrcpy.download -C tmp-scrcpy
          mv "tmp-scrcpy/${NAME%.tar.gz}"/* src-tauri/resources/scrcpy/

      - name: 构建安装包
        run: pnpm tauri build --target ${{ matrix.target }}

      # A1-08：产物哈希清单 + 依赖清单（SBOM）随产物一起发布，
      # 供下载者核对与审计。
      - name: 生成构建哈希清单与依赖清单（SBOM）
        shell: bash
        run: |
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          HASH_TOOL="$(command -v sha256sum >/dev/null 2>&1 && echo sha256sum || echo "shasum -a 256")"
          find "$BUNDLE" -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec $HASH_TOOL {} \; | tee "SHA256SUMS-${{ matrix.label }}.txt"
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > "sbom-cargo-${{ matrix.label }}.json"
          pnpm list --prod --json > "sbom-npm-${{ matrix.label }}.json"
          cat "SHA256SUMS-${{ matrix.label }}.txt"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDock-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage

      - name: 上传哈希与 SBOM
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDock-${{ matrix.label }}-meta
          if-no-files-found: error
          retention-days: 14
          path: |
            SHA256SUMS-*.txt
            sbom-*.json

  # 发版（tag v* 或手动触发）时把伴侣 App APK 一并产出，供 Release 附件。
  companion-apk:
    name: 伴侣 App APK
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 构建 debug APK
        working-directory: companion
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --no-daemon
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDock-companion-apk
          if-no-files-found: error
          path: companion/app/build/outputs/apk/debug/app-debug.apk

  # 打 tag 即发布：汇总全部产物（桌面安装包 + 哈希/SBOM + 伴侣 APK）创建 GitHub Release。
  release:
    name: 发布 GitHub Release
    needs: [package, companion-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 汇总产物
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: 列出待发布文件
        run: ls -la release-files
      # 重发（删 tag→重推 tag）会让旧 Release 变成「孤立 Release」，其上传地址失效：
      # 表现为正文更新成功、资产被清空后上传失败。发布前先删掉同 tag 的历史 Release
      # （保留 tag 本身），让下面这步总是「全新创建」，彻底消除该不稳定路径。
      - name: 清理同 tag 的历史 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --yes --cleanup-tag=false
            echo "已删除历史 Release：${GITHUB_REF_NAME}（tag 保留）"
          else
            echo "无历史 Release，将直接创建：${GITHUB_REF_NAME}"
          fi
      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          name: MirrorDock ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            MirrorDock 桌面镜像工具测试版。本地优先：画面、截图、录像与文件传输只经过你自己的数据线或局域网，不上传任何服务器。

            **下载哪个文件**（文件名含版本号，按后缀识别即可）
            - Windows：`...-setup.exe`（安装版）或 `....msi`
            - macOS（Apple 芯片 M1 及以后）：`..._aarch64.dmg`
            - macOS（Intel）：`..._x64.dmg`
            - Linux：`....AppImage`（免安装）/ `.deb` / `.rpm`
            - 手机伴侣 App：`app-debug.apk`

            **安装后怎么开始**
            1. 电脑端打开 MirrorDock → 用数据线连手机，或选「无线连接」。
            2. 手机开启「开发者选项 → USB 调试 / 无线调试」。Android 11 及以上可直接用「无线调试 → 使用二维码配对设备」扫电脑上的二维码，自动配对连接。
            3. 需要伴侣 App 时安装 `app-debug.apk`，与电脑在同一 Wi-Fi 下扫码建立加密连接。

            **本版说明**
            - 测试版**已内置永久激活码，无需手动激活**，录制等专业版功能直接可用；在「设置 → 版本与授权」点击撤销后可选择不再自动激活。
            - 本版为 **debug 签名的测试版**，未做代码签名与公证；macOS 首次打开可能需要在「系统设置 → 隐私与安全性」中允许，Windows 可能提示 SmartScreen。
            - 未做自动更新：升级请回到本页面下载新版本。
            - 镜像画面方向默认跟随手机旋转，打开横屏游戏会自动转为横屏。
            - 会话进行中可用全局快捷键（Ctrl/⌘ + Alt + S 截图、+ R 录制开关、+ D 轮换方向），组合可在「设置」中修改。

            **校验与透明**
            - 每个平台的 `SHA256SUMS-<平台>.txt` 为对应安装包的校验值，建议下载后核对。
            - `sbom-cargo-*.json` / `sbom-npm-*.json` 为依赖清单（SBOM）。

            测试版仍在迭代，遇到问题请在本仓库提 Issue，并附上「设置 → 诊断」导出的诊断包（已抹去序列号、配对码与文件路径）。
          files: |
            release-files/**/*.dmg
            release-files/**/*.msi
            release-files/**/*.exe
            release-files/**/*.deb
            release-files/**/*.rpm
            release-files/**/*.AppImage
            release-files/**/app-debug.apk
            release-files/**/SHA256SUMS-*.txt
            release-files/**/sbom-*.json
      # 发布后自校验：至少要有「四平台安装包 + APK + 校验文件」，防止发空包却显示成功。
      - name: 校验 Release 资产生效
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets | length')
          echo "Release 资产数：${count}"
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'
          if [ "${count}" -lt 10 ]; then
            echo "资产数不足（期望至少 10 个：四平台安装包 + 伴侣 APK + SHA256SUMS）"; exit 1
          fi
