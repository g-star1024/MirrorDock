name: build

# 触发策略（分层，避免互相取消与浪费额度）：
#   - 推送到 main（含普通提交）→ 只跑「验证」门禁（约 3 分钟），保证每次提交都有回归保护。
#   - 推送标签 v* → 验证 + 四平台打包（发版时才需要）。
#   - 也可在 Actions 页手动触发（默认同样跑完整打包）。
# 打包是最昂贵的一环，且不在每次提交时都需要；把两者分开后，日常提交不会再因
# concurrency.cancel-in-progress 取消正在进行的打包。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: 验证（Rust 单测 + 前端构建）
    runs-on: ubuntu-22.04
    # 显式超时：历史上出现过 runner label 失效导致作业长期排队、拖垮整个运行的情况。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本需与 pnpm-lock.yaml 的 lockfileVersion 对应（当前为 9.0）。
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Rust 单元与集成测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 前端单元与组件测试
        run: pnpm test

      - name: 前端生产构建
        run: pnpm build

  package:
    name: 打包 ${{ matrix.label }}
    needs: verify
    # 只在发版标签或手动触发时打包；日常推送到 main 不产出安装包。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - label: linux-x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: macos-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
          - label: macos-x64
            # macos-13（Intel）于 2025-12-04 已完全退役：被弃用的 runner label **不会报错**，
            # 而是排队到 24 小时上限后被自动取消（表现为该作业长期 queued，拖垮整个运行）。
            # macos-15-intel 是 GitHub 现存的最后一个托管 x86_64 macOS 镜像（约可用至 2027-08）。
            platform: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 产物默认未签名：macOS 首次打开会提示来自未识别开发者，Windows 会触发
      # SmartScreen。正式分发需要另行配置签名密钥（见仓库 README 与产品规划的
      # 发行条款）。本流水线也不捆绑 scrcpy 运行时——那属于 A1-08 的范围，
      # 当前产物在运行时需要本机已具备 scrcpy（或设置 MIRRORDOCK_SCRCPY_PATH）。
      - name: 构建安装包
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDock-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
