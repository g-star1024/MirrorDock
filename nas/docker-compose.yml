# MirrorDock NAS 版 · Docker Compose（含飞牛 fnOS 说明）
#
# fnOS 部署方式：「Docker → Compose → 新建项目」，把本文件内容粘贴进去即可。
# 飞牛图形界面的 Docker 管理面板支持导入 compose，也有「使用特权模式运行」开关。
#
# 【为什么必须 privileged】
# 安卓调试走 USB 时，容器需要有权限访问 /dev/bus/usb 下的设备节点。
# 群晖/飞牛社区里跑 ADB、Frigate（USB 摄像头）等方案普遍使用 privileged，
# 是家庭内网场景下的通行做法。若你的安全策略不允许，可退而精确挂载：
#   devices:
#     - "/dev/bus/usb:/dev/bus/usb"

services:
  mirrordock:
    # GHCR 的命名规则是 ghcr.io/<owner>/<仓库名>/<包名>——中间那段仓库名不能省。
    # 少了它就会得到 Head ".../mirrordock-nas/manifests/latest": denied
    # （2026-10-11 首测实踩）。本行由 CI 的「镜像名一致性」步骤守卫，改坏会红。
    image: ghcr.io/g-star1024/mirrordock/mirrordock-nas:latest
    container_name: mirrordock-nas

    # 常开机是这个项目的立身之本：宿主机重启后自动拉起，长时间挂机不受影响。
    restart: unless-stopped

    # USB 透传（必需）。缺失则容器看不到任何手机。
    privileged: true

    # 无线调试/mDNS 发现依赖局域网广播，桥接模式下 adb pair 会找不到手机。
    # host 模式最省心；若必须隔离网络，改用 network_mode: bridge + ports 映射。
    network_mode: host

    environment:
      # Web 端口（host 网络模式下直接映射为宿主机端口）
      - PORT=8080
      # 数据目录：录像、截图、adb 授权密钥都落在这里
      - MIRRORDOCK_DATA=/var/lib/mirrordock
      # 归档保留天数：每 6 小时回收超过 N 天的录像/截图，避免 24h 录制把磁盘写满。
      # 0 = 不自动清理；非整数值按「不清理」处理。默认 7。
      - MIRRORDOCK_RETENTION_DAYS=7
      - TZ=Asia/Shanghai
      # 检查更新（X10-120）：让容器知道自己跑的是哪个镜像 digest / 哪个 commit，
      # 服务端据此与 GHCR 远端 latest 比对。不设置则退化为「无法确定本地版本」。
      # docker compose 会自动把宿主机的这些变量值带进来（下面的 environment 同名引用）。
      #
      # 推荐：用 scripts/nas-deploy.sh 部署（它会先 pull 再自动注入这两个值），
      # 或在 docker compose up 前手动执行：
      #   export MIRRORDOCK_IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/g-star1024/mirrordock/mirrordock-nas:latest)
      #   export MIRRORDOCK_REVISION=$(git -C /path/to/MirrorDock rev-parse --short HEAD 2>/dev/null || echo "")
      - MIRRORDOCK_IMAGE_DIGEST=${MIRRORDOCK_IMAGE_DIGEST:-}
      - MIRRORDOCK_REVISION=${MIRRORDOCK_REVISION:-}

    volumes:
      # 数据卷：录像与截图（建议放在 NAS 的大容量存储池上）
      - ./data:/var/lib/mirrordock
      # adb 授权密钥持久化。不做这一项，容器每次重建都要在手机上重新点
      # 「允许 USB 调试」——而 NAS 通常离人很远，重新授权极其麻烦。
      - ./adbkeys:/root/.android
      # USB 设备节点。privileged 已包含，显式写出便于排错。
      - /dev/bus/usb:/dev/bus/usb

    # 本地构建（ARM 机型 NAS 推荐：原生编译比 QEMU 模拟快一个数量级）。
    # 用 build 时注释掉上面的 image，反之亦然。
    # 注意上下文必须是**仓库根目录**：Dockerfile 会 COPY crates/ 与 nas/server，
    # 指向 nas/ 内部会让 COPY 找不到文件。
    # build:
    #   context: ..
    #   dockerfile: nas/Dockerfile
