<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MirrorDock · NAS 版</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --line: #e6e8ef;
    --text: #1f2329;
    --muted: #6b7280;
    --accent: #2f6df6;
    --ok: #1d9e75;
    --warn: #ba7517;
    --danger: #c0392b;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px 64px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  .wrap { max-width: 1060px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button, select {
    font: inherit; font-size: 14px; padding: 8px 16px; border-radius: 10px;
    border: 1px solid var(--line); background: #fff; cursor: pointer; color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); border-color: #f2c9c3; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .badge {
    display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid transparent; margin-left: 8px;
  }
  .badge.usb { background: #e1f5ee; color: #0f6e56; border-color: #9fe1cb; }
  .badge.wireless { background: #faeeda; color: #854f0b; border-color: #fac775; }
  .badge.ready { background: #e1f5ee; color: #0f6e56; }
  .badge.unauthorized { background: #fcebeb; color: #a32d2d; }
  .badge.offline { background: #f1efe8; color: #5f5e5a; }
  ul { list-style: none; padding: 0; margin: 0; }
  li.item {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  li.item:last-child { border-bottom: none; }
  .name { font-size: 14px; word-break: break-all; }
  .meta { font-size: 12px; color: var(--muted); }
  .msg {
    margin-top: 12px; padding: 12px 14px; border-radius: 12px;
    font-size: 13px; background: #f6f7fb; border: 1px solid var(--line); white-space: pre-wrap;
  }
  .msg.error { background: #fcebeb; border-color: #f2c9c3; color: #7d2620; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }

  /* 实时镜像 */
  #mirror-stage {
    position: relative; width: 100%; max-width: 420px; margin: 0 auto;
    background: #0b0d12; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--line); aspect-ratio: 9 / 19.5;
  }
  #mirror-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #mirror-placeholder {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    color: #8a90a0; font-size: 13px; text-align: center; padding: 20px;
  }
  #mirror-stage.live #mirror-placeholder { display: none; }
  .mirror-toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
  .mirror-toolbar button { font-size: 13px; padding: 7px 12px; }

  /* 截图画廊 */
  .shot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 12px; }
  .shot-cell { position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #0b0d12; aspect-ratio: 9/19; }
  .shot-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot-cell .shot-del {
    position: absolute; top: 6px; right: 6px; padding: 3px 8px; font-size: 12px;
    background: rgba(0,0,0,.55); color: #fff; border: none; border-radius: 8px;
  }
  .shot-cell .shot-name {
    position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; color: #e8eaf0;
    background: linear-gradient(transparent, rgba(0,0,0,.7)); padding: 14px 8px 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 文件项操作按钮 */
  .file-acts button { font-size: 12px; padding: 5px 10px; margin-left: 6px; }
  input[type=file] { font-size: 13px; }
  .app-item .badge.tp { background: #e1f5ee; color: #0f6e56; }
  .app-item .badge.sys { background: #f1efe8; color: #5f5e5a; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MirrorDock · NAS 版</h1>
    <div class="sub" id="status-line">正在连接…</div>
  </header>

  <section class="card">
    <div class="card-head"><h2>手机</h2><button id="refresh-devices">刷新</button></div>
    <ul id="devices"><li class="empty">读取中…</li></ul>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>实时镜像</h2>
      <span id="mirror-state" class="meta">未连接</span>
    </div>
    <div class="row" style="margin-bottom:12px;justify-content:center">
      <select id="mirror-serial"></select>
      <button class="primary" id="mirror-start">开始镜像</button>
      <button id="mirror-stop" disabled>停止</button>
    </div>
    <div id="mirror-stage">
      <canvas id="mirror-canvas"></canvas>
      <div id="mirror-placeholder">
        <div style="font-size:32px">📱</div>
        <div>选择手机后点「开始镜像」，画面会实时显示在这里。<br>在画面上点按/拖动即可操作手机。<br><span class="meta">安全上下文用硬件解码，局域网 HTTP 自动切换软件解码（更耗 CPU）。</span></div>
        <div id="mirror-hint" class="meta"></div>
      </div>
    </div>
    <div class="mirror-toolbar">
      <button data-act="back">返回</button>
      <button data-act="home">主页</button>
      <button data-act="recents">多任务</button>
      <button data-act="power">电源</button>
      <button data-act="rotate">旋转</button>
    </div>
    <div class="msg" id="mirror-msg" hidden></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>录制</h2><span id="rec-state" class="meta">未在录制</span></div>
    <div class="row">
      <select id="rec-serial"></select>
      <select id="rec-quality">
        <option value="balanced">标准 1080p</option>
        <option value="smooth">流畅 1024</option>
        <option value="sharp">高清 2560</option>
      </select>
      <button class="primary" id="rec-start">开始录制</button>
      <button id="rec-stop" disabled>结束录制</button>
    </div>
    <div class="msg" id="rec-msg" hidden></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>录像归档</h2><button id="refresh-rec">刷新</button></div>
    <ul id="recordings"><li class="empty">暂无录像</li></ul>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>截图画廊</h2>
      <div class="row">
        <button id="shot">立即截图</button>
        <button id="refresh-shots">刷新</button>
      </div>
    </div>
    <div class="sub">容器没有画面窗口，截图是远程查看手机当前界面的主要方式。新截的图会进入下方画廊。</div>
    <div class="shot-grid" id="shot-grid"><div class="empty">暂无截图</div></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>手机文件</h2><button id="refresh-files">刷新</button></div>
    <div class="row" style="margin-bottom:10px">
      <select id="file-serial"></select>
      <input id="file-path" value="/sdcard" style="flex:1;min-width:180px;padding:8px 12px;border-radius:10px;border:1px solid var(--line)">
      <button id="list-files">列出</button>
    </div>
    <div class="row" style="margin-bottom:10px">
      <input type="file" id="file-upload-input" style="flex:1;min-width:180px">
      <button id="file-upload">上传到当前目录</button>
    </div>
    <div class="msg" id="file-msg" hidden></div>
    <ul id="files"><li class="empty">尚未列出</li></ul>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>应用</h2>
      <div class="row">
        <label class="meta" style="display:flex;align-items:center;gap:4px">
          <input type="checkbox" id="apps-system"> 含系统应用
        </label>
        <button id="refresh-apps">刷新</button>
      </div>
    </div>
    <div class="row" style="margin-bottom:10px">
      <input type="file" id="apk-input" accept=".apk" style="flex:1;min-width:180px">
      <button id="apk-install">安装 APK</button>
    </div>
    <div class="msg" id="apps-msg" hidden></div>
    <ul id="apps"><li class="empty">尚未列出</li></ul>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>设置</h2>
      <button id="settings-save">保存</button>
    </div>
    <div class="sub">改动保存后立即生效：新开始的镜像与录制按新画质，保留天数下一轮清理生效。</div>
    <div class="row" style="margin-bottom:10px">
      <label class="meta" for="settings-quality" style="min-width:72px">画质预设</label>
      <select id="settings-quality" style="flex:1;min-width:180px">
        <option value="smooth">流畅（1024p · 2Mbps，省带宽）</option>
        <option value="balanced">均衡（1920p · 8Mbps，默认）</option>
        <option value="sharp">清晰（2560p · 16Mbps，本地网络）</option>
      </select>
    </div>
    <div class="row" style="margin-bottom:10px">
      <label class="meta" for="settings-retention" style="min-width:72px">保留天数</label>
      <input id="settings-retention" type="number" min="0" max="3650" step="1"
             style="flex:1;min-width:180px;padding:8px 12px;border-radius:10px;border:1px solid var(--line)">
      <span class="meta">天（0 = 不自动清理）</span>
    </div>
    <div class="msg" id="settings-msg" hidden></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
let devices = [];

function show(el, text, isError) {
  el.hidden = false;
  el.textContent = text;
  el.className = 'msg' + (isError ? ' error' : '');
}

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    // 后端返回的是与桌面端同形的 AppError：code + message + recovery。
    const e = new Error((body.message || '请求失败') + '\n' + (body.recovery || ''));
    e.code = body.code;
    throw e;
  }
  return body;
}

async function loadStatus() {
  try {
    const s = await api('/api/status');
    // 保留策略要显式写在界面上：旧录像会被自动回收，不说明的话用户某天发现
    // 文件少了会当成丢数据。0 = 不清理。
    const keep = s.retention_days > 0
      ? ` · 归档保留 ${s.retention_days} 天`
      : ' · 归档不自动清理';
    $('status-line').textContent =
      `v${s.version} · 数据目录 ${s.data_dir} · adb ${s.adb}${keep}${s.recording ? ' · 录制中' : ''}`;
    // 【按钮状态必须跟服务端对齐】录制状态活在服务端进程里，按钮 disabled
    // 却只存在前端内存——页面一刷新两者就脱节：服务端明明在录，结束按钮
    // 却永远是灰的，那场录制就再也停不下来，产出一份没有 moov 索引、浏览器
    // 拒播的孤儿 MP4（2026-10-11 飞牛真机实踩）。
    $('rec-start').disabled = !!s.recording;
    $('rec-stop').disabled = !s.recording;
    if (s.recording) $('rec-state').textContent = '录制中：' + s.recording;
  } catch (e) { $('status-line').textContent = '无法连接服务端'; }
}

async function loadDevices() {
  const ul = $('devices');
  ul.innerHTML = '<li class="empty">读取中…</li>';
  try {
    const data = await api('/api/devices');
    devices = data.devices || [];
    if (!devices.length) {
      ul.innerHTML = '<li class="empty">没有检测到手机。请确认已插好数据线、'
        + '容器已透传 USB，并且手机上已允许本机调试（首次连接会出现授权弹窗）。</li>';
    } else {
      ul.innerHTML = '';
      devices.forEach((d) => {
        const li = document.createElement('li');
        li.className = 'item';
        li.innerHTML =
          `<div><span class="name">${d.label}</span>` +
          `<span class="badge ${d.preferred_usb ? 'usb' : 'wireless'}">` +
          `${d.preferred_usb ? '首选 USB' : '首选 无线'}</span>` +
          `<span class="badge ${d.state}">${d.state}</span>` +
          `<div class="meta">${d.channels.join(' / ')}</div></div>`;
        ul.appendChild(li);
      });
    }
    syncSerialSelects();
  } catch (e) {
    ul.innerHTML = '<li class="empty">读取设备列表失败：' + e.message + '</li>';
  }
}

function syncSerialSelects() {
  ['rec-serial', 'file-serial', 'mirror-serial'].forEach((id) => {
    const sel = $(id);
    const keep = sel.value;
    sel.innerHTML = '';
    devices.forEach((d) => {
      const o = document.createElement('option');
      o.value = d.serial;
      o.textContent = `${d.label}${d.preferred_usb ? '（USB）' : '（无线）'}`;
      sel.appendChild(o);
    });
    if (devices.some((d) => d.serial === keep)) sel.value = keep;
  });
}

async function loadRecordings() {
  const ul = $('recordings');
  try {
    const data = await api('/api/recordings');
    const items = data.recordings || [];
    if (!items.length) { ul.innerHTML = '<li class="empty">暂无录像</li>'; return; }
    ul.innerHTML = '';
    items.forEach((r) => {
      const li = document.createElement('li');
      li.className = 'item';
      const mb = (r.bytes / 1048576).toFixed(1);
      const when = r.modified ? new Date(r.modified * 1000).toLocaleString('zh-CN') : '';
      li.innerHTML = `<div><span class="name">${r.name}</span>
        <div class="meta">${mb} MB · ${when}</div></div>
        <div class="row">
          <a href="/files/recordings/${encodeURIComponent(r.name)}" target="_blank">
            <button>播放/下载</button></a>
          <button class="danger" data-del="${r.name}">删除</button>
        </div>`;
      ul.appendChild(li);
    });
    ul.querySelectorAll('[data-del]').forEach((b) => {
      b.onclick = async () => {
        if (!confirm('确定删除这份录像？')) return;
        try {
          await api('/api/recordings/' + encodeURIComponent(b.dataset.del), { method: 'DELETE' });
          loadRecordings();
        } catch (e) { alert(e.message); }
      };
    });
  } catch (e) { ul.innerHTML = '<li class="empty">读取失败：' + e.message + '</li>'; }
}

async function startRecord() {
  const serial = $('rec-serial').value;
  if (!serial) { show($('rec-msg'), '请先连接一台手机。', true); return; }
  try {
    const r = await api('/api/record/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ serial, quality: $('rec-quality').value }),
    });
    $('rec-state').textContent = '录制中：' + r.file;
    $('rec-start').disabled = true;
    $('rec-stop').disabled = false;
    show($('rec-msg'), '已开始录制：' + r.file);
  } catch (e) { show($('rec-msg'), e.message, true); }
}

async function stopRecord() {
  try {
    const r = await api('/api/record/stop', { method: 'POST' });
    $('rec-state').textContent = '未在录制';
    $('rec-start').disabled = false;
    $('rec-stop').disabled = true;
    show($('rec-msg'), '录制已结束：' + r.file);
    loadRecordings();
  } catch (e) { show($('rec-msg'), e.message, true); }
}

// ===================== 截图画廊 =====================
async function takeShot() {
  const serial = $('file-serial').value || $('rec-serial').value || $('mirror-serial').value;
  if (!serial) { alert('请先连接一台手机。'); return; }
  try {
    await api('/api/screenshot?serial=' + encodeURIComponent(serial));
    loadScreenshots();
  } catch (e) { alert(e.message); }
}

async function loadScreenshots() {
  const grid = $('shot-grid');
  try {
    const data = await api('/api/screenshots');
    const items = data.screenshots || [];
    if (!items.length) { grid.innerHTML = '<div class="empty">暂无截图</div>'; return; }
    grid.innerHTML = '';
    items.forEach((s) => {
      const cell = document.createElement('div');
      cell.className = 'shot-cell';
      cell.innerHTML =
        `<img loading="lazy" src="/files/screenshots/${encodeURIComponent(s.name)}" alt="${s.name}">` +
        `<button class="shot-del" data-del="${s.name}">删</button>` +
        `<div class="shot-name">${s.name}</div>`;
      cell.querySelector('img').onclick = () =>
        window.open('/files/screenshots/' + encodeURIComponent(s.name), '_blank');
      cell.querySelector('[data-del]').onclick = async (ev) => {
        ev.stopPropagation();
        if (!confirm('删除这张截图？')) return;
        try {
          await api('/api/screenshots/' + encodeURIComponent(s.name), { method: 'DELETE' });
          loadScreenshots();
        } catch (e) { alert(e.message); }
      };
      grid.appendChild(cell);
    });
  } catch (e) { grid.innerHTML = '<div class="empty">读取失败：' + e.message + '</div>'; }
}

// ===================== 手机文件（列表 + 上传/下载/删除）=====================
async function listFiles() {
  const serial = $('file-serial').value;
  const ul = $('files');
  if (!serial) { ul.innerHTML = '<li class="empty">请先连接一台手机</li>'; return; }
  try {
    const r = await api('/api/files?serial=' + encodeURIComponent(serial)
      + '&path=' + encodeURIComponent($('file-path').value));
    const entries = r.entries || [];
    if (!entries.length) { ul.innerHTML = '<li class="empty">该目录下没有内容</li>'; return; }
    ul.innerHTML = '';
    entries.forEach((name) => {
      const li = document.createElement('li');
      li.className = 'item';
      const full = ($('file-path').value.replace(/\/+$/, '') + '/' + name);
      li.innerHTML =
        `<span class="name">${name}</span>` +
        `<span class="file-acts">` +
        `<button data-dl="${full}">下载</button>` +
        `<button class="danger" data-rm="${full}">删除</button>` +
        `</span>`;
      ul.appendChild(li);
    });
    ul.querySelectorAll('[data-dl]').forEach((b) => {
      b.onclick = () => downloadFile(b.dataset.dl);
    });
    ul.querySelectorAll('[data-rm]').forEach((b) => {
      b.onclick = () => deleteFile(b.dataset.rm);
    });
  } catch (e) { ul.innerHTML = '<li class="empty">' + e.message + '</li>'; }
}

async function uploadFile() {
  const serial = $('file-serial').value;
  const input = $('file-upload-input');
  if (!serial) { show($('file-msg'), '请先连接一台手机。', true); return; }
  if (!input.files || !input.files.length) { show($('file-msg'), '请先选择要上传的文件。', true); return; }
  const fd = new FormData();
  fd.append('file', input.files[0]);
  const dir = $('file-path').value || '/sdcard/Download';
  show($('file-msg'), '上传中…');
  try {
    const res = await fetch('/api/files/upload?serial=' + encodeURIComponent(serial)
      + '&path=' + encodeURIComponent(dir), { method: 'POST', body: fd });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((body.message || '上传失败') + '\n' + (body.recovery || ''));
    show($('file-msg'), '已上传到 ' + (body.dir || dir));
    input.value = '';
    listFiles();
  } catch (e) { show($('file-msg'), e.message, true); }
}

async function downloadFile(remote) {
  const serial = $('file-serial').value;
  show($('file-msg'), '从手机拉取中…');
  try {
    const r = await api('/api/files/download?serial=' + encodeURIComponent(serial)
      + '&remote=' + encodeURIComponent(remote));
    show($('file-msg'), '已下载，开始保存到本机…');
    const a = document.createElement('a');
    a.href = r.url;
    a.download = r.file;
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (e) { show($('file-msg'), e.message, true); }
}

async function deleteFile(remote) {
  const serial = $('file-serial').value;
  if (!confirm('删除手机上的这个文件？\n' + remote)) return;
  try {
    await api('/api/files/delete?serial=' + encodeURIComponent(serial)
      + '&remote=' + encodeURIComponent(remote), { method: 'POST' });
    show($('file-msg'), '已删除：' + remote);
    listFiles();
  } catch (e) { show($('file-msg'), e.message, true); }
}

// ===================== 应用管理 =====================
async function loadApps() {
  const serial = $('file-serial').value || $('rec-serial').value || $('mirror-serial').value;
  const ul = $('apps');
  if (!serial) { ul.innerHTML = '<li class="empty">请先连接一台手机</li>'; return; }
  const sys = $('apps-system').checked ? '&system=1' : '';
  ul.innerHTML = '<li class="empty">读取中…</li>';
  try {
    const r = await api('/api/apps?serial=' + encodeURIComponent(serial) + sys);
    const apps = r.apps || [];
    if (!apps.length) { ul.innerHTML = '<li class="empty">没有应用</li>'; return; }
    ul.innerHTML = '';
    apps.forEach((a) => {
      const li = document.createElement('li');
      li.className = 'item app-item';
      li.innerHTML = `<span class="name">${a.package}</span>` +
        `<span class="badge ${a.third_party ? 'tp' : 'sys'}">${a.third_party ? '第三方' : '系统'}</span>`;
      ul.appendChild(li);
    });
  } catch (e) { ul.innerHTML = '<li class="empty">' + e.message + '</li>'; }
}

async function installApk() {
  const serial = $('file-serial').value || $('rec-serial').value || $('mirror-serial').value;
  const input = $('apk-input');
  if (!serial) { show($('apps-msg'), '请先连接一台手机。', true); return; }
  if (!input.files || !input.files.length) { show($('apps-msg'), '请先选择 .apk 文件。', true); return; }
  const fd = new FormData();
  fd.append('file', input.files[0]);
  show($('apps-msg'), '安装中（大 APK 可能需要几十秒）…');
  try {
    const res = await fetch('/api/apps/install?serial=' + encodeURIComponent(serial),
      { method: 'POST', body: fd });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((body.message || '安装失败') + '\n' + (body.recovery || ''));
    show($('apps-msg'), '安装完成。');
    input.value = '';
    loadApps();
  } catch (e) { show($('apps-msg'), e.message, true); }
}

// ===================== 实时镜像（WebCodecs + WebSocket）=====================
const mirror = {
  ws: null,
  decoder: null,      // WebCodecs VideoDecoder（安全上下文）
  wasm: null,         // WASM 软解实例（局域网 HTTP 兜底）
  mode: null,         // 'webcodecs' | 'wasm'
  canvas: $('mirror-canvas'),
  ctx: null,
  screenW: 0,
  screenH: 0,
  configured: false,
  queue: [],
};
mirror.ctx = mirror.canvas.getContext('2d');

// WASM 软解兜底：WebCodecs 只在安全上下文（HTTPS/localhost）暴露，
// 局域网 http://IP:8080 没有它——此时用 WASM 在 CPU 解 baseline H.264。
let wasmModulePromise = null;
async function mirrorEnsureWasm() {
  if (mirror.wasm) return true;
  try {
    if (!wasmModulePromise) wasmModulePromise = import('./wasm-decoder.mjs');
    const m = await wasmModulePromise;
    mirror.wasm = new m.WasmDecoder();
    await mirror.wasm.init();
    return true;
  } catch (e) {
    show($('mirror-msg'), '软解加载失败：' + e.message, true);
    return false;
  }
}

const KEYCODES = { back: 4, home: 3, recents: 187, power: 26 };

function mirrorSetState(text, live) {
  $('mirror-state').textContent = text;
  $('mirror-stage').classList.toggle('live', !!live);
  $('mirror-start').disabled = !!live;
  $('mirror-stop').disabled = !live;
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function mirrorEnsureDecoder() {
  if (mirror.decoder || mirror.mode === 'wasm') return;
  if (!('VideoDecoder' in window)) {
    // 非安全上下文（局域网 HTTP）→ 标记走 WASM，不在这里报错打断。
    mirror.mode = 'wasm';
    return;
  }
  mirror.mode = 'webcodecs';
  mirror.decoder = new VideoDecoder({
    output: (frame) => {
      // 直接画到 canvas。createImageBitmap 异步会乱序，drawImage(frame) 同步最稳。
      if (mirror.canvas.width !== frame.displayWidth) {
        mirror.canvas.width = frame.displayWidth;
        mirror.canvas.height = frame.displayHeight;
      }
      mirror.ctx.drawImage(frame, 0, 0);
      frame.close();
    },
    error: (e) => show($('mirror-msg'), '解码器异常：' + e.message, true),
  });
}

function mirrorHandle(msg) {
  switch (msg.t) {
    case 'meta':
      mirrorSetState(`已连接 ${msg.device}（${msg.codec}）`, true);
      break;
    case 'session':
      mirror.screenW = msg.width;
      mirror.screenH = msg.height;
      // 分辨率变化要重置解码器，否则旧 SPS 解新分辨率会花屏。
      if (mirror.decoder && mirror.decoder.state !== 'closed') {
        try { mirror.decoder.reset(); } catch (_) {}
      }
      if (mirror.wasm) { mirror.wasm.reset(); }
      mirror.configured = false;
      break;
    case 'video': {
      const data = b64ToBytes(msg.data);
      if (mirror.mode === 'wasm' || (!('VideoDecoder' in window))) {
        // WASM 软解：config(SPS/PPS) 帧与普通帧一起按序喂,tinyh264 自取参数集。
        mirrorEnsureWasm().then((ok) => {
          if (!ok || !mirror.wasm) return;
          mirror.wasm.decodePacket(data, msg.config, msg.keyframe, (img, w, h) => {
            if (mirror.canvas.width !== w) { mirror.canvas.width = w; mirror.canvas.height = h; }
            mirror.ctx.putImageData(img, 0, 0);
          });
        });
        break;
      }
      mirrorEnsureDecoder();
      if (!mirror.decoder || mirror.decoder.state === 'closed') return;
      // scrcpy-server 用 MediaCodec 输出的是 H.264 **Annex-B 裸流**（Tango ADB 官方
      // 文档确认），SPS/PPS 内联在流里。浏览器解 Annex-B 时**不给 description**
      // （那是 AVCC 格式专用），只声明 codec 让解码器自行从流里读参数集。
      if (!mirror.configured) {
        if (!msg.config) return; // 首个 config(SPS/PPS) 包到来前的帧没法解,先丢
        mirror.decoder.configure({
          codec: 'avc1.640028',        // H.264 High@4.0,宽容声明,实际以流内 SPS 为准
          optimizeForLatency: true,    // 实时镜像优先低延迟而非画质
          hardwareAcceleration: 'prefer-hardware',
        });
        mirror.configured = true;
      }
      // config 包通常紧跟一个 IDR,是同一条 Access Unit——configure 后本帧要继续喂,
      // 不能丢,否则首个关键帧被吃掉会导致开局黑屏直到下一个 IDR。
      const chunk = new EncodedVideoChunk({
        type: msg.keyframe ? 'key' : 'delta',
        timestamp: msg.pts || 0,
        data,
      });
      try { mirror.decoder.decode(chunk); } catch (_) {}
      break;
    }
    case 'state':
      if (!msg.running) mirrorSetState('已断开', false);
      break;
    case 'error':
      show($('mirror-msg'), msg.message, true);
      break;
  }
}

function mirrorStart() {
  const serial = $('mirror-serial').value;
  if (!serial) { show($('mirror-msg'), '请先连接一台手机。', true); return; }
  // 选定解码模式：有 WebCodecs 用硬解，没有则 WASM 软解（局域网 HTTP 兜底）。
  mirrorEnsureDecoder();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/api/stream/ws?serial=${encodeURIComponent(serial)}`);
  mirror.ws = ws;
  mirrorSetState('连接中…', false);
  ws.onmessage = (ev) => {
    try { mirrorHandle(JSON.parse(ev.data)); } catch (_) {}
  };
  ws.onclose = () => { mirrorSetState('已断开', false); mirror.ws = null; };
  ws.onerror = () => show($('mirror-msg'), '镜像连接失败。', true);
}

function mirrorStop() {
  const serial = $('mirror-serial').value;
  if (mirror.ws) { try { mirror.ws.close(); } catch (_) {} mirror.ws = null; }
  if (mirror.wasm) { mirror.wasm.dispose(); mirror.wasm = null; }
  if (mirror.decoder && mirror.decoder.state !== 'closed') {
    try { mirror.decoder.close(); } catch (_) {}
  }
  mirror.decoder = null;
  mirror.configured = false;
  if (serial) {
    api('/api/stream/stop?serial=' + encodeURIComponent(serial), { method: 'POST' }).catch(() => {});
  }
  mirrorSetState('未连接', false);
}

function mirrorSend(obj) {
  if (mirror.ws && mirror.ws.readyState === WebSocket.OPEN) {
    mirror.ws.send(JSON.stringify(obj));
  }
}

// 把 canvas 上的指针坐标换算成设备像素坐标。
function canvasToDevice(ev) {
  const rect = mirror.canvas.getBoundingClientRect();
  const x = (ev.clientX - rect.left) * (mirror.screenW / rect.width);
  const y = (ev.clientY - rect.top) * (mirror.screenH / rect.height);
  return {
    x: Math.max(0, Math.round(x)),
    y: Math.max(0, Math.round(y)),
  };
}

function bindMirrorControl() {
  const c = mirror.canvas;
  let touching = false;
  c.addEventListener('pointerdown', (ev) => {
    if (!mirror.ws) return;
    touching = true;
    c.setPointerCapture(ev.pointerId);
    const p = canvasToDevice(ev);
    mirrorSend({ t: 'touch', action: 'down', x: p.x, y: p.y, screenW: mirror.screenW, screenH: mirror.screenH, pressure: 1 });
  });
  c.addEventListener('pointermove', (ev) => {
    if (!touching || !mirror.ws) return;
    const p = canvasToDevice(ev);
    mirrorSend({ t: 'touch', action: 'move', x: p.x, y: p.y, screenW: mirror.screenW, screenH: mirror.screenH, pressure: 1 });
  });
  const release = (ev) => {
    if (!touching || !mirror.ws) return;
    touching = false;
    const p = canvasToDevice(ev);
    mirrorSend({ t: 'touch', action: 'up', x: p.x, y: p.y, screenW: mirror.screenW, screenH: mirror.screenH, pressure: 1 });
  };
  c.addEventListener('pointerup', release);
  c.addEventListener('pointercancel', release);

  // 工具栏按键。
  document.querySelectorAll('.mirror-toolbar [data-act]').forEach((b) => {
    b.onclick = () => {
      const act = b.dataset.act;
      if (act === 'back') mirrorSend({ t: 'back' });
      else if (act === 'rotate') mirrorSend({ t: 'rotate' });
      else if (act === 'power') mirrorSend({ t: 'key', action: 'down', keycode: KEYCODES.power });
      else if (KEYCODES[act] != null) {
        mirrorSend({ t: 'key', action: 'down', keycode: KEYCODES[act] });
        mirrorSend({ t: 'key', action: 'up', keycode: KEYCODES[act] });
      }
    };
  });
}

$('mirror-start').onclick = mirrorStart;
$('mirror-stop').onclick = mirrorStop;
bindMirrorControl();

$('refresh-devices').onclick = loadDevices;
$('refresh-rec').onclick = loadRecordings;
$('refresh-files').onclick = listFiles;
$('refresh-shots').onclick = loadScreenshots;
$('refresh-apps').onclick = loadApps;
$('rec-start').onclick = startRecord;
$('rec-stop').onclick = stopRecord;
$('shot').onclick = takeShot;
$('list-files').onclick = listFiles;
$('file-upload').onclick = uploadFile;
$('apk-install').onclick = installApk;

// ---------------------------------------------------------------------------
// 设置（画质 + 保留天数）
// ---------------------------------------------------------------------------

async function loadSettings() {
  try {
    const s = await api('/api/settings');
    $('settings-quality').value = s.quality || 'balanced';
    $('settings-retention').value = s.retention_days;
    if (s.retention_locked_by_env) {
      $('settings-retention').disabled = true;
      const msg = $('settings-msg');
      msg.textContent = '保留天数由部署环境变量 MIRRORDOCK_RETENTION_DAYS 钉死，网页修改不生效。';
      msg.style.color = '#b45309';
      msg.hidden = false;
    }
  } catch (e) { /* 设置加载失败不阻塞页面其余功能 */ }
}

async function saveSettings() {
  const msg = $('settings-msg');
  msg.hidden = true;
  const body = {
    quality: $('settings-quality').value,
    retention_days: Math.max(0, parseInt($('settings-retention').value, 10) || 0),
  };
  try {
    const s = await api('/api/settings', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    msg.textContent = `已保存：画质 ${s.quality}，录像保留 ${s.retention_days} 天。` +
      (s.retention_locked_by_env ? '（保留天数受环境变量控制，未改动）' : '');
    msg.style.color = '#15803d';
    msg.hidden = false;
    loadStatus(); // 状态栏的「归档保留 N 天」立即刷新
  } catch (e) {
    msg.textContent = e.message;
    msg.style.color = '#b91c1c';
    msg.hidden = false;
  }
}

$('settings-save').onclick = saveSettings;

loadStatus();
loadDevices();
loadRecordings();
loadScreenshots();
loadSettings();
setInterval(loadStatus, 15000);
</script>
