# NAS 版服务端。
#
# 依赖刻意保持精简：服务端只做「薄编排层」——真正的判据逻辑都在 md-core，
# 与桌面端同源（设备去重/通道优先级/结构化错误），避免两端实现漂移。
[package]
name = "mirrordock-nas"
version = "0.4.24"
edition = "2021"
description = "MirrorDock NAS 版服务端：常开机 + USB 直连 + 录制归档 + Web 访问"
publish = false

[[bin]]
name = "mirrordock-nas"
path = "src/main.rs"

[dependencies]
md-core = { path = "../../crates/md-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rt-multi-thread：HTTP 服务与后台录制监视线程共用；process 用于拉起 scrcpy/adb。
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync", "net", "fs"] }
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio", "macros", "query", "ws", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 实时镜像：视频帧 base64 编码（WS 文本帧），futures-util 提供 WS stream/sink 工具。
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# 应用内鉴权（X10-119）：PBKDF2-HMAC-SHA256 密码哈希 + 系统随机会话 Token。
# 选 ring 而不是 args 散装的 sha2+pbkdf2+rand 三件套：一个 crate 全覆盖，
# 且恒定时间比较由 ring 内部保证。
ring = "0.17"
# 检查更新（X10-120）：匿名调 GHCR 公共接口比对镜像 digest。
# rustls 而非 openssl——容器精简镜像里不装 libssl，纯 Rust TLS 零系统依赖。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# libc：仅在 Unix 下用于重置子进程信号处置（见 record.rs 的 X10-95 说明）。
[target.'cfg(unix)'.dependencies]
libc = "0.2"
