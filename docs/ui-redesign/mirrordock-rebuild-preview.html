<!DOCTYPE html>
<html lang="zh-CN" data-theme="mist">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MirrorDock · 整体重构预览（安静诊断台）</title>
<!--
  MirrorDock 整体重构预览 · Phase 3（v3.0 设计系统 + 圆角差异化修订）
  ─────────────────────────────────────────────────────────────
  设计系统：design-system-expert v3.0「Linear DNA 安静诊断台」
  圆角差异化 5 档：--r-surface 2px（主内容/视图容器，近平面集成式）/
  --r-control 4px（控件） / --r-card 6px（卡片/表格/列表行）/
  --r-panel 8px（侧栏/抽屉/弹层/浮层） / --r-pill 999px（状态点/药丸/徽章）。
  影子仅浮层允许 --shadow-2；其余表面一律扁平 + hairline（--line），无影子。
  重构约束（本次成败核心）：
    1. 单一导航源 —— 左侧可折叠侧栏（232px / ⌘B 折叠 56px）承载 4 分组 19 视图；
       顶栏降级为纯窗口工具区（品牌 + ⌘K 搜索 + 设备 pill + 主题 + 帮助），删除模块 Tab。
    2. 情境右栏 —— 仅设备相关视图按需显示 280px 情境面板，非设备视图全宽；
       <1200px 自动收起为「详情」浮层，<1000px 隐藏。
    3. 标题去重 —— 每视图仅 1 个页面级标题（View Header 20px + 13px muted 说明）；
       卡片标题仅在内容 ≠ 页面标题时保留。
    4. 布局填充 —— 内容自适应填充 1000–1600px，4px 标尺，消除留白断层。
    5. 性能 —— 无 blur 铺满（Frost 仅 rgba 微透明）；动画 ≤150ms 且尊重 prefers-reduced-motion；
       视图 JS 动态渲染 + 可加「模拟加载」演示延迟。
  功能内容来源：现有预览 mirrordock-redesign-preview.html + src/assistantViews.tsx（只取真实功能/文案）。
  图标：全部单色线性 SVG（Lucide/Heroicons 风格）16px，默认 text-2，激活项 accent。
  ─────────────────────────────────────────────────────────────
-->
<style>
/* ============================================================
   0 · 设计令牌基座（v3.0）
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
             "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  /* 字号 7 档（中文正文 ≥13px） */
  --fs-11: 11px; --fs-12: 12px; --fs-13: 13px; --fs-14: 14px;
  --fs-16: 16px; --fs-20: 20px; --fs-28: 28px;
  --lh-tight: 1.3; --lh-ui: 1.45; --lh-body: 1.6;
  /* 间距 4px 标尺 */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;
  /* 圆角 5 档（差异化 · 药丸仅状态点/徽章/开关）：
     surface 2px 主内容/视图容器（近平面集成式）| control 4px 控件 | card 6px 卡片 | panel 8px 浮层 */
  --r-pill: 999px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur: .14s;
  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
}

/* ---------- 5 套主题完整令牌（每套覆盖全部 25 变量） ---------- */
html[data-theme="mist"] {
  color-scheme: light;
  --bg: #F7F8F9; --surface: #FFFFFF; --surface-2: #EFF1F4; --surface-3: #FAFBFC;
  --text: #1A1D21; --text-2: #4A5158; --muted: #7A828B;
  --line: #E4E7EA; --line-strong: #C9CED5;
  --accent: #2563EB; --accent-strong: #1D4ED8; --accent-soft: #E8EFFD; --on-accent: #FFFFFF;
  --ok: #178A4E; --ok-soft: #E2F3EA;
  --warn: #B45309; --warn-soft: #FBF0DF;
  --danger: #D14343; --danger-soft: #FAE9E9;
  --shadow-1: 0 1px 2px rgba(20,24,30,.05);
  --shadow-2: 0 8px 24px rgba(20,24,30,.12);
  --radius-shift: 0px;
  --titlebar-bg: #FFFFFF; --titlebar-text: #1A1D21;
  --mask: rgba(12,16,24,.45);
}
html[data-theme="midnight"] {
  color-scheme: dark;
  --bg: #14161B; --surface: #1B1E24; --surface-2: #232730; --surface-3: #181B21;
  --text: #ECEEF2; --text-2: #A9B0BA; --muted: #6E7682;
  --line: #2A2F38; --line-strong: #3A4150;
  --accent: #4D8DFF; --accent-strong: #7AA8FF; --accent-soft: rgba(77,141,255,.15); --on-accent: #0B1220;
  --ok: #3ECF8E; --ok-soft: rgba(62,207,142,.15);
  --warn: #F0A63C; --warn-soft: rgba(240,166,60,.15);
  --danger: #FF6B6B; --danger-soft: rgba(255,107,107,.14);
  --shadow-1: 0 1px 2px rgba(0,0,0,.4);
  --shadow-2: 0 12px 32px rgba(0,0,0,.5);
  --radius-shift: 0px;
  --titlebar-bg: #1B1E24; --titlebar-text: #ECEEF2;
  --mask: rgba(0,0,0,.55);
}
html[data-theme="porcelain"] {
  color-scheme: light;
  --bg: #FBFAF9; --surface: #FFFFFF; --surface-2: #F3F1EF; --surface-3: #F9F8F6;
  --text: #1C1B19; --text-2: #4E4B46; --muted: #7E7A73;
  --line: #E9E6E2; --line-strong: #D2CEC7;
  --accent: #2E6BD6; --accent-strong: #2255B5; --accent-soft: #E9F0FB; --on-accent: #FFFFFF;
  --ok: #1E7A4A; --ok-soft: #E4F2E9;
  --warn: #A05A0A; --warn-soft: #FAF0DE;
  --danger: #C74040; --danger-soft: #F9E9E9;
  --shadow-1: 0 1px 2px rgba(28,27,25,.05);
  --shadow-2: 0 6px 20px rgba(28,27,25,.10);
  --radius-shift: 0px;
  --titlebar-bg: #FFFFFF; --titlebar-text: #1C1B19;
  --mask: rgba(12,16,24,.42);
}
html[data-theme="ember"] {
  color-scheme: light;
  --bg: #FAF6F3; --surface: #FFFFFF; --surface-2: #F5EFEA; --surface-3: #FBF8F5;
  --text: #211C18; --text-2: #5A5149; --muted: #877B71;
  --line: #EBE3DC; --line-strong: #D6C9BE;
  --accent: #C1500A; --accent-strong: #A04008; --accent-soft: #FBEAE0; --on-accent: #FFFFFF;
  --ok: #1E7A4A; --ok-soft: #E4F2E9;
  --warn: #A05A0A; --warn-soft: #FAF0DE;
  --danger: #C74040; --danger-soft: #F9E9E9;
  --shadow-1: 0 1px 2px rgba(33,28,24,.05);
  --shadow-2: 0 8px 24px rgba(33,28,24,.11);
  --radius-shift: 0px;
  --titlebar-bg: #FFFFFF; --titlebar-text: #211C18;
  --mask: rgba(12,16,24,.45);
}
html[data-theme="frost"] {
  color-scheme: light;
  --bg: #E9EEF5; --surface: rgba(255,255,255,.72); --surface-2: rgba(255,255,255,.55); --surface-3: rgba(255,255,255,.42);
  --text: #1B2438; --text-2: #47536D; --muted: #67718A;
  --line: rgba(28,40,70,.12); --line-strong: rgba(28,40,70,.22);
  --accent: #3E63DD; --accent-strong: #2C4AB8; --accent-soft: rgba(62,99,221,.12); --on-accent: #FFFFFF;
  --ok: #1D8A54; --ok-soft: rgba(29,138,84,.13);
  --warn: #B06A10; --warn-soft: rgba(176,106,16,.13);
  --danger: #CD3D3D; --danger-soft: rgba(205,61,61,.12);
  --shadow-1: 0 1px 3px rgba(25,40,80,.10);
  --shadow-2: 0 12px 36px rgba(25,40,80,.18);
  --radius-shift: 0px;
  --titlebar-bg: rgba(255,255,255,.72); --titlebar-text: #1B2438;
  --mask: rgba(12,16,24,.45);
}
/* Frost 签名：单一冷调背景（无 blur，仅 rgba 微透明；唯一允许的硬编码背景） */
html[data-theme="frost"] body::before {
  position: fixed; inset: 0; z-index: -1; content: "";
  background: radial-gradient(1200px 560px at 14% -10%, rgba(80,140,255,.16), transparent 60%),
              linear-gradient(165deg, #EAF0F7, #DCE5F1);
}

/* ============================================================
   1 · 基础
   ============================================================ */
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-ui); font-size: var(--fs-13); color: var(--text);
  background: var(--bg); line-height: var(--lh-ui);
  font-synthesis: none; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
h1, h2, h3, h4, p, dl, dd, figure { margin: 0; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.mono { font-family: var(--font-mono); font-size: var(--fs-13); }
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.lg { width: 28px; height: 28px; }
.ic.sm { width: 14px; height: 14px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }

/* ============================================================
   2 · 外壳（44 titlebar / 232(56) sidebar / 56 vh / 28 statusbar）
   ============================================================ */
.app {
  --side-w: 232px;
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr);
  grid-template-rows: 44px minmax(0, 1fr) 28px;
  grid-template-areas: "title title" "side main" "foot foot";
  height: 100vh;
}
.app.side-alt { --side-w: 56px; }

/* ---------- 顶栏 44px · 纯窗口工具区（无模块导航） ---------- */
.titlebar {
  grid-area: title; display: flex; align-items: center; gap: var(--sp-3);
  padding: 0 var(--sp-3) 0 var(--sp-2);
  background: var(--titlebar-bg); color: var(--titlebar-text);
  border-bottom: 1px solid var(--line); position: relative; z-index: 50; white-space: nowrap;
}
.brand { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-16); font-weight: 700; color: var(--titlebar-text); }
.brand-mark {
  width: 24px; height: 24px; border-radius: var(--r-control); display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent); font-size: var(--fs-12); font-weight: 700;
}
.tb-search {
  flex: 0 1 360px; margin-inline: auto; display: flex; align-items: center; gap: var(--sp-2);
  height: 30px; padding: 0 var(--sp-3); min-width: 180px;
  border: 1px solid var(--line); border-radius: var(--r-control); background: var(--surface-2);
  color: var(--muted); font-size: var(--fs-13); cursor: pointer; text-align: left;
}
.tb-search:hover { border-color: var(--line-strong); background: var(--surface); }
.tb-search .kbd { margin-inline-start: auto; }
.tb-right { display: flex; align-items: center; gap: var(--sp-2); margin-inline-start: auto; }
.pill {
  display: inline-flex; align-items: center; gap: var(--sp-2); height: 30px; padding: 0 var(--sp-3);
  border: 1px solid var(--line-strong); border-radius: var(--r-control); background: var(--surface);
  font-size: var(--fs-12); color: var(--text-2); cursor: pointer; max-width: 190px;
}
.pill:hover { background: var(--surface-2); }
.pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 侧栏 232px / 56px ---------- */
.sidebar {
  grid-area: side; display: flex; flex-direction: column; min-width: 0;
  background: var(--surface); border-right: 1px solid var(--line);
  overflow-y: auto; overscroll-behavior: contain; position: relative;
}
.side-scroll { flex: 1; padding: var(--sp-2); overflow-y: auto; }
.nav-group-title {
  margin: var(--sp-5) var(--sp-2) var(--sp-1);
  padding: 0 var(--sp-2);
  font-size: var(--fs-11); font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  color: var(--muted);
}
.nav-item {
  display: flex; align-items: center; gap: var(--sp-2); width: 100%;
  height: 34px; padding: 0 var(--sp-3); margin: 1px 0;
  border: 0; border-radius: var(--r-control); background: transparent; text-align: left;
  color: var(--text-2); font-size: var(--fs-13); font-weight: 500; cursor: pointer; position: relative;
}
.nav-item .ic { color: var(--muted); }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item[aria-current="page"] .ic { color: var(--accent); }
.nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-badge { margin-inline-start: auto; }
.side-foot {
  border-top: 1px solid var(--line); padding: var(--sp-2); display: flex; align-items: center; gap: var(--sp-2); flex: none;
}
.side-foot .hint-line { font-size: var(--fs-12); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-foot .spacer { margin-inline-start: auto; }
/* 折叠态 56px */
.app.side-alt .nav-label, .app.side-alt .nav-group-title, .app.side-alt .side-foot .hint-line { display: none; }
.app.side-alt .nav-item { justify-content: center; padding: 0; }
.app.side-alt .nav-group-title { height: 1px; margin: var(--sp-2) var(--sp-2) 0; padding: 0; background: var(--line); text-transform: none; }
.app.side-alt .nav-badge { display: none; }

/* ---------- 工作区：ws-main + 情境右栏 ---------- */
.workspace { grid-area: main; display: flex; min-width: 0; min-height: 0; }
.ws-main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; }
.vh {
  position: sticky; top: 0; z-index: 20; min-height: 64px;
  display: flex; align-items: center; gap: var(--sp-4); flex-wrap: nowrap;
  padding: var(--sp-3) var(--sp-6); background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.vh-title { font-size: var(--fs-20); font-weight: 700; line-height: var(--lh-tight); letter-spacing: -.01em; }
.vh-sub { font-size: var(--fs-13); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.vh-head-text { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.vh-actions { margin-inline-start: auto; display: flex; align-items: center; gap: var(--sp-2); flex: none; }
.demo-sw {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--fs-12); color: var(--muted); cursor: pointer;
  padding: 4px 8px; border: 1px dashed var(--line-strong); border-radius: var(--r-control); white-space: nowrap;
}
.demo-sw:hover { color: var(--text-2); border-color: var(--muted); }
.demo-sw .switch { margin: 0; }
/* 主内容/视图容器：近平面集成式（--r-surface 2px），底色分层 + hairline 分隔 + 留白分组，不独立成圆角盒 */
.content { max-width: 1600px; width: 100%; margin-inline: auto; padding: var(--sp-6); display: grid; gap: var(--sp-4); align-content: start; border-radius: var(--r-surface); }
/* 情境右栏 280px */
.ctx {
  width: 280px; flex: none; border-left: 1px solid var(--line); background: var(--surface-2);
  overflow-y: auto; padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3);
}
.ctx-block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: var(--sp-4); }
.ctx-block h3 { font-size: var(--fs-12); font-weight: 600; color: var(--muted); margin-bottom: var(--sp-3); letter-spacing: .03em; }
.ctx-dl { display: grid; gap: var(--sp-2); margin: 0; }
.ctx-dl > div { display: flex; justify-content: space-between; gap: var(--sp-2); font-size: var(--fs-13); }
.ctx-dl dt { color: var(--muted); }
.ctx-dl dd { color: var(--text); font-weight: 500; text-align: right; }
.ctx-note { font-size: var(--fs-12); color: var(--muted); line-height: var(--lh-body); }

/* ---------- 状态条 28px ---------- */
.statusbar {
  grid-area: foot; display: flex; align-items: center; gap: var(--sp-4);
  padding: 0 var(--sp-4); background: var(--surface-2); border-top: 1px solid var(--line);
  font-size: var(--fs-12); color: var(--muted); white-space: nowrap; overflow: hidden;
}
.statusbar .spacer { margin-inline-start: auto; }
.statusbar b { color: var(--text-2); font-weight: 600; }
.sb-privacy { display: inline-flex; align-items: center; gap: var(--sp-1); }

/* ============================================================
   3 · 组件库（v3.0）
   ============================================================ */
:root { --r-surface: calc(2px + var(--radius-shift)); --r-control: calc(4px + var(--radius-shift)); --r-card: calc(6px + var(--radius-shift)); --r-panel: calc(8px + var(--radius-shift)); }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 14px; border-radius: var(--r-control);
  font-size: var(--fs-13); font-weight: 600; border: 1px solid transparent; cursor: pointer; white-space: nowrap;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.btn:focus-visible { box-shadow: var(--focus-ring); outline: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn-secondary { background: var(--surface-2); color: var(--text); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-3); border-color: var(--line-strong); }
.btn-secondary:not(:disabled) { border-color: var(--line); }
.btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: var(--danger-soft); }
.btn-danger-solid { background: var(--danger); color: #fff; }
.btn-danger-solid:hover:not(:disabled) { filter: brightness(.94); }
.btn-ghost { height: auto; min-height: 24px; padding: 4px 8px; background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; border-radius: var(--r-control); }
.btn-ghost:hover:not(:disabled) { background: var(--accent-soft); }
.btn-ghost.danger { color: var(--danger); }
.btn-ghost.danger:hover { background: var(--danger-soft); }
.btn-sm { height: 26px; padding: 0 10px; font-size: var(--fs-12); }
.icon-btn {
  width: 28px; height: 28px; display: inline-grid; place-items: center;
  border: 0; background: transparent; border-radius: var(--r-control); color: var(--muted); cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.danger { color: var(--danger); }
.icon-btn.danger:hover { background: var(--danger-soft); }
.action-row { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }

/* ---------- 卡片（surface 分区 + 发丝线，无彩色左边框） ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
.card-head {
  display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-5);
  border-bottom: 1px solid var(--line); font-size: var(--fs-14); font-weight: 600; min-height: 46px;
}
.card-head .spacer, .spacer { margin-inline-start: auto; }
/* 卡头「标签 + 标题」横排（修复标签堆叠在标题上方的错排） */
.head-row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; min-width: 0; }
.head-row .head-title { font-size: var(--fs-14); font-weight: 600; }
.card-body { padding: var(--sp-5); }
.card-body.tight { padding: var(--sp-3) var(--sp-5); }
.card-section { background: var(--surface-2); border-radius: var(--r-card); padding: var(--sp-4); }
.card-foot { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--line); flex-wrap: wrap; }
/* details 卡片的展开/收起指示 */
details.card > summary.card-head::after { content: "展开"; margin-inline-start: auto; font-size: var(--fs-12); font-weight: 500; color: var(--muted); }
details.card[open] > summary.card-head::after { content: "收起"; }

/* ---------- 表格（发丝线行分隔 · 数值 mono 右对齐 · 状态列=点+字） ---------- */
.table-wrap { overflow-x: auto; }
.table { width: 100%; font-size: var(--fs-13); border-collapse: collapse; }
.table th {
  padding: 8px 12px; text-align: left; color: var(--muted); font-weight: 500;
  font-size: var(--fs-12); background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap;
}
.table td { padding: 10px 12px; border-bottom: 1px solid var(--line); color: var(--text-2); }
.table tbody tr:hover { background: var(--surface-3); }
.table tbody tr:last-child td { border-bottom: 0; }
.table th[data-col="ops"], .table td[data-col="ops"] { text-align: right; width: 120px; white-space: nowrap; }
.table th[data-col="num"], .table td[data-col="num"] { text-align: right; font-family: var(--font-mono); font-size: var(--fs-12); }
.table td b, .cell-main { color: var(--text); font-weight: 600; }
.table .cell-status { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Chips（控件圆角） / 徽章（药丸） ---------- */
.chip {
  display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: var(--r-control);
  font-size: var(--fs-12); border: 1px solid var(--line); background: var(--surface);
  color: var(--text-2); cursor: pointer; transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: var(--r-pill); font-size: var(--fs-12); font-weight: 600; white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.neutral { background: var(--surface-2); color: var(--muted); }

/* ---------- 表单 ---------- */
.input, .select {
  height: 32px; padding: 0 10px; border-radius: var(--r-control);
  border: 1px solid var(--line); background: var(--surface);
  color: var(--text); font-size: var(--fs-13); min-width: 0;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.input:hover, .select:hover { border-color: var(--line-strong); }
.input:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input::placeholder { color: var(--muted); }
.input:disabled { background: var(--surface-2); color: var(--muted); }
.field-error { color: var(--danger); font-size: var(--fs-12); margin-top: 6px; display: block; }
/* 开关 28×16 药丸 */
.switch {
  position: relative; display: inline-block; width: 28px; height: 16px; padding: 0; flex: none;
  border: 0; border-radius: var(--r-pill); background: var(--line-strong); cursor: pointer; transition: background var(--dur) var(--ease);
}
.switch[aria-checked="true"] { background: var(--accent); }
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
  border-radius: 50%; background: #fff; transition: transform var(--dur) var(--ease);
}
.switch[aria-checked="true"]::after { transform: translateX(12px); }
/* 标签页（下划线式） */
.tabs { display: flex; gap: var(--sp-4); border-bottom: 1px solid var(--line); }
.tab {
  position: relative; height: 36px; padding: 0 2px; border: 0; background: none;
  color: var(--text-2); font-size: var(--fs-13); font-weight: 500; cursor: pointer;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); font-weight: 600; }
.tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }

/* ---------- 状态点（6px） ---------- */
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex: none; }
.dot.ok { background: var(--ok); }
.dot.warn { background: var(--warn); }
.dot.off { background: var(--muted); }
.dot.busy { background: var(--accent); animation: pulse 1.2s infinite; }

/* ---------- 空态三件套 ---------- */
.empty { display: grid; justify-items: center; gap: var(--sp-3); padding: var(--sp-10) var(--sp-6); text-align: center; }
.empty-icon {
  width: 56px; height: 56px; border-radius: var(--r-card); display: grid; place-items: center;
  background: var(--surface-2); color: var(--muted);
}
.empty h3 { font-size: var(--fs-14); font-weight: 600; color: var(--text); }
.empty p { font-size: var(--fs-13); color: var(--muted); max-width: 440px; line-height: var(--lh-body); }
.empty .btn { margin-top: var(--sp-2); }
.empty.hint { padding: var(--sp-6); }

/* ---------- 加载 skeleton（透明度脉冲，禁渐变扫光） ---------- */
.skeleton {
  border-radius: var(--r-control); background: var(--surface-2);
  height: 14px; animation: sk-pulse 1.1s var(--ease) infinite;
}
@keyframes sk-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

/* ---------- 错误 / 提示 banner（danger-soft 底 + 左 3px 描边 + 必带下一步） ---------- */
.alert {
  display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-card); font-size: var(--fs-13); line-height: var(--lh-body);
  border-left: 3px solid transparent;
}
.alert > .ic { margin-top: 2px; }
.alert-warn { background: var(--warn-soft); color: var(--warn); border-left-color: var(--warn); }
.alert-danger { background: var(--danger-soft); color: var(--danger); border-left-color: var(--danger); }
.alert-info { background: var(--accent-soft); color: var(--accent-strong); border-left-color: var(--accent); }
.alert .alert-text { flex: 1; min-width: 0; }
.alert .alert-actions { display: flex; align-items: center; gap: var(--sp-1); flex: none; flex-wrap: wrap; }
.alert .alert-detail { margin-top: var(--sp-2); font-size: var(--fs-12); opacity: .85; line-height: 1.7; }

/* ---------- Toast ---------- */
.toast-wrap { position: fixed; right: var(--sp-5); bottom: calc(28px + var(--sp-4)); z-index: 90; display: grid; gap: var(--sp-2); justify-items: end; }
.toast {
  display: flex; align-items: center; gap: var(--sp-3); padding: 10px 14px; border-radius: var(--r-panel);
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  box-shadow: var(--shadow-2); font-size: var(--fs-13); max-width: 380px;
  animation: toast-in var(--dur) var(--ease);
}
.toast.ok { border-left-color: var(--ok); }
.toast.error { border-left-color: var(--danger); }
.toast .btn-ghost { flex: none; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

/* ---------- 对话框（遮罩 var(--mask)） ---------- */
.modal-mask {
  position: fixed; inset: 0; z-index: 120; background: var(--mask);
  display: grid; place-items: center; padding: var(--sp-6);
}
.modal {
  width: min(420px, calc(100vw - 48px)); border-radius: var(--r-panel);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-2);
  padding: var(--sp-6); animation: modal-in var(--dur) var(--ease);
}
.modal h3 { font-size: var(--fs-16); font-weight: 600; margin-bottom: var(--sp-3); }
.modal p { font-size: var(--fs-13); color: var(--text-2); line-height: var(--lh-body); }
.modal-foot { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: var(--sp-5); }

/* ---------- Popover ---------- */
.popover {
  position: fixed; z-index: 110; min-width: 220px; max-width: 300px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel);
  box-shadow: var(--shadow-2); padding: var(--sp-3); animation: toast-in var(--dur) var(--ease);
}
.popover .pop-title { font-weight: 600; margin-bottom: var(--sp-2); font-size: var(--fs-13); }
.popover .pop-note { font-size: var(--fs-12); color: var(--muted); line-height: var(--lh-body); margin-bottom: var(--sp-2); }
.popover .kv-grid { display: grid; gap: var(--sp-2); }
.popover .kv { display: flex; justify-content: space-between; gap: var(--sp-2); font-size: var(--fs-13); }
.popover .kv dt { color: var(--muted); }
.popover .kv dd { color: var(--text); font-weight: 500; }
.menu-item {
  display: flex; align-items: center; gap: var(--sp-2); width: 100%; padding: 6px 8px;
  border: 0; background: none; border-radius: var(--r-control); font-size: var(--fs-13);
  color: var(--text-2); cursor: pointer; text-align: left;
}
.menu-item:hover { background: var(--surface-2); color: var(--text); }
.menu-item[aria-checked="true"] { color: var(--accent); font-weight: 600; }
.menu-item .swatch { width: 14px; height: 14px; border-radius: var(--r-control); border: 1px solid var(--line); }

/* ---------- ⌘K 命令面板 ---------- */
.cmdk-mask {
  position: fixed; inset: 0; z-index: 130; background: var(--mask);
  display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh;
}
.cmdk {
  width: min(560px, calc(100vw - 48px)); border-radius: var(--r-panel);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-2);
  overflow: hidden; animation: modal-in var(--dur) var(--ease);
}
.cmdk-input-row { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line); }
.cmdk-input-row .ic { color: var(--muted); }
.cmdk-input { flex: 1; border: 0; background: none; font: inherit; font-size: var(--fs-14); color: var(--text); outline: none; }
.cmdk-input::placeholder { color: var(--muted); }
.cmdk-list { max-height: 320px; overflow-y: auto; padding: var(--sp-2); }
.cmdk-group { padding: var(--sp-2) var(--sp-2) var(--sp-1); font-size: var(--fs-11); font-weight: 600; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.cmdk-item { display: flex; align-items: center; gap: var(--sp-2); padding: 8px 10px; border-radius: var(--r-control); cursor: pointer; color: var(--text-2); font-size: var(--fs-13); }
.cmdk-item .ic { color: var(--muted); }
.cmdk-item.active { background: var(--accent-soft); color: var(--text); }
.cmdk-item.active .ic { color: var(--accent); }
.cmdk-item .cmd-tag { margin-inline-start: auto; font-size: var(--fs-11); color: var(--muted); }
.cmdk-item .kbd { margin-inline-start: auto; }
.cmdk-empty { padding: var(--sp-5); text-align: center; color: var(--muted); font-size: var(--fs-13); }
.kbd {
  display: inline-flex; align-items: center; padding: 1px 6px; border-radius: var(--r-control);
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2);
  font-family: var(--font-mono); font-size: var(--fs-11); font-weight: 500;
}

/* ---------- 步骤 / 检查列表 ---------- */
.steps { display: grid; gap: var(--sp-2); }
.step-line { display: flex; align-items: flex-start; gap: var(--sp-2); color: var(--text-2); font-size: var(--fs-13); line-height: var(--lh-body); }
.step-line::before {
  content: ""; width: 6px; height: 6px; margin-top: 7px; flex: none; border-radius: 50%; background: var(--accent);
}
.check-list { display: grid; gap: var(--sp-2); }
.check-item { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-13); }
.check-item .why { color: var(--muted); font-size: var(--fs-12); margin-inline-start: auto; text-align: right; }
.check-item .ic.ok { color: var(--ok); }
.check-item .ic.bad { color: var(--warn); }
.hint { font-size: var(--fs-12); color: var(--muted); line-height: var(--lh-body); }
.alt-hint { display: flex; align-items: flex-start; gap: var(--sp-2); }

/* ---------- kv 网格 ---------- */
.kv-grid { display: grid; gap: var(--sp-3); grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.kv-grid.two { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.kv dt { font-size: var(--fs-12); color: var(--muted); margin-bottom: 2px; }
.kv dd { font-size: var(--fs-13); color: var(--text); font-weight: 500; }

/* ---------- 搜索框 ---------- */
.search-box { display: inline-flex; align-items: center; gap: var(--sp-2); height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r-control); background: var(--surface-2); min-width: 200px; }
.search-box .ic { color: var(--muted); }
.search-box input { flex: 1; border: 0; background: none; font: inherit; font-size: var(--fs-13); color: var(--text); outline: none; min-width: 0; }
.search-box input::placeholder { color: var(--muted); }

/* ---------- 视图专属 ---------- */
/* 设备中心 Hero */
.device-hero {
  display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-5);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
}
.hero-phone { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 76px; flex: none; color: var(--accent); }
.hero-phone small { font-family: var(--font-mono); font-size: var(--fs-11); color: var(--muted); white-space: nowrap; }
.hero-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hero-id b { font-size: var(--fs-16); font-weight: 600; }
.hero-id span { font-size: var(--fs-12); color: var(--muted); }
.hero-chips { display: flex; gap: var(--sp-2); margin-top: 4px; flex-wrap: wrap; }
.hero-divider { width: 1px; align-self: stretch; background: var(--line); margin: 0 var(--sp-2); }
.hero-media { display: flex; align-items: center; gap: var(--sp-3); margin-inline-start: auto; }
.hero-media b { display: block; font-size: var(--fs-13); }
.hero-media small { font-size: var(--fs-12); color: var(--muted); }
.device-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--sp-3); }
.device-tile { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.device-tile b { display: block; font-size: var(--fs-13); }
.device-tile p { font-size: var(--fs-12); color: var(--muted); margin-top: 1px; }
.tile-ico { width: 36px; height: 36px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); border-radius: var(--r-control); }
/* 工具格 */
.tool-grid-home { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--sp-3); }
.tool-card {
  display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3);
  background: var(--surface-2); border: 1px solid transparent; border-radius: var(--r-card);
  cursor: pointer; text-align: left; transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.tool-card:hover { background: var(--surface-3); border-color: var(--line-strong); }
.tool-card b { display: block; font-size: var(--fs-13); }
.tool-card small { font-size: var(--fs-12); color: var(--muted); }
.tool-ico { width: 36px; height: 36px; display: grid; place-items: center; background: var(--surface); color: var(--text-2); border-radius: var(--r-control); flex: none; }
/* 方案 / 脚本卡片网格 */
.plan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--sp-4); align-items: start; }
.plan-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }
.plan-card h4 { font-size: var(--fs-14); font-weight: 600; display: flex; align-items: center; gap: var(--sp-2); }
.plan-foot { display: flex; align-items: center; gap: var(--sp-2); border-top: 1px solid var(--line); padding-top: var(--sp-3); }
.step-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: var(--sp-2); align-items: center; padding: var(--sp-1) 0; border-bottom: 1px solid var(--line); }
.step-row:last-child { border-bottom: 0; }
/* 缩略图条 */
.thumb-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--sp-3); }
.thumb { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-card); background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; cursor: pointer; overflow: hidden; }
.thumb span { font-size: var(--fs-12); color: var(--muted); font-family: var(--font-mono); }
.thumb .icon-btn { position: absolute; top: 4px; right: 4px; background: var(--surface); }
/* 相册网格 */
.album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--sp-3); }
.album-cell { position: relative; aspect-ratio: 1; border-radius: var(--r-card); background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; cursor: pointer; overflow: hidden; }
.album-cell time { font-size: var(--fs-12); color: var(--muted); font-family: var(--font-mono); }
.album-cell input { position: absolute; top: 6px; left: 6px; accent-color: var(--accent); }
.album-cell:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
/* 拖放区 */
.dropzone {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  width: 100%; padding: var(--sp-8) var(--sp-4); border: 1px dashed var(--line-strong); border-radius: var(--r-card);
  background: var(--surface-2); color: var(--text-2); font-size: var(--fs-13); font-weight: 600; cursor: pointer; text-align: center;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.dropzone:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.dropzone small { font-weight: 400; font-size: var(--fs-12); color: var(--muted); }
/* 通知行 */
.notify-row { display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--line); }
.notify-row:last-child { border-bottom: 0; }
.notify-body { flex: 1; min-width: 0; }
.notify-body b { font-size: var(--fs-13); }
.notify-text { font-size: var(--fs-13); color: var(--text-2); margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.notify-inline { display: flex; gap: var(--sp-2); margin-top: var(--sp-2); flex-wrap: wrap; align-items: center; }
.notify-row time { font-size: var(--fs-12); color: var(--muted); font-family: var(--font-mono); flex: none; }
/* 设置 */
.settings-split { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
.settings-nav { display: flex; flex-direction: column; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: var(--sp-2); }
.settings-nav-item { display: flex; align-items: center; gap: var(--sp-2); padding: 8px 10px; border: 0; background: none; border-radius: var(--r-control); cursor: pointer; text-align: left; color: var(--text-2); }
.settings-nav-item:hover { background: var(--surface-2); }
.settings-nav-item.active { background: var(--accent-soft); color: var(--accent); }
.settings-nav-item .ic { color: var(--muted); }
.settings-nav-item.active .ic { color: var(--accent); }
.settings-nav-text { display: flex; flex-direction: column; }
.settings-nav-text small { font-size: var(--fs-11); color: var(--muted); }
.settings-row { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-3) 0; border-bottom: 1px solid var(--line); }
.settings-row:last-child { border-bottom: 0; }
.settings-row .set-text { flex: 1; min-width: 0; }
.settings-row .set-text b { font-size: var(--fs-13); font-weight: 500; }
.settings-row .set-text small { display: block; font-size: var(--fs-12); color: var(--muted); margin-top: 2px; line-height: var(--lh-body); }
.settings-row .set-ctrl { display: flex; align-items: center; gap: var(--sp-2); flex: none; }
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--sp-3); }
.theme-swatch {
  display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--line);
  border-radius: var(--r-card); background: var(--surface); cursor: pointer; text-align: left; font-size: var(--fs-12); color: var(--text-2);
}
.theme-swatch:hover { border-color: var(--line-strong); }
.theme-swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); color: var(--accent); font-weight: 600; }
.swatch-strip { display: flex; border-radius: var(--r-control); overflow: hidden; height: 24px; }
.swatch-strip i { flex: 1; }
/* 帮助 */
.help-item summary { padding: var(--sp-3) var(--sp-5); cursor: pointer; font-weight: 600; font-size: var(--fs-13); border-bottom: 1px solid var(--line); min-height: 46px; display: flex; align-items: center; list-style: none; }
.help-item summary::-webkit-details-marker { display: none; }
.help-item summary::before { content: ""; width: 6px; height: 6px; margin-right: 10px; border-radius: 50%; background: var(--line-strong); flex: none; }
.help-item[open] summary::before { background: var(--accent); }
.help-item p { padding: 0 var(--sp-5) var(--sp-3); color: var(--text-2); line-height: var(--lh-body); font-size: var(--fs-13); }
/* 镜像状态行 */
.mirror-state { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-14); font-weight: 600; }

/* ---------- 响应式 ---------- */
@media (max-width: 1199px) {
  .ctx { display: none; }
  .settings-split { grid-template-columns: 1fr; }
  .settings-nav { flex-direction: row; flex-wrap: wrap; }
  .settings-nav-item { flex: 0 1 auto; }
}
@media (max-width: 999px) {
  .tb-search { display: none; }
  .hero-divider { display: none; }
  .hero-media { display: none; }
  .brand { font-size: var(--fs-14); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

function normalizePhysicalKeyEvent(e) {
  var code = e.code;
  if (!code) return null;

  var found = null;
  for (var i = 0; i < INJECTABLE_KEYCODES.length; i++) if (INJECTABLE_KEYCODES[i].value === kc) found = INJECTABLE_KEYCODES[i];

function isValidCoord(v) { return Number.isInteger(v) && v >= 0 && v <= 9999; }

  var wait = s.waitMs > 0 ? "，前等 " + s.waitMs + "ms" : "";

function emptyState(iconId, title, desc, cta) {
  var ctaHtml = "";
  if (cta) {
    ctaHtml = '<button class="btn ' + (cta.primary === false ? "btn-secondary" : "btn-primary") + '" data-act="' + cta.act + '"' +
      (cta.view ? ' data-view="' + cta.view + '"' : "") + (cta.disabled ? " disabled" : "") +
      (cta.title ? ' title="' + esc(cta.title) + '"' : "") + ">" + esc(cta.label) + "</button>";
  }
  return '<div class="empty">' +
    '<span class="empty-icon">' + ico(iconId, "lg") + "</span>" +
    "<h3>" + esc(title) + "</h3>" +
    (desc ? "<p>" + desc + "</p>" : "") +
    ctaHtml + "</div>";
}
function alertBox(kind, iconId, text, actions, detail) {
  var btns = "";
  (actions || []).forEach(function (a) {
    btns += '<button class="btn btn-sm ' + (a.style || "btn-secondary") + '" data-act="' + a.act + '"' +
      (a.view ? ' data-view="' + a.view + '"' : "") + (a.arg ? ' data-arg="' + esc(a.arg) + '"' : "") + ">" + esc(a.label) + "</button>";
  });
  return '<div class="alert alert-' + kind + '" role="' + (kind === "info" ? "status" : "alert") + '">' + ico(iconId) +
    '<div class="alert-text">' + text + (detail ? '<div class="alert-detail" hidden data-detail>' + detail + "</div>" : "") + "</div>" +
    '<div class="alert-actions">' + btns + "</div></div>";
}
/* home 状态栈（App.tsx 5077-5138）：check.diagnostic / launchError / sessionError /
   statusMessage / 可关闭的 revoke·hostIm·reconnect 通知 / 伴侣崩溃卡 / 🔒·熄屏提示 */
function statusStack() {
  if (!state.demo) return "";
  var html = '<div class="status-stack" style="display:grid;gap:6px">';
  var plain = state.homeNotices.filter(function (n) { return !n.dismiss; });
  plain.forEach(function (n) { html += '<p class="hint">' + esc(n.text) + "</p>"; });
  var dismissible = state.homeNotices.filter(function (n) { return n.dismiss && !n.crash; });
  dismissible.forEach(function (n) {
    html += '<div class="alert alert-info" role="status">' + ico("i-info") +
      '<div class="alert-text">' + esc(n.text) + "</div>" +
      '<div class="alert-actions"><button class="icon-btn" data-act="notice-dismiss" data-arg="' + n.id + '" aria-label="关闭这条通知" title="关闭">' + ico("i-x") + "</button></div></div>";
  });
  var crash = state.homeNotices.filter(function (n) { return n.crash; })[0];
  if (crash) {
    html += '<div class="alert alert-warn" role="status">' + ico("i-alert") + "<div class='alert-text'>" + esc(crash.text) +
      (state.crashExpanded ? '<pre class="alert-detail" style="white-space:pre-wrap;font-family:var(--font-mono);max-height:180px;overflow:auto">' + esc(crash.detail) + "</pre>" : "") +
      '</div><div class="alert-actions">' +
      '<button class="btn-ghost" data-act="crash-toggle">' + (state.crashExpanded ? "收起详情" : "查看详情") + "</button>" +
      '<button class="icon-btn" data-act="notice-dismiss" data-arg="crash" aria-label="关闭崩溃记录" title="知道了">' + ico("i-x") + "</button></div></div>";
  }
  if (state.mirrorOn) {
    html += '<p class="hint" role="status">' + esc(REAL_NOTICES.pinPad) + "</p>";
    html += '<p class="hint" role="status">' + esc(REAL_NOTICES.screenOff) + "</p>";
  }
  html += "</div>";
  return html;
}

  }
  function finder(fx, fy) {
    return '<rect x="' + fx + '" y="' + fy + '" width="7" height="7" fill="currentColor"/>' +
      '<rect x="' + (fx + 1) + '" y="' + (fy + 1) + '" width="5" height="5" fill="var(--surface)"/>' +
      '<rect x="' + (fx + 2) + '" y="' + (fy + 2) + '" width="3" height="3" fill="currentColor"/>';
  }
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + n + " " + n + '" style="color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)" aria-label="配对二维码（预览占位）">' +

}

function vShot() {
  /* 最近截图（App.tsx 4361-4394）：单张最近截图 + 大小 badge + 完整保存路径 + × 立即删除（无二次确认）；
     卡脚常驻：立即截图(primary，无设备则去连接) + 在文件夹中显示(无截图禁用)。 */
  function fmtBytes(n) {
    if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
    if (n >= 1024) return (n / 1024).toFixed(1) + " KB";
    return n + " B";
  }
  var body;
  if (state.shot) {
    body = '<div class="card-head">最近截图 <span class="badge neutral">' + esc(fmtBytes(state.shot.bytes)) + "</span></div>" +
      '<div class="card-body"><div class="thumb-strip">' +
      '<div class="thumb" title="' + esc(state.shot.path) + '"><span>' + esc(state.shot.file_name) + "</span>" +
      '<button class="icon-btn" data-act="shot-del" aria-label="删除这张截图" title="立即删除本机文件"' + (state.screenshotBusy ? " disabled" : "") + ">×</button></div>" +
      "</div>" +
      '<p class="hint mono" style="margin-top:10px;word-break:break-all">' + esc(state.shot.path) + "</p></div>";
  } else {
    body = '<div class="empty hint"><p style="max-width:none">本机还没有新截图；点「立即截图」获取第一张。</p></div>';
  }
  body = '<div class="card">' + body +
    '<div class="card-foot"><button class="btn btn-primary" data-act="shot-now"' + (state.screenshotBusy ? " disabled" : "") + (state.demo ? "" : ' title="未连接设备：点击后前往连接页"') + ">立即截图</button>" +
    '<button class="btn btn-secondary" data-act="shot-reveal"' + (state.shot ? "" : " disabled") + ">在文件夹中显示</button></div></div>";
  body += '<p class="hint">截图默认保存到本机 MirrorDock 目录；受保护页面会截成黑屏。</p>';
  return body;
}

function vHelp() {

/* ============================================================
   Toast / Modal
   ============================================================ */
function showToast(text, opts) {
  opts = opts || {};
  var wrap = $("#toast-wrap");
  while (wrap.children.length >= 3) wrap.removeChild(wrap.firstChild);
  var t = document.createElement("div");
  t.className = "toast " + (opts.type || "");
  t.innerHTML = '<span>' + esc(text) + '</span>';
  if (opts.action) {
    var b = document.createElement("button");
    b.className = "btn-ghost";
    b.textContent = opts.action.label;
    b.onclick = function () { hideToast(t); runAct(opts.action.act); };
    t.appendChild(b);
  }
  wrap.appendChild(t);
  setTimeout(function () { hideToast(t); }, opts.duration || 3600);
}
function hideToast(t) { if (t && t.parentNode) t.parentNode.removeChild(t); }
var modalState = null;
function openModal(cfg) {

}

  else if (id === "file-del") {
    /* 删除回执照抄 App.tsx 3028：只删手机上这一个文件 */
    var fn = modalState.arg;
    state.deviceFiles = state.deviceFiles.filter(function (f) { return f.name !== fn; });
    state.transferMessage = "已从手机删除「" + fn + "」。";
    render();
  }
  else if (id === "uninstall-app") {
    var pkg = modalState.arg;
    var a = state.apps.filter(function (x) { return x.pkg === pkg; })[0];
    if (a) {
      state.apps = state.apps.filter(function (x) { return x.pkg !== pkg; });
      state.appsNotice = { text: "已卸载 " + (a.name || a.pkg) + "。", error: false };
      render();

    state.proActive = false;
    state.licenseMessage = "已撤销本机的专业版授权。录制功能回到免费版状态。";

function armDanger(btn, confirmText, fn) {
  if (btn.dataset.armed === "1") { btn.dataset.armed = ""; fn(); return; }
  btn.dataset.armed = "1";
  btn.dataset.oldHtml = btn.innerHTML;
  btn.dataset.oldClass = btn.className;
  btn.textContent = confirmText;
  btn.className = btn.className.replace("btn-ghost", "btn-danger-solid").replace("btn-secondary", "btn-danger-solid");
  setTimeout(function () {
    if (btn.isConnected && btn.dataset.armed === "1") { btn.dataset.armed = ""; btn.innerHTML = btn.dataset.oldHtml; btn.className = btn.dataset.oldClass; }

function openCmdk() {

}
function closeCmdk() { $("#cmdk-mask").hidden = true; }
function buildCmdkList(q) {
  q = q.trim().toLowerCase();
  var all = cmdkCommands();
  var recents = state.recentCmds.slice(0, 3).map(function (id) { return all.filter(function (c) { return c.id === id; })[0]; }).filter(Boolean);
  var matched = all.filter(function (c) { return !q || (c.title + " " + c.kw).toLowerCase().indexOf(q) !== -1; });
  var items = q ? matched : recents.concat(matched.filter(function (c) { return recents.indexOf(c) === -1; }));
  state._cmdkItems = items;
  state.cmdkIndex = 0;
  var list = $("#cmdk-list");
  if (!items.length) { list.innerHTML = '<div class="cmdk-empty">没有匹配的命令</div>'; return; }
  var html = "", lastGroup = null;
  items.forEach(function (c, i) {
    if (c.group !== lastGroup) { html += '<div class="cmdk-group">' + c.group + "</div>"; lastGroup = c.group; }
    html += '<div class="cmdk-item' + (i === 0 ? " active" : "") + '" id="cmdk-opt-' + i + '" role="option" aria-selected="' + (i === 0) + '" data-cmd-index="' + i + '">' +
      ico(c.icon) + "<span>" + esc(c.title) + "</span>" +
      (c.kbd ? '<span class="kbd">' + c.kbd + "</span>" : "") +
      '<span class="cmd-tag">' + c.tag + "</span></div>";
  });
  list.innerHTML = html;
  $("#cmdk-input").setAttribute("aria-activedescendant", "cmdk-opt-0");
}
function cmdkMove(delta) {
  var items = state._cmdkItems || [];
  if (!items.length) return;
  state.cmdkIndex = (state.cmdkIndex + delta + items.length) % items.length;
  $$(".cmdk-item").forEach(function (el, i) {
    el.classList.toggle("active", i === state.cmdkIndex);
    el.setAttribute("aria-selected", String(i === state.cmdkIndex));
  });
  var active = $("#cmdk-opt-" + state.cmdkIndex);
  if (active) { $("#cmdk-input").setAttribute("aria-activedescendant", active.id); active.scrollIntoView({ block: "nearest" }); }
}
function cmdkRun(index) {
  var items = state._cmdkItems || [];

  if (!c) return;
  closeCmdk();
  state.recentCmds = [c.id].concat(state.recentCmds.filter(function (x) { return x !== c.id; })).slice(0, 3);
  c.run();
}

    case "file-fetch": {

      var bi = 0;
      var installNext = function () {
        if (state._installCancel || bi >= targets.length) {

      state.settings = { autoStart: state.settings.autoStart, hideDock: state.settings.hideDock, autoReconnect: state.settings.autoReconnect, cameraSource: false, fullscreen: false, alwaysOnTop: false, keepAwake: true, record: false, clipboardSync: true, keyboardUh: true, audio: false, showTouches: false, readOnly: false, desktopMode: false };
      state.recordingDir = null; state.applyNotice = null;

    case "shortcuts-reset":
      state.shortcuts = { screenshot: "CommandOrControl+Alt+S", record: "CommandOrControl+Alt+R", rotate: "CommandOrControl+Alt+D" };
      render(); break;
    case "mirror-apply":
      state.applyingOptions = true; render();
      setTimeout(function () {
        state.applyingOptions = false;

        render();
      }, 700);
      break;
    case "mirror-target": render(); break;
    case "desktop-target": state.settingsDesktopKey = arg; render(); break;
    case "recording-dir-pick":
      state.recordingDir = "C:\\Users\\me\\Videos\\MirrorDock"; render(); showToast("已选择录像保存文件夹（演示）", { type: "ok" }); break;
    case "recording-dir-reset":

    case "update-check":

        state.updateState = "updating"; render();
        setTimeout(function () {
          state.updateState = "idle";
          state.updateMessage = "当前已是最新版本（演示）。";
          render();
        }, 800);
      }, 700);
      break;

    /* ---- 帮助诊断包（App.tsx 6286-6315：busy 三态 + 预览事件列表） ---- */
    case "diag-help":
      state.diagnosticsBusy = true; render();
      setTimeout(function () {
        state.diagnosticsBusy = false;
        state.diagnostics = {
          summary: "v0.4.8（测试版） · Windows 11 · 23H2 · 镜像引擎可用 · 3 条最近事件",

    case "diag-help-export":
      showToast("诊断包已导出到本机（演示）", { type: "ok" }); break;
    case "help-toggle": {
      var items = $$(".help-item"), anyClosed = items.some(function (d) { return !d.open; });
      items.forEach(function (d) { d.open = anyClosed; });
      if (btn) btn.textContent = anyClosed ? "收起全部" : "展开全部";

    case "pro-activate": {
      /* 激活回执照抄 App.tsx 1813-1827：激活中… busy +「专业版已激活：MP4 录制现已可用。授权保存在本机。」
         失败回执（App.tsx 1823）：「激活失败，请检查许可证后重试。」 */
      var pErr = "激活失败，请检查许可证后重试。";
      if (!state.proInput.trim()) { state.licenseError = pErr; render(); break; }
      state.licenseBusy = true; state.licenseMessage = null; state.licenseError = null; render();
      setTimeout(function () {
        state.licenseBusy = false;
        if (state.demo && !/^MD1-/.test(state.proInput.trim())) {
          state.licenseError = pErr;
        } else {
          state.proActive = true;
          state.proInput = "";
          state.licenseMessage = "专业版已激活：MP4 录制现已可用。授权保存在本机。";

      break;
    }
    case "revoke": openModal({ id: "revoke", title: "撤销本机授权？", body: "<p>撤销后本机回到免费版，激活码仍可用于再次激活。</p>", okLabel: "撤销授权", danger: true }); break;
    case "ctx-open": {
      var c = ctxContent(state.view);
      showPopover(btn, c || '<div class="pop-note">本视图没有上下文信息。</div>');

}

/* ============================================================
   事件绑定
   ============================================================ */
document.addEventListener("click", function (e) {
  var t = e.target;
  var actEl = t.closest("[data-act]");
  var pop = $("#popover");
  if (!pop.hidden && !pop.contains(t) && !(actEl && (actEl.dataset.act === "pill" || actEl.dataset.act === "theme-menu" || actEl.dataset.act === "ctx-open"))) hidePopover();
  /* 测试面板：点任意位置获得焦点（App.tsx 4083 assistant-capture-zone tabIndex） */
  var zone = t.closest && t.closest("#km-test-zone");
  if (zone && document.activeElement !== zone) zone.focus();
  if (!actEl) return;
  var act = actEl.dataset.act, arg = actEl.dataset.arg || actEl.dataset.view || "";
  if (act === "modal-cancel" || act === "modal-ok") { runAct(act); return; }
  runAct(act, arg, actEl);
});
/* 捕获映射用的物理键：全局捕获阶段监听，拿到第一个可识别的键位就停（App.tsx 2715-2727） */
document.addEventListener("keydown", function (e) {
  if (!state.kmCapturing || !$("#cmdk-mask").hidden) return;
  var physicalKey = normalizePhysicalKeyEvent(e);
  if (!physicalKey) return;
  e.preventDefault();
  e.stopPropagation();
  state.kmCaptured = { physicalKey: physicalKey, label: physicalKeyLabel(physicalKey) };
  state.kmCapturing = false;
  render();
}, true);
/* 备注编辑：Enter 保存 / Esc 取消（App.tsx 5200-5208） */
document.addEventListener("keydown", function (e) {
  if (e.target && e.target.id === "home-nick") {
    if (e.key === "Enter") { e.preventDefault(); runAct("nick-save"); }
    else if (e.key === "Escape") { e.preventDefault(); state.nickEditing = false; render(); }
    return;
  }
  /* 测试面板 keydown：映射注入反馈（App.tsx 2703-2713） */
  if (e.target && e.target.id === "km-test-zone" && $("#cmdk-mask").hidden && $("#modal-mask").hidden) {
    var physicalKey = normalizePhysicalKeyEvent(e);
    if (!physicalKey) return;
    e.preventDefault();
    var prof = activeKeymapProfile();
    var binding = prof ? prof.bindings.filter(function (b) { return b.physicalKey === physicalKey; })[0] : null;
    if (!binding) {
      state.kmLast = physicalKeyLabel(physicalKey) + "：未映射，没有发送。";
    } else {
      state.kmLast = binding.label + " → " + describeAction(binding.action) + "：已发送。";
    }
    render();
    var z2 = $("#km-test-zone");
    if (z2) z2.focus();
    return;
  }
});
document.addEventListener("input", function (e) {
  var t = e.target;
  /* 表单字段 → state（connect 三字段 / 按键映射坐标与时长 / 回放等待 / 快捷键 / 通知回复草稿 / 许可证输入） */
  if (t.dataset && t.dataset.field) {
    var path = t.dataset.field.split(".");
    if (path.length === 1) {
      state[path[0]] = t.dataset.numeric ? t.value.replace(/\D/g, "").slice(0, 6) : t.value;
    } else {
      state[path[0]][path[1]] = t.value;
    }
    /* 许可证输入：空输入禁用「激活」按钮（App.tsx 4717），不重渲染以保持焦点 */
    if (t.dataset.field === "proInput") {
      $$('[data-act="pro-activate"]').forEach(function (b) { b.disabled = state.licenseBusy || !state.proInput.trim(); });
    }
    return;
  }
  if (t.dataset.filter === "apps") {
    state.appsQuery = t.value;
    var q = t.value.toLowerCase();
    $$("#content tbody tr").forEach(function (row) { if (!row.dataset.rowStatic) row.hidden = !!q && !row.textContent.toLowerCase().includes(q); });
  } else if (t.dataset.filter === "help") {
    state._helpQuery = t.value;
    var cur = t.selectionStart;
    render();
    var next = $('[data-filter="help"]');
    if (next) { next.focus(); next.setSelectionRange(cur, cur); }
  }
});
/* 快捷键输入：失焦后重渲染以刷新「格式无效」alert（App.tsx 6187-6189） */
document.addEventListener("change", function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.field && t.dataset.field.indexOf("shortcuts.") === 0) { render(); return; }
  if (t.matches("select") && t.dataset.act) { runAct(t.dataset.act, t.value, t); return; }
});
/* 快捷回复：回车发送（isComposing 守卫，App.tsx 4644-4648） */
document.addEventListener("keydown", function (e) {
  var t = e.target;
  if (t && t.dataset && t.dataset.notifyReply !== undefined && e.key === "Enter" && !e.isComposing && !e.nativeEvent?.isComposing) {
    e.preventDefault();
    runAct("notify-reply", t.dataset.notifyReply);
  }
});
var DIGIT_VIEWS = ["home", "connect", "info", "multi", "mirror", "present", "keymap", "schedule", "replay"];
function trapFocus(container, e) {
  var focusables = container.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (!focusables.length) return;
  var first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
document.addEventListener("keydown", function (e) {
  var modalOpen = !$("#modal-mask").hidden;
  var cmdkOpen = !$("#cmdk-mask").hidden;
  if (e.key === "Escape") {
    if (modalOpen) { closeModal(); e.preventDefault(); }
    else if (cmdkOpen) { closeCmdk(); e.preventDefault(); }
    else if (!$("#popover").hidden) { hidePopover(); e.preventDefault(); }
    return;
  }
  if (cmdkOpen) {
    if (e.key === "ArrowDown") { e.preventDefault(); cmdkMove(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); cmdkMove(-1); }
    else if (e.key === "Enter") { e.preventDefault(); cmdkRun(state.cmdkIndex); }
    else if (e.key === "Tab") { trapFocus($("#cmdk"), e); }
    return;
  }
  if (modalOpen) { if (e.key === "Tab") trapFocus($("#modal"), e); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmdk(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "b") { e.preventDefault(); toggleSide(); return; }
  if (!e.metaKey && !e.ctrlKey && !e.altKey && /^[1-9]$/.test(e.key)) {
    var tag = document.activeElement ? document.activeElement.tagName : "";
    if (tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA") switchView(DIGIT_VIEWS[Number(e.key) - 1]);
  }
});
$("#cmdk-input").addEventListener("input", function (e) { buildCmdkList(e.target.value); });
$("#cmdk-list").addEventListener("click", function (e) { var item = e.target.closest(".cmdk-item"); if (item) cmdkRun(Number(item.dataset.cmdIndex)); });
$("#cmdk-list").addEventListener("mousemove", function (e) { var item = e.target.closest(".cmdk-item"); if (item && Number(item.dataset.cmdIndex) !== state.cmdkIndex) cmdkMove(Number(item.dataset.cmdIndex) - state.cmdkIndex); });
$("#modal-mask").addEventListener("mousedown", function (e) { if (e.target === this) closeModal(); });
$("#cmdk-mask").addEventListener("mousedown", function (e) { if (e.target === this) closeCmdk(); });
window.addEventListener("resize", function () { render(); });

/* ============================================================
   初始化
   ============================================================ */
(function init() {
  var saved = null;
  try { saved = localStorage.getItem("md-theme"); } catch (e) {}
  applyTheme(saved || "mist", true);
  render();
})();
