<!DOCTYPE html>
<html lang="zh-CN" data-theme="soft">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MirrorDock · UI 重设计预览（安静的诊断台）</title>
<style>
/* ============================================================
   MirrorDock UI Redesign Preview · Phase 3
   设计方向：安静的诊断台（Quiet Instrument）
   规则：全局样式只引用 token 变量；例外仅 E 主题签名光斑与两处规范指定的遮罩
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
:root {
  /* 共享基座 · Phase 1 §3.1 */
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
             "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --fs-11: 11px; --fs-12: 12px; --fs-13: 13px; --fs-14: 14px;
  --fs-16: 16px; --fs-20: 20px; --fs-28: 28px;
  --lh-tight: 1.3; --lh-ui: 1.45; --lh-body: 1.6;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --radius-shift: 0px;
  --r-xs: calc(4px + var(--radius-shift));
  --r-sm: calc(7px + var(--radius-shift));
  --r-md: calc(9px + var(--radius-shift));
  --r-lg: calc(12px + var(--radius-shift));
  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur-fast: .12s; --dur: .18s;
  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
}
html[data-theme="soft"] {
  color-scheme: light;
  --bg: #f6f7fb; --surface: #ffffff; --surface-2: #f2f4f8; --surface-3: #f8f9fc;
  --text: #1b222b; --text-2: #49525f; --muted: #8a93a2;
  --line: rgba(31,45,80,.08); --line-strong: rgba(31,45,80,.15);
  --accent: #4a7cf3; --accent-strong: #3b66da; --accent-soft: #eaf0fe; --on-accent: #ffffff;
  --ok: #21935d; --ok-soft: #e3f4eb; --warn: #b57416; --warn-soft: #fcf1e0;
  --danger: #d24d4d; --danger-soft: #fbe9e9;
  --shadow-1: 0 1px 2px rgba(23,32,48,.04), 0 6px 20px -12px rgba(23,32,48,.10);
  --shadow-2: 0 2px 8px rgba(23,32,48,.05), 0 20px 48px -20px rgba(23,32,48,.18);
  --radius-shift: 0px;
  --titlebar-bg: linear-gradient(180deg, #fbfcff, #f4f6fc); --titlebar-text: var(--text);
  --mask: rgba(12,16,24,.45);
}
html[data-theme="midnight"] {
  color-scheme: dark;
  --bg: #101216; --surface: #171a1f; --surface-2: #1e222a; --surface-3: #13161b;
  --text: #e9ecf1; --text-2: #a6aeb9; --muted: #6e7683;
  --line: #232832; --line-strong: #303744;
  --accent: #4f8bff; --accent-strong: #7aa6ff; --accent-soft: rgba(79,139,255,.14); --on-accent: #0b1220;
  --ok: #3ecf8e; --ok-soft: rgba(62,207,142,.14);
  --warn: #f0a63c; --warn-soft: rgba(240,166,60,.14);
  --danger: #ff6b6b; --danger-soft: rgba(255,107,107,.13);
  --shadow-1: 0 1px 2px rgba(0,0,0,.35), 0 6px 20px -12px rgba(0,0,0,.4);
  --shadow-2: 0 2px 8px rgba(0,0,0,.35), 0 20px 48px -20px rgba(0,0,0,.6);
  --radius-shift: 0px;
  --titlebar-bg: var(--surface); --titlebar-text: var(--text);
  --mask: rgba(0,0,0,.55);
}
html[data-theme="prism"] {
  color-scheme: light;
  --bg: #f4f5f9; --surface: #ffffff; --surface-2: #f0f2f7; --surface-3: #fafafc;
  --text: #1d1f2b; --text-2: #4b4f63; --muted: #8a8ea0;
  --line: #e4e6ef; --line-strong: #d3d6e3;
  --accent: #7a5cf0; --accent-strong: #6448d8; --accent-soft: #eeeafc; --on-accent: #ffffff;
  --ok: #1f9366; --ok-soft: #e0f4ec; --warn: #b26a0f; --warn-soft: #fcf1df;
  --danger: #cc3d54; --danger-soft: #fbe8ec;
  --cat-blue: #4783ea; --cat-teal: #12a294; --cat-violet: #7a5cf0;
  --cat-pink: #df5a8e; --cat-amber: #d08a1e; --cat-green: #34a55e;
  --cat-blue-soft: #e3ecfd; --cat-teal-soft: #dbf2f0; --cat-violet-soft: #ece8fd;
  --cat-pink-soft: #fbe6ee; --cat-amber-soft: #faf0d9; --cat-green-soft: #def1e6;
  --shadow-1: 0 1px 2px rgba(29,31,43,.05), 0 6px 20px -12px rgba(29,31,43,.11);
  --shadow-2: 0 2px 8px rgba(29,31,43,.06), 0 20px 48px -20px rgba(29,31,43,.19);
  --radius-shift: 0px;
  --titlebar-bg: var(--surface); --titlebar-text: var(--text);
  --mask: rgba(12,16,24,.45);
}
html[data-theme="paper"] {
  color-scheme: light;
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f7f7f8; --surface-3: #fafafa;
  --text: #17181a; --text-2: #45474c; --muted: #7c8087;
  --line: #ebebee; --line-strong: #dcdee1;
  --accent: #17181a; --accent-strong: #000000; --accent-soft: #f1f1f3; --on-accent: #ffffff;
  --ok: #1f7a46; --ok-soft: #eaf4ee; --warn: #9a6206; --warn-soft: #faf3e3;
  --danger: #c23b3b; --danger-soft: #faebeb;
  --shadow-1: none;
  --shadow-2: 0 4px 16px rgba(23,24,26,.1);
  --radius-shift: 0px;
  --titlebar-bg: var(--surface); --titlebar-text: var(--text);
  --mask: rgba(12,16,24,.4);
}
html[data-theme="aurora"] {
  color-scheme: light;
  --bg: #e9eef8; --surface: rgba(255,255,255,.78); --surface-2: rgba(255,255,255,.55); --surface-3: rgba(255,255,255,.42);
  --text: #1a2438; --text-2: #47536d; --muted: #6b7794;
  --line: rgba(20,32,60,.12); --line-strong: rgba(20,32,60,.2);
  --accent: #4f74e8; --accent-strong: #2c4ab8; --accent-soft: rgba(79,116,232,.13); --on-accent: #ffffff;
  --ok: #1d8a54; --ok-soft: rgba(29,138,84,.13);
  --warn: #b06a10; --warn-soft: rgba(176,106,16,.13);
  --danger: #cd3d3d; --danger-soft: rgba(205,61,61,.12);
  --shadow-1: 0 1px 3px rgba(25,40,80,.1);
  --shadow-2: 0 12px 36px rgba(25,40,80,.18);
  --radius-shift: 0px;
  --titlebar-bg: var(--surface); --titlebar-text: var(--text);
  --mask: rgba(12,16,24,.45);
}
/* E 主题签名光斑（唯一允许的硬编码背景，Phase 1 §3.2） */
html[data-theme="aurora"] body::before {
  position: fixed; inset: 0; z-index: -1; content: "";
  background:
    radial-gradient(1100px 500px at 12% -8%, rgba(93,140,255,.28), transparent 60%),
    linear-gradient(160deg, #eef2fb, #dfe6f3);
}
/* E 主题毛玻璃只给两个悬浮层：标题栏 + 弹层 */
html[data-theme="aurora"] .titlebar,
html[data-theme="aurora"] .modal,
html[data-theme="aurora"] .cmdk,
html[data-theme="aurora"] .popover {
  backdrop-filter: blur(14px) saturate(1.3);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
}

html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-ui); font-size: var(--fs-13); color: var(--text);
  background: var(--bg); line-height: var(--lh-ui);
  font-synthesis: none; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
h1, h2, h3, h4, p, dl, dd, figure { margin: 0; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.mono { font-family: var(--font-mono); font-size: var(--fs-13); }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- 焦点与跳过链接（UX §5.1） ---------- */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: inherit; }
:focus:not(:focus-visible) { outline: none; }
.skip {
  position: fixed; left: var(--sp-3); top: -48px; z-index: 300;
  padding: 6px 14px; border-radius: var(--r-sm); background: var(--accent); color: var(--on-accent);
  font-size: var(--fs-13); font-weight: 600; text-decoration: none; transition: top var(--dur-fast) var(--ease);
}
.skip:focus-visible { top: var(--sp-2); }

/* ============================================================
   外壳 · Phase 1 §4.1：44 titlebar / 232(56) sidebar / 56 vh / 28 statusbar
   ============================================================ */
.app {
  --side-w: 232px;
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr);
  grid-template-rows: 44px minmax(0, 1fr) 28px;
  grid-template-areas: "title title" "side main" "foot foot";
  height: 100vh;
}
.app.side-alt { --side-w: 56px; }

/* ---------- Titlebar 44px ---------- */
.titlebar {
  grid-area: title; display: flex; align-items: center; gap: var(--sp-3);
  padding: 0 var(--sp-3) 0 var(--sp-4);
  background: var(--titlebar-bg); color: var(--titlebar-text);
  border-bottom: 1px solid var(--line);
  position: relative; z-index: 50; white-space: nowrap;
}
.brand { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-16); font-weight: 700; }
.brand-mark {
  width: 24px; height: 24px; border-radius: var(--r-sm); display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent); font-size: var(--fs-13); font-weight: 800;
}
.tb-search {
  flex: 0 1 340px; margin-inline: auto; display: flex; align-items: center; gap: var(--sp-2);
  height: 30px; padding: 0 var(--sp-3); min-width: 160px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2);
  color: var(--muted); font-size: var(--fs-13); cursor: pointer; text-align: left;
}
.tb-search:hover { border-color: var(--line-strong); background: var(--surface); }
.tb-search .kbd { margin-inline-start: auto; }
.tb-right { display: flex; align-items: center; gap: var(--sp-2); margin-inline-start: auto; }
.pill {
  display: inline-flex; align-items: center; gap: var(--sp-2); height: 30px; padding: 0 var(--sp-3);
  border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface);
  font-size: var(--fs-12); color: var(--text-2); cursor: pointer; max-width: 180px;
}
.pill:hover { background: var(--surface-2); }
.pill span { overflow: hidden; text-overflow: ellipsis; }
.tb-hamburger { display: none; }

/* ---------- Sidebar 232px / 56px ---------- */
.sidebar {
  grid-area: side; display: flex; flex-direction: column; min-width: 0;
  background: var(--surface); border-right: 1px solid var(--line);
  overflow-y: auto; overscroll-behavior: contain; position: relative;
}
.side-scroll { flex: 1; padding: var(--sp-2) var(--sp-2) var(--sp-3); }
.nav-top { display: flex; padding: var(--sp-1); }
.nav-group-title {
  margin: var(--sp-4) var(--sp-1) var(--sp-1); padding: 0 var(--sp-2);
  font-size: var(--fs-11); font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  color: var(--muted);
}
.nav-item {
  display: flex; align-items: center; gap: var(--sp-2); width: 100%;
  height: 34px; padding: 0 var(--sp-3); margin: 1px 0;
  border: 0; border-radius: 999px; background: transparent; text-align: left;
  color: var(--text-2); font-size: var(--fs-13); font-weight: 500; cursor: pointer;
  position: relative;
}
.nav-item .ic { color: var(--muted); flex: none; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item[aria-current="page"] .ic { color: var(--accent); }
.nav-badge { margin-inline-start: auto; }
.nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-foot {
  border-top: 1px solid var(--line); padding: var(--sp-2); display: flex; align-items: center; gap: var(--sp-2);
}
.side-foot .hint-line { font-size: var(--fs-12); color: var(--muted); }
/* 折叠态 56px */
.app.side-alt .nav-label, .app.side-alt .nav-group-title, .app.side-alt .side-foot .hint-line { display: none; }
.app.side-alt .nav-item { justify-content: center; padding: 0; }
.app.side-alt .nav-item[aria-current="page"]::before { left: 4px; }
.app.side-alt .nav-group-title { height: 1px; margin: var(--sp-2) var(--sp-2) 0; padding: 0; background: var(--line); }
.app.side-alt .nav-badge { display: none; }

/* ---------- Workspace：ws-main + Context Panel ---------- */
.workspace { grid-area: main; display: flex; min-width: 0; min-height: 0; }
.ws-main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; }
.vh {
  position: sticky; top: 0; z-index: 20; min-height: 56px;
  display: flex; align-items: center; gap: var(--sp-3); flex-wrap: nowrap;
  padding: var(--sp-2) var(--sp-6); background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.vh-title { font-size: var(--fs-16); font-weight: 600; line-height: var(--lh-tight); }
.vh-sub { font-size: var(--fs-12); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vh-head-text { min-width: 0; }
.vh-actions { margin-inline-start: auto; display: flex; align-items: center; gap: var(--sp-2); flex: none; }
.demo-sw {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  font-size: var(--fs-12); color: var(--muted); cursor: pointer;
  padding: var(--sp-1) var(--sp-2); border: 1px dashed var(--line-strong); border-radius: var(--r-sm);
}
.content { max-width: 1080px; width: 100%; padding: var(--sp-6); display: grid; gap: var(--sp-4); align-content: start; }

/* ---------- Statusbar 28px ---------- */
.statusbar {
  grid-area: foot; display: flex; align-items: center; gap: var(--sp-4);
  padding: 0 var(--sp-4); background: var(--surface-2); border-top: 1px solid var(--line);
  font-size: var(--fs-12); color: var(--muted); white-space: nowrap; overflow: hidden;
}
.statusbar .spacer { margin-inline-start: auto; }
.statusbar b { color: var(--text-2); font-weight: 600; }
.sb-privacy { display: inline-flex; align-items: center; gap: var(--sp-1); }

/* ============================================================
   组件库 · Phase 1 §5
   ============================================================ */
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.lg { width: 28px; height: 28px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 14px; border-radius: var(--r-sm);
  font-size: var(--fs-13); font-weight: 600; border: 1px solid transparent; cursor: pointer;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.btn:focus-visible { box-shadow: var(--focus-ring); outline: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent));
  color: var(--on-accent);
  box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 5px 14px -7px color-mix(in srgb, var(--accent) 55%, transparent);
}
.btn-primary:hover:not(:disabled) {
  background: linear-gradient(180deg, var(--accent), var(--accent-strong));
  box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 7px 18px -7px color-mix(in srgb, var(--accent) 62%, transparent);
}
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--line-strong); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-2); }
.btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: var(--danger-soft); }
.btn-danger-solid { background: var(--danger); color: #fff; }
.btn-danger-solid:hover:not(:disabled) { background: var(--danger); filter: brightness(.92); }
.btn-ghost { height: auto; min-height: 24px; padding: 4px 8px; background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; border-radius: var(--r-xs); }
.btn-ghost:hover:not(:disabled) { background: var(--accent-soft); }
.btn-ghost.danger { color: var(--danger); }
.btn-ghost.danger:hover { background: var(--danger-soft); }
.btn-sm { height: 26px; padding: 0 10px; font-size: var(--fs-12); }
.btn.is-loading { position: relative; color: transparent !important; pointer-events: none; }
.btn.is-loading::before {
  content: ""; position: absolute; left: 12px; top: 50%; width: 14px; height: 14px; margin-top: -7px;
  border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%;
  animation: spin .8s linear infinite;
}
.btn.is-loading.btn-primary::before { border-color: color-mix(in srgb, var(--on-accent) 40%, transparent); border-top-color: var(--on-accent); }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn {
  width: 28px; height: 28px; display: inline-grid; place-items: center;
  border: 0; background: transparent; border-radius: var(--r-xs); color: var(--muted); cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.danger { color: var(--danger); }
.icon-btn.danger:hover { background: var(--danger-soft); }

.card { background: var(--surface); border: 0; border-radius: var(--r-lg); box-shadow: var(--shadow-1); overflow: hidden; }
/* 迭代 v2：深色主题用极淡描边代替阴影分层；paper 主题保留细线无阴影签名 */
html[data-theme="midnight"] .card { border: 1px solid var(--line); }
html[data-theme="paper"] .card { border: 1px solid var(--line); box-shadow: none; }
.card-head {
  display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-5);
  border-bottom: 1px solid var(--line); font-size: var(--fs-14); font-weight: 600; min-height: 48px;
}
.card-head .spacer, .spacer { margin-inline-start: auto; }
.card-body { padding: var(--sp-5); }
.card-body.tight { padding: var(--sp-3) var(--sp-5); }
.card-section { background: var(--surface-2); border-radius: var(--r-md); padding: var(--sp-4); }
.card-foot { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--line); }

.table-wrap { overflow-x: auto; }
.table { width: 100%; font-size: var(--fs-13); border-collapse: collapse; }
.table th {
  padding: 8px 12px; text-align: left; color: var(--muted); font-weight: 500;
  font-size: var(--fs-12); background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap;
}
.table td { padding: 10px 12px; border-bottom: 1px solid var(--line); color: var(--text-2); }
.table tbody tr:hover { background: var(--surface-3); }
.table tbody tr:last-child td { border-bottom: 0; }
.table th[data-col="ops"], .table td[data-col="ops"] { text-align: right; width: 120px; white-space: nowrap; }
.table td b, .cell-main { color: var(--text); font-weight: 600; }

.chip {
  display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px;
  font-size: var(--fs-12); border: 1px solid var(--line); background: var(--surface);
  color: var(--text-2); cursor: pointer; transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: var(--fs-12); font-weight: 600; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.neutral { background: var(--surface-2); color: var(--muted); }

.alert {
  display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-md); font-size: var(--fs-13); line-height: var(--lh-body);
}
.alert > .ic { margin-top: 2px; }
.alert-warn { background: var(--warn-soft); color: var(--warn); }
.alert-danger { background: var(--danger-soft); color: var(--danger); }
.alert-info { background: var(--accent-soft); color: var(--accent-strong); }
.alert .alert-text { flex: 1; min-width: 0; }
.alert .alert-actions { display: flex; align-items: center; gap: var(--sp-1); flex: none; }
.alert .alert-detail { margin-top: var(--sp-2); font-size: var(--fs-12); opacity: .85; line-height: 1.7; }
.alert .icon-btn { flex: none; }

.empty { display: grid; justify-items: center; gap: var(--sp-3); padding: var(--sp-10) var(--sp-6); text-align: center; }
.empty-icon {
  width: 56px; height: 56px; border-radius: var(--r-md); display: grid; place-items: center;
  background: var(--surface-2); color: var(--muted);
}
.empty h3 { font-size: var(--fs-14); font-weight: 600; color: var(--text); }
.empty p { font-size: var(--fs-13); color: var(--muted); max-width: 420px; line-height: var(--lh-body); }
.empty .btn { margin-top: var(--sp-2); }
.empty.hint { padding: var(--sp-6); }

.skeleton {
  border-radius: var(--r-xs);
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
  background-size: 200% 100%; animation: shimmer 1.2s infinite linear; height: 14px;
}
@keyframes shimmer { to { background-position: -200% 0; } }

.toast-wrap { position: fixed; right: var(--sp-5); bottom: calc(28px + var(--sp-4)); z-index: 90; display: grid; gap: var(--sp-2); justify-items: end; }
.toast {
  display: flex; align-items: center; gap: var(--sp-3); padding: 10px 14px; border-radius: var(--r-md);
  background: var(--surface); border: 0; border-left: 3px solid var(--accent);
  box-shadow: var(--shadow-2); font-size: var(--fs-13); max-width: 380px;
  animation: toast-in var(--dur) var(--ease);
}
.toast.ok { border-left-color: var(--ok); }
.toast.error { border-left-color: var(--danger); }
.toast .btn-ghost { flex: none; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
.toast-wrap.closing .toast { opacity: 0; transition: opacity var(--dur) var(--ease); }

.modal-mask {
  position: fixed; inset: 0; z-index: 120; background: var(--mask);
  display: grid; place-items: center; padding: var(--sp-6);
}
.modal {
  width: min(400px, calc(100vw - 48px)); border-radius: var(--r-lg);
  background: var(--surface); border: 0; box-shadow: var(--shadow-2);
  padding: var(--sp-6); animation: modal-in 150ms var(--ease);
}
.modal.wide { width: min(480px, calc(100vw - 48px)); }
@keyframes modal-in { from { opacity: 0; transform: scale(.98); } }
.modal h2 { font-size: var(--fs-16); font-weight: 600; margin-bottom: var(--sp-3); }
.modal .modal-body { font-size: var(--fs-13); color: var(--text-2); line-height: var(--lh-body); }
.modal .modal-body ul { margin: var(--sp-2) 0 0; padding-inline-start: var(--sp-5); }
.modal-foot { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: var(--sp-5); }

.kbd {
  display: inline-block; padding: 1px 6px; border-radius: var(--r-xs);
  background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px;
  font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-2);
}
.input, .select {
  height: 34px; padding: 0 12px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  font-size: var(--fs-13); font-family: inherit; min-width: 0;
}
.input:hover, .select:hover { border-color: var(--line-strong); }
.input:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input::placeholder { color: var(--muted); }
.input:disabled { background: var(--surface-2); color: var(--muted); }
.field-error { font-size: var(--fs-12); color: var(--danger); margin-top: var(--sp-1); }
.search-box { display: flex; align-items: center; gap: var(--sp-1); height: 30px; padding: 0 var(--sp-2); border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.search-box input { border: 0; outline: none; background: transparent; height: 100%; width: 150px; font: inherit; font-size: var(--fs-12); color: var(--text); }
.search-box input::placeholder { color: var(--muted); }

.switch {
  width: 36px; height: 20px; border-radius: 999px; border: 0; padding: 0; cursor: pointer;
  background: var(--line-strong); position: relative; transition: background var(--dur-fast) var(--ease); flex: none;
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--surface); box-shadow: var(--shadow-1); transition: transform var(--dur-fast) var(--ease);
}
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }
.switch:focus-visible { box-shadow: var(--focus-ring); outline: none; }

.tabs { display: inline-flex; gap: 2px; background: var(--surface-2); padding: 2px; border-radius: var(--r-sm); }
.tab { height: 28px; padding: 0 14px; border: 0; border-radius: 999px; font-size: var(--fs-13); color: var(--text-2); background: transparent; cursor: pointer; }
.tab.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow-1); }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }
.dot.off { background: var(--muted); }
.dot.busy { background: var(--accent); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.dropzone {
  display: grid; place-items: center; gap: var(--sp-1); min-height: 96px; padding: var(--sp-4);
  border: 1px dashed var(--line-strong); border-radius: var(--r-sm); background: var(--surface-3);
  color: var(--text-2); font-size: var(--fs-13); text-align: center; cursor: pointer; width: 100%;
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.dropzone small { color: var(--muted); font-size: var(--fs-12); }
.dropzone:hover, .dropzone.is-over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
.dropzone[data-locked="true"] { cursor: not-allowed; color: var(--muted); }

.kv-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-2); }
.kv-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kv { padding: var(--sp-3); background: var(--surface-2); border-radius: var(--r-sm); min-width: 0; }
.kv dt { font-size: var(--fs-12); color: var(--muted); }
.kv dd { margin-top: var(--sp-1); font-size: var(--fs-13); color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv dd.skeleton-line { height: 14px; margin-top: 5px; }

.progress { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; min-width: 80px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width var(--dur) var(--ease); }
.progress.ok i { background: var(--ok); }

.tool-row {
  display: flex; align-items: center; gap: var(--sp-2); width: 100%;
  padding: var(--sp-2) var(--sp-2); border: 0; border-radius: var(--r-sm); background: transparent;
  font-size: var(--fs-13); color: var(--text-2); cursor: pointer; text-align: left;
}
.tool-row:hover { background: var(--surface-2); color: var(--text); }
.tool-row .kbd { margin-inline-start: auto; }
.tool-ico { width: 28px; height: 28px; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); flex: none; }
/* 磁贴 Prism：分类图标粉彩化 —— 淡彩底 + 同系深色图标 */
html[data-theme="prism"] .tool-ico.c1 { background: var(--cat-blue-soft); color: #3568cf; }
html[data-theme="prism"] .tool-ico.c2 { background: var(--cat-teal-soft); color: #0e857a; }
html[data-theme="prism"] .tool-ico.c3 { background: var(--cat-violet-soft); color: #6448d8; }
html[data-theme="prism"] .tool-ico.c4 { background: var(--cat-pink-soft); color: #c04375; }
html[data-theme="prism"] .tool-ico.c5 { background: var(--cat-amber-soft); color: #a97415; }
html[data-theme="prism"] .tool-ico.c6 { background: var(--cat-green-soft); color: #288a4e; }

.steps { display: grid; gap: var(--sp-2); counter-reset: step; }
.steps .step-line { position: relative; padding: var(--sp-2) 0 var(--sp-2) var(--sp-6); color: var(--text-2); line-height: var(--lh-body); }
.steps .step-line::before {
  counter-increment: step; content: counter(step);
  position: absolute; left: 0; top: var(--sp-2); width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent); font-size: var(--fs-11); font-weight: 700;
  display: grid; place-items: center;
}

/* ---------- ⌘K 命令面板 ---------- */
.cmdk-mask { position: fixed; inset: 0; z-index: 130; background: var(--mask); display: flex; justify-content: center; padding-top: 12vh; }
.cmdk {
  width: min(560px, calc(100vw - 48px)); height: fit-content; max-height: 62vh;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-2); display: flex; flex-direction: column; overflow: hidden;
  animation: modal-in 150ms var(--ease);
}
.cmdk-input {
  border: 0; outline: none; background: transparent; height: 48px; padding: 0 var(--sp-5);
  font: inherit; font-size: var(--fs-14); color: var(--text); border-bottom: 1px solid var(--line); flex: none;
}
.cmdk-input::placeholder { color: var(--muted); }
.cmdk-list { overflow-y: auto; padding: var(--sp-2); flex: 1; }
.cmdk-group { font-size: var(--fs-11); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: var(--sp-2) var(--sp-3) var(--sp-1); }
.cmdk-item {
  display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-3); height: 36px;
  border-radius: var(--r-sm); font-size: var(--fs-13); color: var(--text-2); cursor: pointer;
}
.cmdk-item .ic { color: var(--muted); }
.cmdk-item.active { background: var(--accent-soft); color: var(--accent); }
.cmdk-item.active .ic { color: var(--accent); }
.cmdk-item .cmd-tag { margin-inline-start: auto; font-size: var(--fs-11); color: var(--muted); }
.cmdk-item .kbd { flex: none; }
.cmdk-foot { flex: none; display: flex; gap: var(--sp-3); padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--line); font-size: var(--fs-11); color: var(--muted); }
.cmdk-empty { padding: var(--sp-6); text-align: center; color: var(--muted); font-size: var(--fs-13); }

/* ---------- Popover（设备 pill / 主题菜单） ---------- */
.popover {
  position: fixed; z-index: 110; min-width: 220px; padding: var(--sp-3);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  box-shadow: var(--shadow-2); font-size: var(--fs-13);
}
.popover .kv-grid { grid-template-columns: 1fr; }
.popover .menu-item {
  display: flex; align-items: center; gap: var(--sp-2); width: 100%; height: 32px;
  padding: 0 var(--sp-2); border: 0; border-radius: var(--r-sm); background: transparent;
  font-size: var(--fs-13); color: var(--text-2); cursor: pointer; text-align: left;
}
.popover .menu-item:hover { background: var(--surface-2); color: var(--text); }
.popover .menu-item[aria-checked="true"] { color: var(--accent); font-weight: 600; background: var(--accent-soft); }
.popover .menu-item .swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line-strong); flex: none; }

/* ---------- 视图专用结构 ---------- */
.canvas16 { aspect-ratio: 16 / 9; width: 100%; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); position: relative; overflow: hidden; display: grid; }
.canvas16 .empty { width: 100%; }
.canvas-screen { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(140deg, var(--surface-3), var(--surface-2)); }
.phone-frame {
  width: 96px; height: 170px; border: 3px solid var(--line-strong); border-radius: 14px;
  background: var(--surface); position: relative; box-shadow: var(--shadow-1);
}
.phone-frame::before { content: ""; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 20px; height: 3px; border-radius: 3px; background: var(--line-strong); }
.phone-frame i { position: absolute; inset: 14px 4px 4px; border-radius: 6px; background: linear-gradient(150deg, var(--accent-soft), var(--accent)); opacity: .8; }
.canvas-hud {
  position: absolute; left: var(--sp-3); bottom: var(--sp-3); display: flex; align-items: center; gap: var(--sp-2);
  padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  font-size: var(--fs-12); color: var(--text-2); box-shadow: var(--shadow-1);
}
.canvas-flag { position: absolute; left: var(--sp-3); top: var(--sp-3); display: inline-flex; align-items: center; gap: var(--sp-1); padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: var(--fs-11); color: var(--muted); }
.mirror-toolbar { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }

.thumb-strip { display: flex; gap: var(--sp-2); overflow-x: auto; padding-bottom: var(--sp-1); }
.thumb {
  height: 88px; min-width: 132px; border-radius: var(--r-sm); border: 1px solid var(--line);
  background: linear-gradient(150deg, var(--accent-soft), var(--accent)); color: var(--on-accent);
  display: flex; align-items: flex-end; justify-content: space-between; padding: var(--sp-2);
  font-size: var(--fs-11); cursor: pointer; position: relative; flex: none;
}
.thumb .icon-btn { position: absolute; top: 2px; right: 2px; color: var(--on-accent); }
.thumb .icon-btn:hover { background: var(--mask); color: var(--on-accent); }
.thumb:nth-child(3n+2) { background: linear-gradient(150deg, var(--ok-soft), var(--ok)); }
.thumb:nth-child(3n) { background: linear-gradient(150deg, var(--warn-soft), var(--warn)); }

.album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--sp-3); }
.album-cell { position: relative; border-radius: var(--r-sm); border: 1px solid var(--line); overflow: hidden; background: linear-gradient(150deg, var(--accent-soft), var(--accent)); aspect-ratio: 1; cursor: pointer; padding: 0; }
.album-cell:nth-child(4n+2) { background: linear-gradient(150deg, var(--ok-soft), var(--ok)); }
.album-cell:nth-child(4n+3) { background: linear-gradient(150deg, var(--warn-soft), var(--warn)); }
.album-cell time { position: absolute; left: var(--sp-2); bottom: var(--sp-1); font-size: var(--fs-11); color: var(--on-accent); }
.album-cell input { position: absolute; top: var(--sp-2); left: var(--sp-2); width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }

.plan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--sp-3); }
.plan-card { border: 0; border-radius: var(--r-md); padding: var(--sp-4); background: var(--surface-2); display: grid; gap: var(--sp-2); }
.plan-card h4 { font-size: var(--fs-14); display: flex; align-items: center; gap: var(--sp-2); }
.plan-card .plan-foot { display: flex; align-items: center; gap: var(--sp-1); margin-top: var(--sp-1); }
.step-row { display: grid; grid-template-columns: minmax(0,1fr) 120px 96px auto; gap: var(--sp-2); align-items: center; font-size: var(--fs-12); color: var(--text-2); padding: var(--sp-1) 0; border-bottom: 1px dashed var(--line); }
.step-row:last-child { border-bottom: 0; }
.step-row .mono { font-size: var(--fs-12); }

.notify-row { display: flex; gap: var(--sp-3); padding: var(--sp-3) var(--sp-5); border-bottom: 1px solid var(--line); align-items: flex-start; }
.notify-row:last-child { border-bottom: 0; }
.notify-row .notify-body { flex: 1; min-width: 0; }
.notify-row .notify-text { color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: var(--lh-body); }
.notify-row time { font-size: var(--fs-12); color: var(--muted); flex: none; }

.settings-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) 0; border-bottom: 1px solid var(--line); }
.settings-row:last-child { border-bottom: 0; }
.settings-row .set-text { flex: 1; min-width: 0; }
.settings-row .set-text b { font-weight: 600; color: var(--text); display: block; font-size: var(--fs-13); }
.settings-row .set-text small { color: var(--muted); font-size: var(--fs-12); line-height: var(--lh-body); display: block; margin-top: 2px; }
.settings-row .set-ctrl { flex: none; }

.theme-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--sp-3); }
.theme-swatch {
  border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface);
  padding: var(--sp-2); cursor: pointer; text-align: left; font-size: var(--fs-12); color: var(--text-2);
  display: grid; gap: var(--sp-2); position: relative;
}
.theme-swatch .swatch-strip { height: 28px; border-radius: var(--r-xs); border: 1px solid var(--line); display: flex; overflow: hidden; }
.theme-swatch .swatch-strip i { flex: 1; }
.theme-swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); color: var(--text); font-weight: 600; }
.theme-swatch[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 4px; right: 6px; color: var(--accent); font-weight: 700; }

.check-list { display: grid; gap: var(--sp-2); }
.check-item { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); background: var(--surface-2); font-size: var(--fs-13); color: var(--text-2); }
.check-item .ic { flex: none; }
.check-item .ic.ok { color: var(--ok); } .check-item .ic.bad { color: var(--warn); }
.check-item .why { margin-inline-start: auto; font-size: var(--fs-12); color: var(--muted); }

.device-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-3); }
.device-tile { display: flex; gap: var(--sp-3); padding: var(--sp-4); border: 0; border-radius: var(--r-md); background: var(--surface-2); align-items: center; transition: background var(--dur-fast) var(--ease); }
.device-tile:hover { background: var(--accent-soft); }
.device-tile .tile-ico { width: 40px; height: 40px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.device-tile b { font-size: var(--fs-14); }
.device-tile p { font-size: var(--fs-12); color: var(--muted); margin-top: 2px; }

.tool-grid-home { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--sp-3); }
.tool-card { display: flex; gap: var(--sp-3); align-items: center; padding: var(--sp-3); border: 0; border-radius: var(--r-md); background: var(--surface-2); cursor: pointer; text-align: left; font-size: var(--fs-13); transition: background var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
.tool-card:hover { background: var(--accent-soft); }
.tool-card:hover { background: var(--surface-2); }
.tool-card b { display: block; color: var(--text); font-weight: 600; }
.tool-card small { display: block; color: var(--muted); font-size: var(--fs-12); margin-top: 2px; }

.ctx { width: 280px; flex: none; border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: var(--sp-4); display: grid; gap: var(--sp-4); align-content: start; }
.ctx-block { border: 0; border-radius: var(--r-md); background: var(--surface-2); overflow: hidden; }
.ctx-block > h3 { font-size: var(--fs-12); font-weight: 600; color: var(--muted); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.ctx-block > div { padding: var(--sp-3) var(--sp-4); }
.ctx-dl { display: grid; gap: var(--sp-2); }
.ctx-dl > div { display: flex; justify-content: space-between; gap: var(--sp-2); font-size: var(--fs-12); }
.ctx-dl dt { color: var(--muted); flex: none; }
.ctx-dl dd { color: var(--text-2); font-weight: 600; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 遮罩 / 抽屉 / 窗口过小 ---------- */
.scrim { position: fixed; inset: 44px 0 28px 0; z-index: 40; background: var(--mask); }
.drawer-hint { font-size: var(--fs-12); color: var(--muted); padding: var(--sp-2) var(--sp-4); }
.too-small {
  position: fixed; inset: 0; z-index: 400; display: none; place-items: center;
  background: var(--bg); color: var(--text); text-align: center; padding: var(--sp-6);
}
.too-small .empty-icon { margin-inline: auto; }
@media (max-width: 859px) { .too-small { display: grid; } }

/* ---------- 响应式 · UX §6 三档 ---------- */
@media (max-width: 1199px) {
  .app { --side-w: 56px; }
  /* 1000–1199：侧栏默认收起；用户展开时浮层覆盖不挤压内容 */
  .app.side-alt .sidebar {
    position: fixed; left: 0; top: 44px; bottom: 28px; width: 232px; z-index: 45;
    box-shadow: var(--shadow-2); --side-w: 232px;
  }
  .ctx { display: none; }
  .kv-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .theme-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .table [data-col="meta"] { display: none; }
  .table [data-mid-hide] { display: none; }
  .sb-ext { display: none; }
  .pill span { display: none; }
  .pill { max-width: none; padding: 0 9px; }
}
@media (max-width: 999px) {
  .app { --side-w: 0px; }
  .sidebar {
    position: fixed; left: 0; top: 44px; bottom: 28px; width: 232px; z-index: 60;
    transform: translateX(-100%); transition: transform var(--dur) var(--ease);
    box-shadow: var(--shadow-2); --side-w: 232px;
  }
  .app.drawer-open .sidebar { transform: none; }
  /* 抽屉态保持展开样式 */

/* ==================== Toast ==================== */
function showToast(text, opts) {
  opts = opts || {};
  var wrap = $("#toast-wrap");
  while (wrap.children.length >= 3) wrap.removeChild(wrap.firstChild);
  var t = document.createElement("div");
  t.className = "toast " + (opts.type || "");
  t.innerHTML = '<span>' + esc(text) + '</span>';
  if (opts.action) {
    var b = document.createElement("button");
    b.className = "btn-ghost";
    b.textContent = opts.action.label;
    b.setAttribute("data-act", opts.action.act);
    t.appendChild(b);
  }
  wrap.appendChild(t);
  var ms = opts.duration || 4000;
  setTimeout(function () {
    t.style.opacity = "0";
    t.style.transition = "opacity .18s";
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 200);
  }, ms);
}

/* ==================== Modal（危险操作对话框 · UX §5.3） ==================== */
var modalReturnFocus = null;
function openModal(cfg) {
  modalReturnFocus = document.activeElement;
  $("#modal-title").textContent = cfg.title;
  $("#modal-body").innerHTML = cfg.body;
  var foot = $("#modal-foot");
  foot.innerHTML = "";
  var cancel = document.createElement("button");
  cancel.className = "btn btn-secondary";
  cancel.textContent = cfg.cancelLabel || "取消";
  cancel.setAttribute("data-act", "modal-cancel");
  var ok = document.createElement("button");
  ok.className = "btn " + (cfg.danger ? "btn-danger-solid" : "btn-primary");
  ok.textContent = cfg.okLabel || "确认";
  ok.setAttribute("data-act", "modal-ok");
  foot.appendChild(cancel); foot.appendChild(ok);
  $("#modal").className = "modal" + (cfg.wide ? " wide" : "");
  $("#modal-mask").hidden = false;
  $("#modal").dataset.pending = cfg.id || "";
  /* 危险确认：焦点落取消，防回车误触 */
  (cfg.danger ? cancel : ok).focus();
}
function closeModal() {
  $("#modal-mask").hidden = true;
  if (modalReturnFocus && modalReturnFocus.focus) modalReturnFocus.focus();
}
function confirmModal() {
  var id = $("#modal").dataset.pending;
  closeModal();
  runModalAction(id);
}
function runModalAction(id) {
  if (id === "uninstall-app") {
    var i = state.apps._pendingRemove;
    if (typeof i === "number") {
      var name = state.apps[i].name;
      state.apps.splice(i, 1);
      state.apps._pendingRemove = undefined;
      render();
      showToast("已卸载 " + name + "（演示）", { type: "ok" });
    }
  } else if (id === "clear-notis") {
    state.notis = [];
    render();
    showToast("已清空通知（演示）", { type: "ok" });
  } else if (id === "end-all") {
    state.mirrorOn = false;
    render();
    showToast("已结束全部镜像会话（演示）", { type: "ok" });
  } else if (id === "revoke") {
    state.proActive = false;
    render();
    showToast("已撤销本机授权，回到免费版（演示）", { type: "ok" });
  }
}

/* ==================== 二次点击确认（3s 内再点生效 · UX §5.3） ==================== */
function armDanger(btn, confirmText, fn) {
  if (btn.dataset.armed === "1") {
    btn.dataset.armed = "";
    fn();
    return;
  }
  btn.dataset.armed = "1";
  btn.dataset.oldHtml = btn.innerHTML;
  btn.dataset.oldClass = btn.className;
  btn.textContent = confirmText;
  btn.className = btn.className.replace("btn-ghost", "btn-danger-solid").replace("btn-secondary", "btn-danger-solid");
  setTimeout(function () {
    if (btn.isConnected && btn.dataset.armed === "1") {
      btn.dataset.armed = "";
      btn.innerHTML = btn.dataset.oldHtml;

function applyTheme(key, silent) {
  if (!THEMES[key]) return;
  state.theme = key;
  document.documentElement.setAttribute("data-theme", key);
  try { localStorage.setItem("md-theme", key); } catch (e) {}
  var swatches = $$(".theme-swatch");
  for (var i = 0; i < swatches.length; i++) swatches[i].setAttribute("aria-pressed", String(swatches[i].dataset.theme === key));

}

function headerActions(view) {
  var demo = state.demo;

  switch (view) {
    case "home":
      m = demo ? { label: "打开镜像", act: "nav", view: "mirror", style: "btn-primary" } : null;
      break;
    case "connect":
      m = { label: "重新检查", act: "refresh", style: "btn-secondary" };
      break;
    case "info":
      m = demo ? { label: "复制诊断摘要", act: "copy-diag", style: "btn-primary" } : null;
      break;
    case "multi":
      m = demo ? { label: "结束全部会话", act: "end-all", style: "btn-danger" } : null;
      break;
    case "mirror":
      m = demo
        ? (state.mirrorOn
            ? { label: "结束镜像", act: "mirror-end", style: "btn-danger" }
            : { label: "开始镜像", act: "mirror-start", style: "btn-primary" })

      m = demo
        ? { label: "开始演示", act: "toast", style: "btn-primary", arg: "原型演示：开始放映" }
        : { label: "开始演示", act: "", style: "btn-primary", disabled: true, title: "先连接设备" };
      break;
    case "keymap":
      parts.push(headerBtn({ label: "导入配置", act: "toast", style: "btn-secondary", arg: "原型演示：导入配置" }));
      /* 无方案时空态 CTA 是唯一 primary（G7 规则），页头主操作隐藏 */

        : { label: "刷新相册", act: "album-refresh", style: "btn-secondary" };

        : { label: "开始录制", act: "", style: "btn-primary", disabled: true, title: "先连接设备" };
      break;

      parts.push(headerBtn({ label: "清空队列", act: "install-clear", style: "btn-ghost danger", hidden: state.installQueue.length === 0 }));

function openCmdk() {

  input.value = "";

function closeCmdk() {
  $("#cmdk-mask").hidden = true;
}
function buildCmdkList(q) {
  q = q.trim().toLowerCase();
  var all = cmdkCommands();
  var recents = state.recentCmds.slice(0, 3).map(function (id) {
    return all.filter(function (c) { return c.id === id; })[0];
  }).filter(Boolean);
  var matched = all.filter(function (c) { return !q || (c.title + " " + c.kw).toLowerCase().indexOf(q) !== -1; });
  var items = q ? matched : recents.concat(matched.filter(function (c) { return recents.indexOf(c) === -1; }));
  state._cmdkItems = items;
  state.cmdkIndex = 0;
  var list = $("#cmdk-list");
  if (!items.length) {
    list.innerHTML = '<div class="cmdk-empty">没有匹配的命令</div>';
    return;
  }
  var html = "";
  var lastGroup = null;
  items.forEach(function (c, i) {
    if (c.group !== lastGroup) { html += '<div class="cmdk-group">' + c.group + "</div>"; lastGroup = c.group; }
    html += '<div class="cmdk-item' + (i === 0 ? " active" : "") + '" id="cmdk-opt-' + i + '" role="option" aria-selected="' + (i === 0) + '" data-cmd-index="' + i + '">' +
      ico(c.icon) + "<span>" + esc(c.title) + "</span>" +
      (c.kbd ? '<span class="kbd">' + c.kbd + "</span>" : "") +
      '<span class="cmd-tag">' + c.tag + "</span></div>";
  });
  list.innerHTML = html;
  $("#cmdk-input").setAttribute("aria-activedescendant", "cmdk-opt-0");
}
function cmdkMove(delta) {
  var items = state._cmdkItems || [];
  if (!items.length) return;
  state.cmdkIndex = (state.cmdkIndex + delta + items.length) % items.length;
  $$(".cmdk-item").forEach(function (el, i) {
    el.classList.toggle("active", i === state.cmdkIndex);
    el.setAttribute("aria-selected", String(i === state.cmdkIndex));
  });
  var active = $("#cmdk-opt-" + state.cmdkIndex);
  if (active) {
    $("#cmdk-input").setAttribute("aria-activedescendant", active.id);
    active.scrollIntoView({ block: "nearest" });
  }
}
function cmdkRun(index) {
  var items = state._cmdkItems || [];
  var c = items[index];
  if (!c) return;
  closeCmdk();
  state.recentCmds = [c.id].concat(state.recentCmds.filter(function (x) { return x !== c.id; })).slice(0, 3);
  c.run();
}

/* ==================== Popover（设备 pill / 主题菜单） ==================== */
function showPopover(anchor, html) {
  var pop = $("#popover");
  pop.innerHTML = html;
  pop.hidden = false;
  var r = anchor.getBoundingClientRect();
  pop.style.top = (r.bottom + 6) + "px";
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 240)) + "px";
}
function hidePopover() { $("#popover").hidden = true; }
function devicePopover() {
  showPopover($("#device-pill"), state.demo
    ? '<div style="font-weight:600;margin-bottom:8px">' + DEMO_DEVICE.name + ' <span class="badge ok">USB 已授权</span></div>' +
      '<dl class="kv-grid">' +
      [["型号", "Redmi K40"], ["系统", "Android 13"], ["电量", "78%"], ["存储", "64 / 128 GB"], ["分辨率", "1080 × 2400"], ["延迟", "38 ms"]]
        .map(function (p) { return '<div class="kv"><dt>' + p[0] + "</dt><dd>" + p[1] + "</dd></div>"; }).join("") + "</dl>" +
      '<button class="btn btn-secondary btn-sm" style="margin-top:8px" data-act="nav" data-view="info">设备详情</button>'
    : '<div style="font-weight:600;margin-bottom:6px">未连接设备</div>' +
      '<p style="font-size:var(--fs-12);color:var(--muted);margin-bottom:8px">用数据线连接 Android 设备并授权。</p>' +
      '<button class="btn btn-primary btn-sm" data-act="nav" data-view="connect">去连接</button>');
}
function themePopover() {
  showPopover($("#theme-btn"), THEME_ORDER.map(function (k) {
    var t = THEMES[k];
    return '<button class="menu-item" role="menuitemradio" aria-checked="' + (state.theme === k) + '" data-act="theme-set" data-arg="' + k + '">' +
      '<span class="swatch" style="background:' + t.dots[1] + '"></span>' + t.name + "</button>";
  }).join(""));
}

/* ==================== 动作分发 ==================== */
function runAct(act, arg, btn) {
  switch (act) {
    case "nav": switchView(arg); break;
    case "demo":
      state.demo = !state.demo;
      if (!state.demo) { state.mirrorOn = false; stopRec(false); }
      render();
      showToast(state.demo ? "已开启预览演示数据（仅预览，不代表真实状态）" : "已关闭演示数据，回到真实空态", { type: "ok" });
      break;
    case "side": toggleSide(); break;
    case "drawer-open": openDrawer(); break;
    case "overlay-close":
      if (state.drawer) closeDrawer();
      else if (state.sideAlt) { state.sideAlt = false; syncShellClasses(); $("#side-toggle").textContent = "折叠"; }
      hidePopover();
      break;
    case "cmdk-open": openCmdk(); break;
    case "pill": devicePopover(); break;
    case "theme-menu": themePopover(); break;
    case "theme-set": applyTheme(arg); hidePopover(); break;
    case "refresh": showToast(state.demo ? "检查完成：1 台设备在线" : "检查完成：未发现设备，请检查数据线与 USB 调试", { type: state.demo ? "ok" : "error" }); break;
    case "alert-detail": {
      var d = btn.closest(".alert").querySelector("[data-detail]");
      if (d) d.hidden = !d.hidden;
      break;
    }
    case "brand": showToast("原型演示：打开 " + arg + " 品牌连接排查指引（跳转帮助中心）"); break;
    case "conn-tab": state.connTab = arg; render(); break;
    case "pair": showToast("原型演示：配对请求已发送，请在手机上确认"); break;
    case "trust-revoke": armDanger(btn, "确认移除？", function () { showToast("已移除受信设备（演示）", { type: "ok" }); render(); }); break;
    case "copy-diag":
      showToast("已复制诊断摘要（演示）", { type: "ok" });
      break;
    case "toast": showToast(arg || "原型演示"); break;
    /* 镜像 */
    case "mirror-start":
      state.mirrorOn = true; render();
      showToast("镜像会话已建立（演示）", { type: "ok" });
      break;
    case "mirror-end":
      state.mirrorOn = false; render();
      showToast("镜像已结束", { type: "ok", duration: 5000, action: { label: "重新开始", act: "mirror-start" } });
      break;
    case "mirror-pause": showToast("原型演示：画面已暂停"); break;
    case "end-all":
      openModal({ id: "end-all", title: "结束全部镜像会话？", body: "<p>将结束 <b>1</b> 个进行中的镜像会话。</p>", okLabel: "结束全部", danger: true, wide: true });
      break;
    /* 录像 */
    case "record-start":
      state.recording = true; state.recSec = 0; render(); startRecTimer();
      showToast("录制已开始（演示）", { type: "ok" });
      break;
    case "record-stop": stopRec(true); break;
    /* 截图 */
    case "shot-now":
      state.shots.unshift("11-24 " + new Date().toTimeString().slice(0, 5));
      render();
      showToast("已保存截图到 MirrorDock 目录（演示）", { type: "ok" });
      break;
    case "shot-del":
      armDanger(btn, "确认删除？", function () {
        state.shots.splice(Number(arg), 1);
        render();
        showToast("已删除截图（演示）", { type: "ok" });
      });
      break;
    case "shot-view": showToast("原型演示：放大预览 " + state.shots[Number(arg)]); break;
    /* 相册 */
    case "album-dir": state.albumDir = Number(arg); state.albumSel = {}; render(); break;
    case "album-refresh": showToast(state.demo ? "相册已刷新（演示）" : "未连接设备：请先连接", { type: state.demo ? "ok" : "error" }); render(); break;
    case "album-fetch":
      if (Object.keys(state.albumSel).length) showToast("已开始取回所选 " + Object.keys(state.albumSel).length + " 项（演示）", { type: "ok" });
      break;
    /* 文件 */
    case "file-refresh": showToast(state.demo ? "文件列表已刷新（演示）" : "读取失败：未连接设备", { type: state.demo ? "ok" : "error" }); break;
    case "file-push":
      if (!state.demo) { showToast("连接后可用：请先连接设备", { type: "error" }); break; }
      showToast("已加入推送队列，等待手机确认（演示）", { type: "ok" });
      break;
    /* 安装 */
    case "install-add":
      if (!state.demo) { showToast("连接设备后可用", { type: "error" }); break; }
      state.installQueue.push({ name: "app-release-0" + (state.installQueue.length + 1) + ".apk", size: "12.8 MB", state: "wait" });
      render();
      showToast("已加入安装队列，等待手机确认（演示）", { type: "ok" });
      break;
    case "install-mode": state.installMode = arg; break;
    case "install-run":
      if (!state.demo) { showToast("需要设备已连接", { type: "error" }); break; }
      state.installQueue.forEach(function (q) { q.state = "done"; });
      render();
      showToast("队列安装完成（演示）", { type: "ok" });
      break;
    case "install-clear":
      armDanger(btn, "确认清空？", function () { state.installQueue = []; render(); showToast("已清空安装队列（演示）", { type: "ok" }); });
      break;
    /* 应用 */
    case "apps-refresh":
      state.apps = DEMO_APPS.slice(); state.appsQuery = ""; render();
      showToast("应用清单已刷新（演示）", { type: "ok" });
      break;
    case "apps-sort": state.appsSort = arg; render(); break;
    case "app-uninstall": {
      var i = Number(arg);
      state.apps._pendingRemove = i;
      var a = state.apps[i];
      openModal({ id: "uninstall-app", title: "卸载 " + a.name + "？", body: "<p>应用数据将一并删除，无法恢复。</p><p style='margin-top:6px;color:var(--muted);font-size:var(--fs-12)'>包名 " + esc(a.pkg) + " · 设备端会弹出确认。</p>", okLabel: "卸载", danger: true });
      break;
    }
    /* 通知 */
    case "notify-clear":
      openModal({ id: "clear-notis", title: "清空 " + state.notis.length + " 条通知？", body: "<p>通知正文默认不持久化，清空后无法找回。</p>", okLabel: "清空", danger: true });
      break;
    case "notify-keep":
      state.notifyKeep = !state.notifyKeep;
      btn.setAttribute("aria-checked", String(state.notifyKeep));
      break;
    /* 方案 / 计划 / 脚本 */
    case "plan-new": {
      var isKeymap = state.view === "keymap";
      var list = isKeymap ? state.keymapPlans : state.replayScripts;
      list.push({ name: (isKeymap ? "方案 " : "脚本 ") + (list.length + 1), steps: [] });
      render();
      showToast("已新建，可直接添加步骤（演示）", { type: "ok" });
      break;
    }
    case "step-add": {
      var pi = Number(arg);
      var prefix = state.view === "keymap" ? "km" : "rp";
      var actEl = $("#" + prefix + "-act-" + pi), keyEl = $("#" + prefix + "-key-" + pi), xyEl = $("#" + prefix + "-xy-" + pi);
      var action = actEl ? actEl.value.trim() : "", key = keyEl ? keyEl.value.trim() : "", xy = xyEl ? xyEl.value.trim() : "0, 0";
      if (!action || !key) { showToast("请填写动作与按键", { type: "error" }); break; }
      var xyParts = xy.split(/[,\s]+/).filter(Boolean);
      var list2 = state.view === "keymap" ? state.keymapPlans : state.replayScripts;
      list2[pi].steps.push({ action: action, key: key, x: xyParts[0] || "0", y: xyParts[1] || "0" });
      render();
      showToast("已添加步骤（演示）", { type: "ok" });
      break;
    }
    case "step-del": {
      var parts2 = arg.split(":");
      var pi2 = Number(parts2[0]), si2 = Number(parts2[1]);
      var list3 = state.view === "keymap" ? state.keymapPlans : state.replayScripts;
      list3[pi2].steps.splice(si2, 1);
      render();
      break;
    }
    case "plan-del": {
      var parts3 = arg.split(":");
      var kind = parts3[0], pi3 = Number(parts3[1]);
      var doDel = function () {
        if (kind === "keymap") state.keymapPlans.splice(pi3, 1);
        else if (kind === "replay") state.replayScripts.splice(pi3, 1);
        else state.schedulePlans.splice(pi3, 1);
        render();
        showToast("已删除（演示）", { type: "ok" });
      };
      if (btn) armDanger(btn, "确认删除？", doDel); else doDel();
      break;
    }
    case "sched-focus": { var n = $("#sch-name"); if (n) n.focus(); break; }
    case "sched-add": {
      var nameEl = $("#sch-name"), timeEl = $("#sch-time"), durEl = $("#sch-dur"), errEl = $("#sch-err");
      var name = nameEl ? nameEl.value.trim() : "";
      if (!name) {
        if (errEl) { errEl.textContent = "请输入计划名称"; errEl.hidden = false; }
        break;
      }
      state.schedulePlans.push({ name: name, time: timeEl ? timeEl.value : "09:30", dur: durEl ? (durEl.value || 10) : 10, enabled: true });
      render();
      showToast("计划已添加（演示）", { type: "ok" });
      break;
    }
    case "sched-toggle": {
      var p = state.schedulePlans[Number(arg)];
      if (p) p.enabled = !p.enabled;
      render();
      break;
    }
    /* 设置 / 帮助 / Pro */
    case "set-switch": {
      var k = arg;
      state.settings[k] = !state.settings[k];
      btn.setAttribute("aria-checked", String(state.settings[k]));
      showToast("已保存（演示）", { type: "ok" });
      break;
    }
    case "settings-reset":
      state.settings = { autoStart: true, minToTray: false, updateCheck: true, desktopMode: false, openAfter: false, notifyPersist: false, replay: false };
      applyTheme("soft", true);
      render();
      showToast("已恢复默认设置（演示）", { type: "ok" });
      break;
    case "help-toggle": {
      var items = $$(".help-item");
      var anyClosed = items.some(function (d) { return !d.open; });
      items.forEach(function (d) { d.open = anyClosed; });
      btn.textContent = anyClosed ? "收起全部" : "展开全部";
      btn.setAttribute("aria-expanded", String(anyClosed));
      break;
    }
    case "pro-activate": {
      var code = $("#pro-code");
      var err = $("#pro-err");
      state.proInput = code ? code.value.trim() : "";
      if (!state.proInput) {
        if (err) { err.textContent = "请输入激活码后再激活"; err.hidden = false; }
        break;
      }
      if (state.proInput.length < 8) {
        if (err) { err.textContent = "激活码格式不正确（演示环境可输入 8 位以上任意字符串）"; err.hidden = false; }
        break;
      }
      var b = $("#pro-btn");
      if (b) {
        b.classList.add("is-loading");
        b.disabled = true;
        setTimeout(function () {
          state.proActive = true;
          render();
          showToast("激活成功（演示）", { type: "ok" });
        }, 800);
      }
      break;
    }
    case "revoke":
      openModal({ id: "revoke", title: "撤销本机授权？", body: "<p>撤销后本机回到免费版，激活码仍可用于再次激活。</p>", okLabel: "撤销授权", danger: true });
      break;
    /* Context Panel 1000–1199 浮层 */
    case "ctx-open": {
      var c = ctxContent(state.view);
      showPopover(btn, c || '<p style="font-size:var(--fs-12);color:var(--muted)">本视图没有上下文信息。</p>');
      break;
    }
    /* modal */
    case "modal-cancel": closeModal(); break;
    case "modal-ok": confirmModal(); break;
  }
}

/* ==================== 录制计时 ==================== */
function startRecTimer() {
  stopRecTimer();
  state.recTimer = setInterval(function () {
    state.recSec++;
    var el = $("#rec-timer");
    if (el) {
      var m = Math.floor(state.recSec / 60), s = state.recSec % 60;
      el.textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    }
  }, 1000);
}
function stopRecTimer() { if (state.recTimer) { clearInterval(state.recTimer); state.recTimer = null; } }
function stopRec(notify) {
  stopRecTimer();
  if (state.recording && notify) showToast("录制已停止，已保存到 Recordings（演示）", { type: "ok" });
  state.recording = false;
  if (notify) render();
}

/* ==================== 事件绑定 ==================== */
document.addEventListener("click", function (e) {
  var t = e.target;
  var actEl = t.closest("[data-act]");
  /* popover 外点关闭 */
  var pop = $("#popover");
  if (!pop.hidden && !pop.contains(t) && !(actEl && (actEl.dataset.act === "pill" || actEl.dataset.act === "theme-menu" || actEl.dataset.act === "ctx-open"))) {
    hidePopover();
  }
  if (!actEl) return;
  var act = actEl.dataset.act;
  var arg = actEl.dataset.arg || actEl.dataset.view || "";
  if (act === "modal-cancel" || act === "modal-ok") { runAct(act); return; }
  runAct(act, arg, actEl);
});
/* Enter/Space 激活 role=button 元素（缩略图） */
document.addEventListener("keydown", function (e) {
  var t = e.target;
  if ((e.key === "Enter" || e.key === " ") && t.matches && t.matches('.thumb[role="button"]')) {
    e.preventDefault();
    runAct("shot-view", t.dataset.arg);
  }
});
/* 输入过滤（应用搜索 / 帮助搜索） */
document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.dataset.filter === "apps") {
    state.appsQuery = t.value;
    var q = t.value.toLowerCase();
    $$("#content tbody tr").forEach(function (row) {
      if (!row.dataset.rowStatic) row.hidden = !!q && !row.textContent.toLowerCase().includes(q);
    });
  } else if (t.dataset.filter === "help") {
    state._helpQuery = t.value;
    var cur = t.selectionStart;
    render();
    var next = $('[data-filter="help"]');
    if (next) { next.focus(); next.setSelectionRange(cur, cur); }
  } else if (t.id === "pro-code") {
    state.proInput = t.value.trim();
    var b = $("#pro-btn");
    if (b) b.textContent = state.proInput ? "激活" : "输入激活码后激活";
  }
});
/* 相册选择 / select 分发 */
document.addEventListener("change", function (e) {
  var t = e.target;
  if (t.matches("select") && t.dataset.act) { runAct(t.dataset.act, t.value, t); return; }
  if (t.dataset.act === "album-check") {
    if (t.checked) state.albumSel[t.getAttribute("aria-label")] = true;
    else delete state.albumSel[t.getAttribute("aria-label")];
    var n = Object.keys(state.albumSel).length;
    var btns = $$('#content [data-act="album-fetch"]');
    btns.forEach(function (b) {
      b.disabled = n === 0;
      b.title = n === 0 ? "请先选择缩略图" : "";
      b.textContent = "取回所选" + (n ? "（" + n + "）" : "");
    });
    var hb = $("#vh-actions [data-act='album-fetch']");
    if (hb) hb.disabled = n === 0;
  }
});
/* select 分发（合并于上方 change 监听） */

/* ==================== 键盘快捷键（UX §5.2） ==================== */
var DIGIT_VIEWS = ["home", "connect", "info", "multi", "mirror", "present", "keymap", "schedule", "replay"];
function trapFocus(container, e) {
  var focusables = container.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (!focusables.length) return;
  var first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
document.addEventListener("keydown", function (e) {
  var modalOpen = !$("#modal-mask").hidden;
  var cmdkOpen = !$("#cmdk-mask").hidden;
  /* Esc：关闭对话框/抽屉/命令面板，焦点归还 */
  if (e.key === "Escape") {
    if (modalOpen) { closeModal(); e.preventDefault(); }
    else if (cmdkOpen) { closeCmdk(); e.preventDefault(); }
    else if (!$("#popover").hidden) { hidePopover(); e.preventDefault(); }
    else if (state.drawer) { closeDrawer(); e.preventDefault(); }
    else if (state.sideAlt && window.innerWidth >= 1000 && window.innerWidth <= 1199) {
      state.sideAlt = false; syncShellClasses(); $("#side-toggle").textContent = "折叠"; e.preventDefault();
    }
    return;
  }
  if (cmdkOpen) {
    if (e.key === "ArrowDown") { e.preventDefault(); cmdkMove(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); cmdkMove(-1); }
    else if (e.key === "Enter") { e.preventDefault(); cmdkRun(state.cmdkIndex); }
    else if (e.key === "Tab") { trapFocus($("#cmdk"), e); }
    return;
  }
  if (modalOpen) {
    if (e.key === "Tab") trapFocus($("#modal"), e);
    return;
  }
  if (state.drawer && e.key === "Tab") { trapFocus($("#sidebar"), e); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmdk(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "b") { e.preventDefault(); toggleSide(); return; }
  /* 1–9 跳页（无修饰，且焦点不在输入框） */
  if (!e.metaKey && !e.ctrlKey && !e.altKey && /^[1-9]$/.test(e.key)) {
    var tag = document.activeElement ? document.activeElement.tagName : "";
    if (tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA") {
      switchView(DIGIT_VIEWS[Number(e.key) - 1]);
    }
  }
});
$("#cmdk-input").addEventListener("input", function (e) { buildCmdkList(e.target.value); });
$("#cmdk-list").addEventListener("click", function (e) {
  var item = e.target.closest(".cmdk-item");
  if (item) cmdkRun(Number(item.dataset.cmdIndex));
});
$("#cmdk-list").addEventListener("mousemove", function (e) {
  var item = e.target.closest(".cmdk-item");
  if (item && Number(item.dataset.cmdIndex) !== state.cmdkIndex) cmdkMove(Number(item.dataset.cmdIndex) - state.cmdkIndex);
});
$("#modal-mask").addEventListener("mousedown", function (e) {
  if (e.target === this) closeModal();
});
$("#cmdk-mask").addEventListener("mousedown", function (e) {
  if (e.target === this) closeCmdk();
});
window.addEventListener("resize", function () {
  render();
});

/* ==================== 初始化 ==================== */
(function init() {
  var saved = null;
  try { saved = localStorage.getItem("md-theme"); } catch (e) {}
  applyTheme(saved || "soft", true);
  render();
})();
</script>
