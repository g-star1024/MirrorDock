[package]
name = "md-core"
version = "0.4.24"
edition = "2021"
description = "MirrorDock 共享业务逻辑：设备发现、结构化错误、伴侣配对"
license = "MIT"
publish = false

# 依赖版本与 src-tauri/Cargo.toml 严格对齐——同一份 Cargo.lock 语义，
# 避免桌面端与 NAS 端因为依赖版本漂移产生行为差异。
[dependencies]
serde = { version = "1", features = ["derive"] }

# 伴侣配对（C4-01）：TLS 1.3 一次性配对会话 + ECDSA P-256 挑战验签。
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.10"
p256 = "0.13"
pkcs8 = { version = "0.10", default-features = false, features = ["std", "alloc"] }
